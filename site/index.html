<body>
<div id="root"></div>
<script>
const LOGO='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
<defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#4f5561"/><stop offset=".55" stop-color="#252a34"/><stop offset="1" stop-color="#0b0e14"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2ad"/><stop offset=".22" stop-color="#f4c64d"/><stop offset=".52" stop-color="#bd7f16"/><stop offset=".78" stop-color="#f2c446"/><stop offset="1" stop-color="#fff1a0"/></linearGradient>

<rect width="900" height="500" rx="30" fill="url(#bg)"/>
<g filter="url(#shadow)">
  <g transform="translate(175 225)" fill="url(#gold)">
    <path d="M-18-108c25-20 58-31 93-28L54-94c-23-3-42 2-58 13Z"/><path d="M75-136c35 8 65 27 88 55l-47 8c-15-17-30-27-51-33Z"/><path d="M163-81c20 30 28 64 26 99l-47-24c3-22-1-39-11-57Z"/><path d="M189 18c-5 35-19 67-44 92l-23-48c16-15 25-31 29-52Z"/><path d="M145 110c-30 21-65 30-101 27l24-47c22 3 41-2 59-13Z"/><path d="M44 137c-35-5-68-20-94-47l48-8c14 17 30 28 52 34Z"/><path d="M-50 90c-21-29-30-63-27-98l47 24c-3 22 2 39 12 57Z"/><path d="M-77-8c5-36 20-68 45-93l23 48c-15 15-24 31-28 53Z"/>
    <circle cx="54" cy="0" r="57" fill="#12161d"/><circle cx="54" cy="0" r="61" fill="none" stroke="#f3c74e" stroke-width="2" opacity=".28"/>
  </g>
  <text x="620" y="252" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="190" font-weight="900" letter-spacing="-10" fill="url(#gold)">FBI</text>
  <text x="620" y="338" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" letter-spacing="4" fill="#f0d37a">FILM BEYOND IMAGINATION</text>
</g>
</svg>`);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmt=n=>{n=Number(n||0);if(!n)return'0 B';const u=['B','KB','MB','GB','TB'];const i=Math.min(u.length-1,Math.floor(Math.log(n)/Math.log(1024)));return(n/1024**i).toFixed(i?1:0)+' '+u[i]};
const api=async(url,opt={})=>{
  try{
    const r=await fetch(url,{credentials:'same-origin',...opt});
    let d=null;try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d?.error||'Request failed');
    if(String(url).startsWith('/api/public/share/')){
      const token=decodeURIComponent(String(url).split('/').pop()||'');
      if(token)try{localStorage.setItem('fbi:share:'+token,JSON.stringify(d))}catch{}
    }
    return d;
  }catch(e){
    if(String(url).startsWith('/api/public/share/')){
      const token=decodeURIComponent(String(url).split('/').pop()||'');
      try{
        const cached=localStorage.getItem('fbi:share:'+token);
        if(cached)return {...JSON.parse(cached),__offline:true};
      }catch{}
    }
    throw e;
  }
};
const ext=n=>String(n||'').split('.').pop().toLowerCase();
const icon=n=>{const e=ext(n);if(['jpg','jpeg','png','gif','webp','heic'].includes(e))return'🖼️';if(['mp4','mov','mkv','avi','webm'].includes(e))return'🎬';if(['mp3','wav','m4a','aac'].includes(e))return'🎵';if(e==='pdf')return'📕';if(['zip','rar','7z'].includes(e))return'📦';if(['doc','docx','txt'].includes(e))return'📄';if(['xls','xlsx','csv'].includes(e))return'📊';return'📎'};
const isImage=f=>/^image\//.test(f.mime_type||'');
const isVideo=f=>/^video\//.test(f.mime_type||'');
const isPdf=f=>f.mime_type==='application/pdf';
let current=null,projects=[];

function loginView(){
  document.body.innerHTML=`<div class="login"><div class="loginbox"><div class="loginhead"><img src="${LOGO}"><h1>FBI Client File Studio</h1><p>Cloud client delivery system</p></div><div class="loginbody"><div class="field"><label>Email</label><input id="email" value="filmbyfbi@gmail.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Studio password"></div><button class="btn primary" id="login" style="width:100%">Cloud Login</button><button class="btn" id="installApp" style="width:100%;margin-top:8px">Install App</button><div id="err" style="color:#fecaca;font-size:11px;margin-top:8px"></div><div class="notice">This studio is hosted on Railway. Your projects and uploaded files are kept in the Railway database and persistent storage.</div></div></div></div>`;
  document.querySelector('#login').onclick=async()=>{try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});location.href='/'}catch(e){document.querySelector('#err').textContent=e.message}};
}
async function boot(){
  const path=location.pathname;
  if(path.startsWith('/share/')) return clientView(path.split('/')[2]||'');
  const me=await api('/api/auth/me'); if(!me.authenticated)return loginView(); studioView();
}
async function loadProjects(){
  const q=document.querySelector('#search')?.value||'';
  const status=document.querySelector('#projectStatus')?.value||'active';
  const d=await api('/api/projects?q='+encodeURIComponent(q)+'&status='+encodeURIComponent(status));projects=d.projects||[];
  renderProjects();
  updateStats();
}
function updateStats(){
  const total=projects.reduce((a,p)=>a+Number(p.total_bytes||0),0);
  document.querySelector('#sp').textContent=projects.length;
  document.querySelector('#sf').textContent=projects.reduce((a,p)=>a+Number(p.file_count||0),0);
  document.querySelector('#ss').textContent=fmt(total);
  document.querySelector('#sh').textContent=projects.filter(p=>p.shared).length;
}
function renderProjects(){
  const el=document.querySelector('#projectList');if(!el)return;
  if(!projects.length){el.innerHTML='<div class="empty">No projects yet.</div>';return;}
  el.innerHTML=projects.map(p=>'<div class="project '+(current?.id===p.id?'sel':'')+'" data-id="'+p.id+'"><div class="row"><b>'+esc(p.name)+'</b><span class="tag">'+(p.archived?'Archived':(p.shared?'Shared':'Draft'))+'</span></div><div class="meta">'+esc(p.client_name||'No client')+' • '+(p.file_count||0)+' file'+(Number(p.file_count)===1?'':'s')+' • '+fmt(p.total_bytes||0)+'</div></div>').join('');
  el.querySelectorAll('.project').forEach(function(x){x.onclick=function(){openProject(x.dataset.id)}});
  const stats=document.querySelector('#projectStats');if(stats)stats.textContent=projects.length+' project'+(projects.length===1?'':'s');
}
async function openProject(id){
  const d=await api('/api/projects/'+id);current={...d.project,files:d.files};renderProjects();renderCurrent();
}
function renderCurrent(){
  const pane=document.querySelector('#current');if(!pane)return;
  if(!current){pane.innerHTML='<div class="empty">Select a project to manage it.</div>';return}
  const share=current.shared?location.origin+'/share/'+current.share_token:'';
  const totalSize=current.files.reduce((a,f)=>a+Number(f.size_bytes||0),0);
  pane.innerHTML=
    '<div class="media-manager">'+
      '<aside class="media-sidebar">'+
        '<div class="ms-section">Project</div>'+
        '<div class="ms-nav"><button id="projectOverview" class="active">Overview</button><button id="projectFilesNav">Files</button><button id="projectSharedNav">Client Share</button><button id="projectDownloadsNav">Downloads</button></div>'+
        '<div class="ms-section">Folders</div>'+
        '<div class="side-projects" id="folderList"></div>'+
        '<div style="margin-top:auto"><div class="ms-section">Project Details</div><div class="details">'+
        '<b>Client</b><br>'+esc(current.client_name||'No client')+'<br><br><b>Files</b><br>'+current.files.length+' • '+fmt(totalSize)+'<br><br><b>Status</b><br>'+(current.archived?'Archived':'Active')+
        '</div></div>'+
      '</aside>'+
      '<section class="media-main">'+
        '<div class="media-topbar"><div><div class="title">'+esc(current.name)+'</div><div class="sub">'+esc(current.client_name||'No client')+' • '+current.files.length+' files • '+fmt(totalSize)+'</div></div><div class="grow"></div>'+

let uploadQueue=[];
let uploadTicker=null;
const PART_CONCURRENCY=4;
const FILE_CONCURRENCY=2;
const MIN_PART_SIZE=64*1024*1024;
const MAX_PARTS=10000;

function chooseLocalPartSize(size){
  var part=MIN_PART_SIZE;
  while(Math.ceil(size/part)>MAX_PARTS)part*=2;
  return part;
}
function bytesToBase64(bytes){
  var out="";
  for(var i=0;i<bytes.length;i++)out+=String.fromCharCode(bytes[i]);
  return btoa(out);
}
async function sha256Base64(blob){
  var digest=await crypto.subtle.digest("SHA-256",await blob.arrayBuffer());
  return bytesToBase64(new Uint8Array(digest));
}
async function prepareIntegrity(item){
  var partSize=chooseLocalPartSize(item.file.size||1);
  var totalParts=Math.max(1,Math.ceil(item.file.size/partSize));
  item.status="checking";
  item.checksums=[];
  item.loadedBytes=0;
  renderUploadQueue();
  var rawHashes=[];
  for(var pn=1;pn<=totalParts;pn++){
    if(item.paused)throw new Error("Upload paused");
    var start=(pn-1)*partSize,end=Math.min(item.file.size,start+partSize);
    var digest=await crypto.subtle.digest("SHA-256",await item.file.slice(start,end).arrayBuffer());
    var bytes=new Uint8Array(digest);
    item.checksums.push(bytesToBase64(bytes));
    rawHashes.push(bytes);
    item.loadedBytes=Math.min(item.totalBytes,end);
    renderUploadQueue();
  }
  var header=new TextEncoder().encode(String(item.file.size)+":"+String(partSize)+":");
  var combined=new Uint8Array(header.length+rawHashes.length*32),offset=0;
  combined.set(header,offset);offset+=header.length;
  rawHashes.forEach(function(bytes){combined.set(bytes,offset);offset+=bytes.length});
  item.fingerprint=bytesToBase64(new Uint8Array(await crypto.subtle.digest("SHA-256",combined)));
  item.fileChecksum=totalParts===1?item.checksums[0]:null;
  item.integrityPartSize=partSize;
  item.loadedBytes=0;
  item.status="uploading";
  renderUploadQueue();
}

function fmtRate(n){return fmt(n)+"/s"}
function etaText(sec){
  if(!Number.isFinite(sec)||sec<=0)return"--";
  sec=Math.round(sec);var hh=Math.floor(sec/3600);var mm=Math.floor((sec%3600)/60);var ss=sec%60;
  return hh?hh+"h "+mm+"m":mm?mm+"m "+ss+"s":ss+"s";
}
function uploadStats(item){
  var elapsed=Math.max(.1,(Date.now()-item.startedAt)/1000);
  var rate=item.loadedBytes/elapsed;
  var remain=Math.max(0,item.totalBytes-item.loadedBytes);
  return {rate:rate,eta:rate?remain/rate:Infinity,pct:item.totalBytes?Math.min(100,item.loadedBytes/item.totalBytes*100):0};
}
function renderUploadQueue(){
  var box=document.querySelector("#uploadBox");if(!box)return;
  var list=uploadQueue.filter(function(x){return x.projectId===current.id && x.status!=="cancelled";});
  if(!list.length){box.innerHTML="";return}
  var html="";
  list.forEach(function(item){
    var p=uploadStats(item);
    var action=item.status==="paused"?"<button class='mini' data-upresume='"+item.id+"'>Resume</button>":(item.status==="queued"||item.status==="checking"||item.status==="deduplicated"?"":"<button class='mini' data-uppause='"+item.id+"'>Pause</button>");
    html+="<div class='upload-item'><div class='utop'><div class='uname'>"+esc(item.relativePath)+"</div><div>"+p.pct.toFixed(0)+"%</div></div>";
    html+="<div class='ustatus'>"+esc(item.status)+(item.mode?" • "+esc(item.mode):"")+" • "+fmt(item.loadedBytes)+" / "+fmt(item.totalBytes)+" • "+(p.rate?fmtRate(p.rate):"--")+" • ETA "+etaText(p.eta)+"</div>";
    html+="<div class='ubar'><i style='width:"+p.pct+"%'></i></div>";
    html+="<div class='ufoot'><span>"+(item.resumed?"Resumed session":item.status==="deduplicated"?"Already stored":"Lossless direct cloud upload")+"</span><span>"+action+" <button class='mini' data-upcancel='"+item.id+"'>Cancel</button></span></div></div>";
  });
  box.innerHTML=html;
  box.querySelectorAll("[data-uppause]").forEach(function(b){b.onclick=function(){pauseUpload(b.dataset.uppause)}});
  box.querySelectorAll("[data-upresume]").forEach(function(b){b.onclick=function(){resumeUpload(b.dataset.upresume)}});
  box.querySelectorAll("[data-upcancel]").forEach(function(b){b.onclick=function(){cancelUpload(b.dataset.upcancel)}});
}
function xhrPut(url,blob,headers,item,onProgress){
  return new Promise(function(resolve,reject){
    var x=new XMLHttpRequest();item.xhrs.add(x);x.open("PUT",url,true);x.timeout=0;
    Object.keys(headers||{}).forEach(function(k){x.setRequestHeader(k,headers[k])});
    x.upload.onprogress=function(e){if(e.lengthComputable)onProgress(e.loaded)};
    x.onload=function(){item.xhrs.delete(x);if(x.status>=200&&x.status<300)resolve({etag:x.getResponseHeader("ETag")||""});else reject(new Error("Upload returned HTTP "+x.status))};
    x.onerror=function(){item.xhrs.delete(x);reject(new Error("Network error during upload"))};
    x.onabort=function(){item.xhrs.delete(x);reject(new Error("Upload paused"))};
    x.ontimeout=function(){item.xhrs.delete(x);reject(new Error("Upload timed out"))};
    x.send(blob);
  });
}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function retry(fn,max){
  var last=null;max=max||3;
  for(var i=0;i<max;i++){try{return await fn()}catch(e){last=e;if(i<max-1)await wait(800*(i+1))}}
  throw last;
}
async function uploadSingle(item,session){
  item.loadedBytes=0;renderUploadQueue();
  var headers={"Content-Type":item.file.type||"application/octet-stream"};
  if(item.fileChecksum)headers["x-amz-checksum-sha256"]=item.fileChecksum;
  await retry(function(){return xhrPut(session.url,item.file,headers,item,function(n){item.loadedBytes=n;renderUploadQueue()})});
  if(item.paused)throw new Error("Upload paused");
  await api("/api/uploads/"+item.sessionId+"/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
  item.loadedBytes=item.totalBytes;
}
async function getPartUrl(sessionId,pn,checksum){
  var body={parts:[{partNumber:pn,checksum:checksum||""}]};
  var d=await api("/api/uploads/"+sessionId+"/parts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  return d.parts[0];
}
async function uploadMultipart(item,session){
  var partSize=Number(session.partSize);
  var totalParts=Math.ceil(item.file.size/partSize);
  var state=await api("/api/uploads/"+item.sessionId+"/state");
  var completed=new Map((state.parts||[]).map(function(p){return [Number(p.partNumber),p]}));
  item.loadedBytes=0;var parts=[];
  completed.forEach(function(p,pn){
    var a=(pn-1)*partSize,b=Math.min(item.file.size,a+partSize);
    item.loadedBytes+=Math.max(0,b-a);parts.push({partNumber:pn,etag:p.etag});
  });
  var missing=[];for(var pn=1;pn<=totalParts;pn++)if(!completed.has(pn))missing.push(pn);
  renderUploadQueue();
  while(missing.length){
    if(item.paused)throw new Error("Upload paused");
    var batch=missing.splice(0,PART_CONCURRENCY);
    await Promise.all(batch.map(async function(partNumber){
      var start=(partNumber-1)*partSize,end=Math.min(item.file.size,start+partSize),blob=item.file.slice(start,end),lastLoaded=0;
      var checksum=(item.checksums||[])[partNumber-1]||"";
      var out=await retry(async function(){
        var signed=await getPartUrl(item.sessionId,partNumber,checksum);
        lastLoaded=0;
        var headers={};
        if(signed.checksum)headers["x-amz-checksum-sha256"]=signed.checksum;
        return xhrPut(signed.url,blob,headers,item,function(n){item.loadedBytes+=(n-lastLoaded);lastLoaded=n;renderUploadQueue()});
      },3);
      var idx=parts.findIndex(function(p){return p.partNumber===partNumber});
      if(idx>=0)parts[idx]={partNumber:partNumber,etag:out.etag};else parts.push({partNumber:partNumber,etag:out.etag});
    }));
  }
  if(item.paused)throw new Error("Upload paused");
  await api("/api/uploads/"+item.sessionId+"/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({parts:parts})});
  item.loadedBytes=item.totalBytes;
}
async function uploadOne(item){
  item.startedAt=Date.now();item.status="queued";renderUploadQueue();
  try{
    await prepareIntegrity(item);
    var session=await api("/api/uploads/init",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      projectId:item.projectId,name:item.file.name,relativePath:item.relativePath,size:item.file.size,mimeType:item.file.type||"application/octet-stream",
      fingerprint:item.fingerprint||"",checksum:item.fileChecksum||""
    })});
    item.sessionId=session.uploadId;item.mode=session.mode;item.resumed=!!session.resumed;
    if(session.deduplicated){
      item.status="deduplicated";item.loadedBytes=item.totalBytes;renderUploadQueue();
      await loadProjects();await openProject(item.projectId);toast("Already stored: "+item.file.name);return;
    }
    if(session.mode==="single")await uploadSingle(item,session);else await uploadMultipart(item,session);
    item.status="completed";item.error="";renderUploadQueue();
    await loadProjects();await openProject(item.projectId);toast("Uploaded without quality loss: "+item.file.name);
  }catch(e){
    if(item.paused){item.status="paused";renderUploadQueue();return}
    item.status="error";item.error=e.message||"Upload failed";renderUploadQueue();toast(item.error);
  }
}
async function pumpUploads(){
  var running=uploadQueue.filter(function(x){return x.status==="uploading"||x.status==="checking"}).length;
  while(running<FILE_CONCURRENCY){
    var next=uploadQueue.find(function(x){return x.status==="queued"});
    if(!next)break;running++;uploadOne(next).finally(function(){pumpUploads()});
  }
  renderUploadQueue();
}
function uploadFiles(list){
  if(!list||!list.length||!current)return;
  Array.from(list).forEach(function(file){
    uploadQueue.push({id:crypto.randomUUID(),projectId:current.id,file:file,relativePath:file.webkitRelativePath||file.name,totalBytes:file.size,loadedBytes:0,status:"queued",xhrs:new Set(),checksums:[]});
  });
  if(!uploadTicker)uploadTicker=setInterval(renderUploadQueue,500);
  renderUploadQueue();pumpUploads();
}
function pauseUpload(id){
  var item=uploadQueue.find(function(x){return x.id===id});if(!item)return;
  item.paused=true;Array.from(item.xhrs||[]).forEach(function(x){try{x.abort()}catch{}});
  item.status="paused";renderUploadQueue();
}
function resumeUpload(id){
  var item=uploadQueue.find(function(x){return x.id===id});if(!item)return;
  item.paused=false;item.status="queued";pumpUploads();
}
async function cancelUpload(id){
  var item=uploadQueue.find(function(x){return x.id===id});if(!item)return;
  item.paused=true;Array.from(item.xhrs||[]).forEach(function(x){try{x.abort()}catch{}});
  if(item.sessionId)await api("/api/uploads/"+item.sessionId+"/abort",{method:"POST"}).catch(function(){});
  item.status="cancelled";renderUploadQueue();toast("Upload cancelled");
}

async function ndiLocal(path,body){
  const r=await fetch('http://127.0.0.1:8765'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(function(){return {error:'Gateway error'}});
  if(!r.ok)throw new Error(d.error||'Gateway request failed');
  return d;
}
function updateNdiGatewayUI(g){
  const on=Boolean(g&&g.connected);
  const b=document.querySelector('#ndiGatewayBadge'),c=document.querySelector('#ndiGatewayState');
  if(b){b.textContent=on?'Gateway connected':'Gateway offline';b.className='ndi-status'+(on?' on':'')}
  if(c)c.textContent=on?'Connected':'Offline';
  const dm=document.querySelector('#ndiDiscoveryMode');if(dm)dm.textContent=(g&&g.discovery)||'Automatic LAN discovery';
  const sc=document.querySelector('#ndiSourceCount');if(sc)sc.textContent=String((g&&g.sources)||0);
  const inOn=Boolean(g&&g.input&&g.input.running);
  const outOn=Boolean(g&&g.output&&g.output.running);
  const i=document.querySelector('#ndiInState');if(i)i.textContent=inOn?'Running':'Stopped';
  const o=document.querySelector('#ndiOutState');if(o)o.textContent=outOn?'Running':'Stopped';
  const ib=document.querySelector('#ndiInToggle');if(ib){ib.textContent=inOn?'Turn NDI IN OFF':'Turn NDI IN ON';ib.className='btn '+(inOn?'danger':'primary');}
  const ob=document.querySelector('#ndiOutToggle');if(ob){ob.textContent=outOn?'Turn NDI OUT OFF':'Turn NDI OUT ON';ob.className='btn '+(outOn?'danger':'primary');}
  const im=document.querySelector('#ndiInMonitor');if(im)im.innerHTML='NDI IN status: <b>'+esc(g&&g.input&&g.input.message||'Stopped')+'</b>';
  const om=document.querySelector('#ndiOutMonitor');if(om)om.innerHTML='NDI OUT status: <b>'+esc(g&&g.output&&g.output.message||'Stopped')+'</b>';
}

  const selected=new Set(), filteredState={filter:'all',sort:'name',q:''};

  function matches(f){
    const t=typeOf(f);if(filteredState.filter!=='all'&&t!==filteredState.filter)return false;

  renderGrid();updateBulk();
 }catch(e){document.body.innerHTML='<div class="client"><div class="clientwrap"><div class="ctop"><img src="'+LOGO+'"><h1>Delivery unavailable</h1><p>'+esc(e.message)+'</p></div></div></div>';}
}
function isPdfFile(f){return /^application\/pdf$/i.test(f?.mime_type||'') || /\.pdf$/i.test(f?.original_name||'')}
window.__fbiPreviewFiles=window.__fbiPreviewFiles||[];
window.__fbiPreviewIndex=0;
function openClientPreviewIndex(index,direction){
 const list=window.__fbiPreviewFiles||[];
 if(!list.length)return;
 window.__fbiPreviewIndex=(index+list.length)%list.length;
 clientPreview(list[window.__fbiPreviewIndex],Number(direction)||0);
}
function clientPreview(f,direction){
 const m=document.querySelector('#v');if(!m||!f)return;
 const list=window.__fbiPreviewFiles||[],index=Math.max(0,list.findIndex(x=>x.id===f.id));
 window.__fbiPreviewIndex=index<0?0:index;
 const u=f.download_url||'',type=(f.mime_type||'').toLowerCase(),isImg=/^image\//.test(type),isVid=/^video\//.test(type),isAud=/^audio\//.test(type),isPdf=isPdfFile(f);
 const tokenValue=location.pathname.split('/')[2]||'';
 const thumb=isImg?'/api/public/thumb/'+encodeURIComponent(f.id)+'?token='+encodeURIComponent(tokenValue)+'&w=760&h=760':'';
 const previewHtml=isImg
   ?'<div class="fast-preview"><img id="previewFast" src="'+thumb+'" decoding="async" fetchpriority="high" alt=""><div class="previewloading" id="previewLoading">Loading preview…</div></div>'
   :isVid
     ?'<div class="fast-preview"><div class="previewloading" id="previewLoading">Loading video…</div><video id="previewVideo" controls autoplay playsinline preload="metadata" src="'+esc(u)+'"></video></div>'
     :isAud
       ?'<div class="fast-preview"><div class="previewloading" id="previewLoading">Loading audio…</div><audio id="previewAudio" controls autoplay preload="metadata" src="'+esc(u)+'"></audio></div>'
       :isPdf
         ?'<iframe src="'+esc(u)+'"></iframe>'
         :'<div class="empty">Preview is not available for this file type in the browser.</div>';
 m.innerHTML='<div class="viewerbox"><div class="vh"><b>'+esc(f.original_name)+'</b><div style="display:flex;gap:6px;align-items:center"><span class="previewcount">'+(window.__fbiPreviewIndex+1)+' / '+list.length+'</span><a class="btn primary" href="'+esc(u)+'&download=1" target="_blank" rel="noreferrer">Download</a><button class="close">×</button></div></div><div class="vc" id="previewViewport">'+previewHtml+'<div class="previewnav"><button id="prevFile" aria-label="Previous file">‹</button><button id="nextFile" aria-label="Next file">›</button></div></div></div>';
 m.classList.add('show');
 const close=()=>m.classList.remove('show');
 m.querySelector('.close').onclick=close;
 const prev=()=>openClientPreviewIndex(window.__fbiPreviewIndex-1,-1),next=()=>openClientPreviewIndex(window.__fbiPreviewIndex+1,1);
 m.querySelector('#prevFile').onclick=prev;m.querySelector('#nextFile').onclick=next;
 if(direction){
   const motionClass=direction>0?'preview-slide-next':'preview-slide-prev';
   const motionTargets=m.querySelectorAll('#previewViewport > .fast-preview, #previewViewport > iframe, #previewViewport > .empty');
   motionTargets.forEach(el=>el.classList.add(motionClass));
 }
 let x0=0,y0=0;
 const vp=m.querySelector('#previewViewport');
 vp.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY});
 vp.addEventListener('pointerup',e=>{const dx=e.clientX-x0,dy=e.clientY-y0;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){if(dx<0)next();else prev()}});
 vp.addEventListener('pointercancel',()=>{x0=0;y0=0});
 if(isImg){
   const img=m.querySelector('#previewFast'),loading=m.querySelector('#previewLoading');
   const full=new Image();full.decoding='async';
   full.onload=()=>{img.src=full.src;if(loading)loading.textContent='Preview ready';setTimeout(()=>loading&&loading.remove(),500)};
   full.onerror=()=>{if(loading)loading.textContent='Preview thumbnail shown.'};
   full.src='/api/public/preview/'+encodeURIComponent(f.id)+'?token='+encodeURIComponent(tokenValue)+'&w=1400&h=1400';
 }else{
   const media=m.querySelector('video,audio'),loading=m.querySelector('#previewLoading');
   if(media)media.addEventListener('loadeddata',()=>loading&&loading.remove(),{once:true});
   if(media)media.addEventListener('error',()=>loading&&(loading.textContent='Preview could not be loaded.'),{once:true});
 }
}
document.addEventListener('keydown',e=>{
 const v=document.querySelector('#v');if(!v||!v.classList.contains('show'))return;
 if(e.key==='ArrowRight'){e.preventDefault();openClientPreviewIndex(window.__fbiPreviewIndex+1)}
 if(e.key==='ArrowLeft'){e.preventDefault();openClientPreviewIndex(window.__fbiPreviewIndex-1)}
 if(e.key==='Escape')v.classList.remove('show');
});
function toast(msg){const t=document.querySelector('#toast');if(!t)return;t.textContent=msg;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.style.display='none',2200)}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
});
async function installFbiApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice}catch{}
    deferredInstallPrompt=null;
    return;
  }
  alert('To install FBI Client File Studio, use your browser menu and choose Install App or Add to Home Screen. On iPhone or iPad, use Safari Share and choose Add to Home Screen.');
}
document.addEventListener('click',event=>{
  if(event.target && event.target.id==='installApp')installFbiApp();
});
function updateOfflineBadge(){
  let el=document.querySelector('#pwaStatus');
  if(!el){
    el=document.createElement('div');
    el.id='pwaStatus';
    el.style.cssText='position:fixed;right:12px;bottom:12px;z-index:90;padding:8px 11px;border:1px solid var(--border);border-radius:999px;background:#111113;color:#9b9ba4;font-size:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)';
    document.body.appendChild(el);
  }
  el.textContent=navigator.onLine?'● Online':'● Offline mode';
  el.style.color=navigator.onLine?'#4ade80':'#f4d56d';
}
window.addEventListener('online',updateOfflineBadge);
window.addEventListener('offline',updateOfflineBadge);
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(err=>console.warn('PWA service worker registration failed',err));
  });
}
boot().then(()=>updateOfflineBadge()).catch(err=>{
  console.error(err);
  document.body.innerHTML='<div class="client"><div class="clientwrap"><div class="ctop"><img src="'+LOGO+'"><h1>Studio unavailable</h1><p>'+esc(err.message||'Please check your connection and try again.')+'</p><button class="btn" id="installApp" style="margin-top:12px">Install App</button></div></div></div>';
  updateOfflineBadge();
});
</script>
</body>
</html>
