<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>FBI Client File Studio</title>
<style>
:root{--bg:#09090a;--panel:#141416;--panel2:#1b1b1e;--border:#29292e;--text:#f6f6f7;--muted:#9b9ba4;--gold:#d4af37;--gold2:#f4d56d;--green:#4ade80;--red:#fb7185;--blue:#60a5fa;--shadow:0 18px 50px rgba(0,0,0,.28);--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#080809,#111114);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}body{min-height:100vh}
.app{display:flex;min-height:100vh}.side{width:245px;border-right:1px solid var(--border);padding:20px 14px;background:#0b0b0d;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;justify-content:center;padding:6px 8px 18px;border-bottom:1px solid var(--border)}.brand img{width:135px;height:48px;object-fit:contain}.brand small{display:block;color:var(--muted);text-align:center;font-size:10px;margin-top:2px}
.nav{margin-top:16px;display:grid;gap:7px}.nav button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:12px;padding:12px;text-align:left}.nav button:hover,.nav button.active{background:#171719;color:var(--text);border-color:var(--border)}.nav button.active{box-shadow:inset 3px 0 var(--gold)}
.sidefoot{position:absolute;bottom:18px;left:16px;right:16px;color:var(--muted);font-size:10px;line-height:1.5}
.main{flex:1;min-width:0;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.top h1{margin:0;font-size:28px}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:#171719;color:#f1f1f3;padding:10px 13px;border-radius:11px}.btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:#d1ac3a;color:#111;font-weight:800}.btn.danger{color:#fecaca}.btn:disabled{opacity:.5;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.card{border:1px solid var(--border);background:linear-gradient(180deg,#161619,#121214);padding:16px;border-radius:15px;box-shadow:var(--shadow)}.card small{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px}.card strong{display:block;font-size:25px;margin-top:6px}.card span{color:var(--muted);font-size:10px}
.layout{display:grid;grid-template-columns:minmax(280px,.72fr) minmax(0,1.28fr);gap:16px}.panel{border:1px solid var(--border);background:rgba(19,19,21,.96);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}.ph{padding:16px 17px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center}.ph h2{font-size:14px;margin:0}.ph p{font-size:10px;color:var(--muted);margin:3px 0 0}.body{padding:14px 16px}
.search{width:100%;background:#0f0f11;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 11px;outline:none;margin-bottom:12px}
.project{border:1px solid var(--border);background:#111113;border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer}.project:hover,.project.sel{border-color:rgba(212,175,55,.55);box-shadow:inset 0 0 0 1px rgba(212,175,55,.12)}.project b{font-size:12px}.project .meta{font-size:10px;color:var(--muted);margin-top:3px}.tag{font-size:9px;padding:4px 7px;border:1px solid var(--border);border-radius:999px;color:#ccc}
.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.field input,.field textarea{width:100%;padding:10px;border-radius:10px;background:#0e0e10;color:var(--text);border:1px solid var(--border);outline:none}.field textarea{min-height:75px;resize:vertical}.field input:focus,.field textarea:focus{border-color:rgba(212,175,55,.7)}
.share{display:flex;gap:8px}.share input{flex:1;min-width:0;background:#0e0e10;color:#ddd;border:1px solid var(--border);border-radius:10px;padding:9px;font-size:10px}
.drop{margin-top:10px;border:1px dashed #4a4a50;border-radius:14px;padding:20px;text-align:center;background:#101013}.drop.drag{border-color:var(--gold);background:#17150e}.drop h3{margin:0 0 5px;font-size:14px}.drop p{margin:0;color:var(--muted);font-size:10px}.drop input{display:none}
.file{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);background:#111113;border-radius:12px;margin-bottom:8px}.ico{width:38px;height:38px;background:#1b1b1f;border-radius:10px;display:grid;place-items:center}.file b{font-size:11px;word-break:break-word}.file small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.file .acts{display:flex;gap:6px}.mini{background:#18181b;color:#e8e8ea;border:1px solid var(--border);padding:7px 8px;border-radius:8px;font-size:10px}
.empty{padding:35px 10px;text-align:center;color:var(--muted);font-size:11px}.progress{height:7px;background:#232327;border-radius:999px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .15s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.box{width:min(520px,100%);background:#151517;border:1px solid var(--border);border-radius:17px;overflow:hidden}.mh{padding:15px 17px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.mb{padding:18px}.mf{padding:14px 17px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:transparent;color:var(--muted);font-size:20px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(500px,100%);border:1px solid var(--border);border-radius:22px;background:#121215;box-shadow:0 30px 90px rgba(0,0,0,.5);overflow:hidden}.loginhead{text-align:center;padding:28px 24px;border-bottom:1px solid var(--border)}.loginhead img{width:105px;height:40px;object-fit:contain}.loginhead h1{font-size:24px;margin:12px 0 5px}.loginhead p{margin:0;color:var(--muted);font-size:12px}.loginbody{padding:22px 24px}.notice{padding:10px;border:1px solid rgba(212,175,55,.2);background:rgba(212,175,55,.05);border-radius:10px;color:#d8d2bd;font-size:10px;line-height:1.5;margin-top:12px}
.client{min-height:100vh;padding:20px;background:radial-gradient(circle at 50% 0,rgba(212,175,55,.08),transparent 40%),#09090a}.clientwrap{width:min(980px,100%);margin:auto}.ctop{text-align:center;padding:20px 10px 15px}.ctop img{width:100px;height:38px;object-fit:contain}.ctop h1{margin:12px 0 5px;font-size:25px}.ctop p{margin:0;color:var(--muted);font-size:11px}.ccard{border:1px solid var(--border);background:#121214;border-radius:19px;overflow:hidden;box-shadow:var(--shadow)}.chead{padding:18px;border-bottom:1px solid var(--border)}.chead h2{margin:0;font-size:20px}.chead p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.cfiles{padding:14px}.cfile{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);background:#101012;border-radius:13px;margin-bottom:9px}.cfile .name{font-size:12px;font-weight:700;word-break:break-word}.cfile .meta{font-size:10px;color:var(--muted);margin-top:3px}.clientfoot{text-align:center;color:#66666e;font-size:9px;padding:18px}.viewer{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.viewer.show{display:flex}.viewerbox{width:min(1100px,100%);max-height:95vh;background:#111;border:1px solid var(--border);border-radius:16px;overflow:hidden}.vh{display:flex;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--border)}.vc{padding:14px;display:grid;place-items:center;max-height:88vh;overflow:auto}.vc img,.vc video{max-width:100%;max-height:80vh;border-radius:10px}.vc iframe{width:100%;height:78vh;border:0;border-radius:10px;background:white}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{width:205px}}
@media(max-width:720px){.app{display:block}.side{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--border)}.sidefoot{display:none}.brand{padding-bottom:10px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center}.main{padding:15px}.top{flex-direction:column}.actions{width:100%}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.file{grid-template-columns:auto 1fr}.file .acts{grid-column:2}.cfile{grid-template-columns:auto 1fr}.cfile .btn{grid-column:2}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const LOGO='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1UAAACqCAYAAABh0rXqAAAAAXNSR0IArs4c6QAAABxpRE9UAAAAAgAAAAAAAADAAAAKAAAAAEAAAAAAAAAAgAAAABkZXNjAAAAIAAAACAAAAAgAAAAZHVW5rAAAAFAAAACAAAAAQAAAAaGJ4AAAAUAAAACAAAAAQAAAER2cHkiAAAAFAAAABgAAAAQAAAAScGF0aAAAABAAAAAQAAAAcHhyAAAAF4AAAAkAAAACAAAAAgAAAAgbWFtAAAAFAAAACAAAAAQAAAAaW1hZwAAABQAAAAgAAAABAAAAE5iaWcAAAAUAAAADAAAAAQAAAATAAAAAG1heAAAAFAAAAAgAAAABAAAAE5vcmcAAAAUAAAAEAAAAAQAAAABAAAACaWNjAAAAFAAAACAAAAAQAAAAMAAAABnAAAAB4AAABsAAAAlHicY2BkYGBgYGBgZmJiYGBgYGBgYmBgYmBgZGBgYGBgYGBgYGAAAAAIAAAAD//wMAAABJcEhZcwAACxMAAAsTAQCanBgAAAAgY0hNRAAASAAAAAgAAAAeJztncYkBAAAABmJLR0QA/wD/AP+gvaeTAAAAKFBMVEUAAAD///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////wAAACH5BAEAAAQALAAAAAABAAEAAAICTAEAOw==';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmt=n=>{n=Number(n||0);if(!n)return'0 B';const u=['B','KB','MB','GB','TB'];const i=Math.min(u.length-1,Math.floor(Math.log(n)/Math.log(1024)));return(n/1024**i).toFixed(i?1:0)+' '+u[i]};
const api=async(url,opt={})=>{const r=await fetch(url,{credentials:'same-origin',...opt});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||'Request failed');return d};
const ext=n=>String(n||'').split('.').pop().toLowerCase();
const icon=n=>{const e=ext(n);if(['jpg','jpeg','png','gif','webp','heic'].includes(e))return'🖼️';if(['mp4','mov','mkv','avi','webm'].includes(e))return'🎬';if(['mp3','wav','m4a','aac'].includes(e))return'🎵';if(e==='pdf')return'📕';if(['zip','rar','7z'].includes(e))return'📦';if(['doc','docx','txt'].includes(e))return'📄';if(['xls','xlsx','csv'].includes(e))return'📊';return'📎'};
const isImage=f=>/^image\//.test(f.mime_type||'');
const isVideo=f=>/^video\//.test(f.mime_type||'');
const isPdf=f=>f.mime_type==='application/pdf';
let current=null,projects=[];

function loginView(){
  document.body.innerHTML=`<div class="login"><div class="loginbox"><div class="loginhead"><img src="${LOGO}"><h1>FBI Client File Studio</h1><p>Cloud client delivery system</p></div><div class="loginbody"><div class="field"><label>Email</label><input id="email" value="filmbyfbi@gmail.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Studio password"></div><button class="btn primary" id="login" style="width:100%">Cloud Login</button><div id="err" style="color:#fecaca;font-size:11px;margin-top:8px"></div><div class="notice">This studio is hosted on Railway. Your projects and uploaded files are kept in the Railway database and persistent storage.</div></div></div></div>`;
  document.querySelector('#login').onclick=async()=>{try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});location.href='/'}catch(e){document.querySelector('#err').textContent=e.message}};
}
async function boot(){
  const path=location.pathname;
  if(path.startsWith('/share/')) return clientView(path.split('/')[2]||'');
  const me=await api('/api/auth/me'); if(!me.authenticated)return loginView(); studioView();
}
async function loadProjects(){
  const q=document.querySelector('#search')?.value||'';
  const d=await api('/api/projects?q='+encodeURIComponent(q));projects=d.projects||[];
  renderProjects();
  updateStats();
}
function updateStats(){
  const total=projects.reduce((a,p)=>a+Number(p.total_bytes||0),0);
  document.querySelector('#sp').textContent=projects.length;
  document.querySelector('#sf').textContent=projects.reduce((a,p)=>a+Number(p.file_count||0),0);
  document.querySelector('#ss').textContent=fmt(total);
  document.querySelector('#sh').textContent=projects.filter(p=>p.shared).length;
}
function renderProjects(){
  const el=document.querySelector('#projectList');if(!el)return;
  if(!projects.length){el.innerHTML='<div class="empty">No projects yet.</div>';return;}
  el.innerHTML=projects.map(p=>`<div class="project ${current?.id===p.id?'sel':''}" data-id="${p.id}"><div class="row"><b>${esc(p.name)}</b><span class="tag">${p.shared?'Shared':'Draft'}</span></div><div class="meta">${esc(p.client_name||'No client')} • ${p.file_count||0} file${Number(p.file_count)===1?'':'s'}</div></div>`).join('');
  el.querySelectorAll('.project').forEach(x=>x.onclick=()=>openProject(x.dataset.id));
}
async function openProject(id){
  const d=await api('/api/projects/'+id);current={...d.project,files:d.files};renderProjects();renderCurrent();
}
function renderCurrent(){
  const pane=document.querySelector('#current');if(!pane)return;
  if(!current){pane.innerHTML='<div class="empty">Select a project to manage it.</div>';return}
  const share=current.shared?location.origin+'/share/'+current.share_token:'';
  pane.innerHTML=`<div class="ph"><div><h2>${esc(current.name)}</h2><p>${esc(current.client_name||'No client')}</p></div><div class="actions"><button class="btn" id="regen">New Link</button><button class="btn danger" id="deleteProject" style="display:none">Delete</button></div></div>
  <div class="body">
    <div class="grid2">
      <div class="field"><label>Project Name</label><input id="pn" value="${esc(current.name)}"></div>
      <div class="field"><label>Client Name</label><input id="cn" value="${esc(current.client_name)}"></div>
      <div class="field"><label>Client Email</label><input id="ce" value="${esc(current.client_email)}"></div>
      <div class="field"><label>Expiry</label><input id="ex" type="datetime-local" value="${current.expires_at?new Date(current.expires_at).toISOString().slice(0,16):''}"></div>
    </div>
    <div class="field"><label>Client Note</label><textarea id="note">${esc(current.note)}</textarea></div>
    <div class="row" style="margin:6px 0 10px"><div style="font-size:10px;color:var(--muted)">CLIENT SHARE LINK</div><button class="btn primary" id="shareNow">${current.shared?'Copy Link':'Create Share Link'}</button></div>
    <div class="share" style="margin-bottom:12px"><input id="link" readonly value="${share}" placeholder="Create a share link"></div>
    <div class="drop" id="drop"><h3>Drop files here</h3><p>Photos, videos, PDFs, ZIPs and client deliverables.</p><div style="height:10px"></div><label class="btn" for="pick">Choose Files</label><input id="pick" type="file" multiple></div>
    <div id="uploadBox"></div>
    <div style="height:12px"></div>
    <div class="row"><b style="font-size:12px">Files (${current.files.length})</b><span style="font-size:10px;color:var(--muted)">${fmt(current.files.reduce((a,f)=>a+Number(f.size_bytes||0),0))}</span></div>
    <div style="height:8px"></div>
    <div id="files"></div>
  </div>`;
  document.querySelector('#regen').onclick=async()=>{const d=await api('/api/projects/'+current.id+'/regenerate-link',{method:'POST'});current={...current,...d.project};renderCurrent();loadProjects()};
  document.querySelector('#shareNow').onclick=async()=>{if(!current.shared){const d=await api('/api/projects/'+current.id+'/regenerate-link',{method:'POST'});current={...current,...d.project};await loadProjects();renderCurrent();}else{navigator.clipboard.writeText(document.querySelector('#link').value);toast('Link copied')}};
  ['pn','cn','ce','note','ex'].forEach(id=>document.querySelector('#'+id).onchange=saveProject);
  const pick=document.querySelector('#pick');pick.onchange=()=>uploadFiles(pick.files);
  const drop=document.querySelector('#drop');['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>uploadFiles(e.dataTransfer.files));
  document.querySelector('#files').innerHTML=current.files.length?current.files.map(f=>`<div class="file"><div class="ico">${icon(f.original_name)}</div><div><b>${esc(f.original_name)}</b><small>${fmt(f.size_bytes)} • ${esc(f.mime_type)}</small></div><div class="acts"><button class="mini" data-prev="${f.id}">Preview</button><button class="mini" data-del="${f.id}">Delete</button></div></div>`).join(''):'<div class="empty">No files uploaded yet.</div>';
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this file?'))return;await api('/api/files/'+b.dataset.del,{method:'DELETE'});openProject(current.id);toast('File deleted')});
  document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>previewAdmin(current.files.find(x=>x.id===b.dataset.prev)));
}
async function saveProject(){
  const body={name:pn.value,client_name:cn.value,client_email:ce.value,note:note.value,expires_at:ex.value?new Date(ex.value).toISOString():null};
  const d=await api('/api/projects/'+current.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});current={...current,...d.project};loadProjects();toast('Project saved');
}
function uploadFiles(list){
  if(!list||!list.length)return;
  const files=Array.from(list);const box=document.querySelector('#uploadBox');
  box.innerHTML=`<div class="card" style="margin-top:10px"><small>Uploading</small><div id="progText" style="font-size:11px;margin-top:5px">Preparing ${files.length} file${files.length===1?'':'s'}…</div><div class="progress"><i id="bar"></i></div></div>`;
  const form=new FormData();files.forEach(f=>form.append('files',f));
  const xhr=new XMLHttpRequest();xhr.open('POST','/api/projects/'+current.id+'/files');xhr.withCredentials=true;
  xhr.upload.onprogress=e=>{if(e.lengthComputable){const pct=Math.round(e.loaded/e.total*100);document.querySelector('#bar').style.width=pct+'%';document.querySelector('#progText').textContent=pct+'% • '+fmt(e.loaded)+' / '+fmt(e.total)}};
  xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300){toast('Upload complete');openProject(current.id)}else{let t='Upload failed';try{t=JSON.parse(xhr.responseText).error||t}catch{};toast(t)}};xhr.onerror=()=>toast('Network error during upload');xhr.send(form);
}
function studioView(){
 document.body.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div><img src="${LOGO}"><small>Client File Studio</small></div></div><nav class="nav"><button class="active">▣ &nbsp;Projects</button><button onclick="toast('Dashboard is the Projects workspace')">⌂ &nbsp;Dashboard</button><button onclick="toast('Analytics will use download records')">◔ &nbsp;Downloads</button><button onclick="toast('Settings are managed from Railway Variables')">⚙ &nbsp;Settings</button></nav><div class="sidefoot">Cloud storage: Railway<br>Database: Railway PostgreSQL<br>Files: persistent /data volume</div></aside><main class="main"><div class="top"><div><h1>FBI Client File Studio</h1><p>Upload, organize and securely deliver client files.</p></div><div class="actions"><button class="btn" id="logout">Logout</button><button class="btn primary" id="new">＋ New Project</button></div></div><div class="cards"><div class="card"><small>Projects</small><strong id="sp">0</strong><span>Client delivery spaces</span></div><div class="card"><small>Files</small><strong id="sf">0</strong><span>Uploaded deliverables</span></div><div class="card"><small>Storage</small><strong id="ss">0 B</strong><span>Current file storage</span></div><div class="card"><small>Shared</small><strong id="sh">0</strong><span>Active delivery links</span></div></div><div class="layout"><div class="panel"><div class="ph"><div><h2>Projects</h2><p>Search and select a client delivery.</p></div></div><div class="body"><input id="search" class="search" placeholder="Search projects or clients"><div id="projectList"></div></div></div><div class="panel" id="current"><div class="empty">Select a project or create a new one.</div></div></div></main></div>
 <div id="modal" class="modal"><div class="box"><div class="mh"><b>Create New Project</b><button class="close" id="mc">×</button></div><div class="mb"><div class="field"><label>Project Name</label><input id="newName" placeholder="e.g. Ama & Kojo Wedding"></div><div class="field"><label>Client Name</label><input id="newClient" placeholder="Client name"></div><div class="field"><label>Client Email</label><input id="newEmail" placeholder="client@email.com"></div><div class="field"><label>Client Note</label><textarea id="newNote">Your files are ready for download.</textarea></div></div><div class="mf"><button class="btn" id="mcan">Cancel</button><button class="btn primary" id="mcreate">Create Project</button></div></div></div><div id="toast" style="position:fixed;right:18px;bottom:18px;padding:11px 13px;border:1px solid var(--border);background:#1b1b1e;border-radius:11px;font-size:11px;display:none;z-index:80"></div>`;
 document.querySelector('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};
 document.querySelector('#new').onclick=()=>document.querySelector('#modal').classList.add('show');
 document.querySelector('#mc').onclick=()=>document.querySelector('#modal').classList.remove('show');
 document.querySelector('#mcan').onclick=()=>document.querySelector('#modal').classList.remove('show');
 document.querySelector('#mcreate').onclick=async()=>{const d=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#newName').value,client_name:document.querySelector('#newClient').value,client_email:document.querySelector('#newEmail').value,note:document.querySelector('#newNote').value})});document.querySelector('#modal').classList.remove('show');document.querySelector('#newName').value='';document.querySelector('#newClient').value='';document.querySelector('#newEmail').value='';current=null;await loadProjects();await openProject(d.project.id);toast('Project created')};
 document.querySelector('#search').oninput=()=>loadProjects();
 loadProjects();
}
function previewAdmin(f){
 const url='/api/public/file/'+f.id+'?token='+encodeURIComponent(current.share_token||'');
 const modal=document.createElement('div');modal.className='viewer show';modal.innerHTML=`<div class="viewerbox"><div class="vh"><b>${esc(f.original_name)}</b><button class="close">×</button></div><div class="vc">${isImage(f)?`<img src="${url}">`:isVideo(f)?`<video controls src="${url}"></video>`:isPdf(f)?`<iframe src="${url}"></iframe>`:`<div class="empty">No inline preview. <a href="${url}&download=1" style="color:var(--gold2)">Download file</a></div>`}</div></div>`;
 document.body.appendChild(modal);modal.querySelector('.close').onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()};
}
async function clientView(token){
 try{
  const d=await api('/api/public/share/'+encodeURIComponent(token));document.body.innerHTML=`<div class="client"><div class="clientwrap"><div class="ctop"><img src="${LOGO}"><h1>FBI Client File Delivery</h1><p>Secure client download area</p></div><div class="ccard"><div class="chead"><h2>${esc(d.project.name)}</h2><p>${esc(d.project.client_name||'')} ${d.project.note?'• '+esc(d.project.note):''}</p></div><div class="cfiles">${d.files.length?d.files.map(f=>`<div class="cfile"><div class="ico">${icon(f.original_name)}</div><div><div class="name">${esc(f.original_name)}</div><div class="meta">${fmt(f.size_bytes)} • ${esc(f.mime_type)}</div></div><div><button class="btn" data-prev="${f.id}">Preview</button> <a class="btn primary" href="${f.download_url}&download=1">Download</a></div></div>`).join(''):'<div class="empty">No files have been uploaded yet.</div>'}</div></div><div class="clientfoot">FILM BEYOND IMAGINATION • FBI Client File Studio</div></div><div id="v" class="viewer"></div></div>`;
  document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>clientPreview(d.files.find(f=>f.id===b.dataset.prev)));
 }catch(e){document.body.innerHTML=`<div class="client"><div class="clientwrap"><div class="ctop"><img src="${LOGO}"><h1>Delivery unavailable</h1><p>${esc(e.message)}</p></div></div></div>`}
}
function clientPreview(f){
 const m=document.querySelector('#v');const u=f.download_url;
 m.innerHTML=`<div class="viewerbox"><div class="vh"><b>${esc(f.original_name)}</b><button class="close">×</button></div><div class="vc">${isImage(f)?`<img src="${u}">`:isVideo(f)?`<video controls src="${u}"></video>`:isPdf(f)?`<iframe src="${u}"></iframe>`:`<div class="empty">No inline preview for this file type. <a href="${u}&download=1" style="color:var(--gold2)">Download file</a></div>`}</div></div>`;m.classList.add('show');m.querySelector('.close').onclick=()=>m.classList.remove('show');
}
function toast(msg){const t=document.querySelector('#toast');if(!t)return;t.textContent=msg;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.style.display='none',2200)}
boot();
</script>
</body>
</html>
