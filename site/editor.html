<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090a">
<title>FBI Video Editor</title>
<style>
:root{--bg:#080809;--panel:#111114;--panel2:#17171b;--line:#29292f;--text:#f5f5f7;--muted:#9797a0;--gold:#d4af37;--gold2:#f4d56d;--red:#ff5d66}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr) 310px}
.top{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#101013;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;margin-right:4px}.logo img{width:85px;height:30px;object-fit:contain}.logo span{font-size:9px;color:var(--muted);border-left:1px solid var(--line);padding-left:8px}
.tool{border:1px solid var(--line);border-radius:8px;background:#17171a;color:#ddd;padding:7px 9px;font-size:10px}.tool:hover{background:#1c1c20}.tool.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;border-color:#d8b642;font-weight:800}.spacer{flex:1}
.project,.seq{background:#0e0e10;border:1px solid var(--line);color:#eee;border-radius:8px;padding:7px 9px;font-size:10px}.project{width:245px}.seq{width:165px}
.work{min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 280px}
.panel{min-width:0;min-height:0;background:#101012;border-right:1px solid var(--line);display:flex;flex-direction:column}.panel:last-child{border-right:0}
.head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;background:#151518;border-bottom:1px solid var(--line)}.head b{font-size:10px;text-transform:uppercase;letter-spacing:.08em}.head span{font-size:8px;color:var(--muted)}
.media{padding:10px;overflow:auto}.search{width:100%;padding:8px 9px;background:#0c0c0e;border:1px solid var(--line);border-radius:8px;color:#eee;font-size:9px;margin-bottom:9px}.bin{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.asset{background:#151518;border:1px solid var(--line);border-radius:9px;padding:7px;cursor:pointer}.asset:hover,.asset.sel{border-color:rgba(212,175,55,.7);box-shadow:inset 0 0 0 1px rgba(212,175,55,.15)}.thumb{height:72px;border-radius:7px;background:#09090b;display:grid;place-items:center;font-size:22px;margin-bottom:6px}.asset b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset small{font-size:8px;color:var(--muted)}
.viewer{background:#08080a;min-width:0;display:flex;flex-direction:column}.monitor{flex:1;min-height:0;display:grid;place-items:center;padding:17px}.monitor video{width:100%;max-width:1100px;max-height:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border:1px solid #19191e;border-radius:10px}
.transport{height:47px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px;background:#101012}.transport button{width:32px;height:29px;border:1px solid var(--line);background:#17171a;color:#eee;border-radius:7px}.time{min-width:130px;text-align:center;font:700 10px ui-monospace,monospace}.status{height:20px;border-top:1px solid var(--line);padding:5px 8px;color:#888891;font-size:8px;background:#0b0b0d}
.inspector{overflow:auto;padding:10px}.section{background:#141417;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:9px}.section h4{margin:0 0 8px;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{display:grid;gap:4px}.field label{font-size:8px;color:var(--muted);text-transform:uppercase}.field input,.field select{width:100%;padding:7px 8px;background:#0d0d0f;color:#eee;border:1px solid var(--line);border-radius:7px;font-size:9px}.note{font-size:9px;color:var(--muted);line-height:1.5}
.timeline{min-width:0;display:grid;grid-template-columns:65px minmax(0,1fr);background:#0d0d0f;border-top:1px solid var(--line)}.labels{background:#0b0b0d;border-right:1px solid var(--line);padding-top:27px}.label{height:91px;border-top:1px solid #202024;display:flex;align-items:center;padding-left:8px;color:#a0a0a8;font-size:9px;font-weight:800}.scroll{overflow:auto;position:relative}.ruler{height:27px;min-width:1800px;position:relative;background:#121215;border-bottom:1px solid var(--line)}.tick{position:absolute;top:0;height:27px;border-left:1px solid #38383f;padding-left:4px;color:#73737b;font-size:8px}.lane{height:91px;min-width:1800px;position:relative;border-top:1px solid #202024;background:repeating-linear-gradient(90deg,#101012 0,#101012 33px,#131316 34px)}
.clip{position:absolute;top:9px;height:73px;min-width:42px;border:1px solid rgba(212,175,55,.32);border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#28231a,#171512);cursor:pointer}.clip.sel{border-color:var(--gold2);box-shadow:0 0 0 1px rgba(244,213,109,.2)}.clip .name{padding:7px 7px 2px;font-size:8px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clip .meta{padding:0 7px;font-size:7px;color:#bcb39f}.wave{position:absolute;left:7px;right:7px;bottom:8px;height:17px;opacity:.42;background:repeating-linear-gradient(90deg,#d8bf6b 0 2px,transparent 2px 5px)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:20;pointer-events:none}.playhead:before{content:"";position:absolute;left:-5px;top:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--red)}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:18px;color:var(--muted);font-size:10px}
@media(max-width:1100px){.work{grid-template-columns:220px minmax(0,1fr) 230px}.project{width:210px}}@media(max-width:820px){.app{grid-template-rows:auto minmax(0,1fr) 270px}.top{flex-wrap:wrap}.work{grid-template-columns:1fr}.panel.left,.panel.right{display:none}.viewer{min-height:420px}.timeline{height:270px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo"><img id="logo" alt="FBI"><span>PRO VIDEO EDITOR</span></div>
  <button class="tool" id="back">← Studio</button>
  <button class="tool" id="undo">↶</button><button class="tool" id="redo">↷</button>
  <button class="tool" id="split">✂ Split</button><button class="tool" id="delete">Delete</button>
  <button class="tool" id="in">[ In</button><button class="tool" id="out">Out ]</button>
  <span class="spacer"></span>
  <select id="project" class="project"><option value="">Select Project</option></select>
  <input id="sequence" class="seq" value="Untitled Sequence">
  <button class="tool" id="save">Save</button><button class="tool primary" id="export">Export Preview</button>
</header>
<main class="work">
<section class="panel left"><div class="head"><b>Media Pool</b><span id="count">0</span></div><div class="media"><input id="search" class="search" placeholder="Search footage or audio"><div id="bin" class="bin"></div></div></section>
<section class="viewer"><div class="monitor"><video id="video" controls playsinline></video></div><div class="transport"><button id="prev">⏮</button><button id="play">▶</button><button id="next">⏭</button><span id="time" class="time">00:00:00 / 00:00:00</span></div><div id="status" class="status">Select a project to begin.</div></section>
<aside class="panel right"><div class="head"><b>Inspector</b><span id="clipname">No Clip</span></div><div id="inspector" class="inspector"><div class="empty">Select a clip to edit its properties.</div></div></aside>
</main>
<section class="timeline"><div class="labels"><div class="label" style="height:27px">TRACKS</div><div class="label">V1</div><div class="label">A1</div><div class="status">Timeline</div></div><div id="scroll" class="scroll"><div id="ruler" class="ruler"></div><div id="vLane" class="lane"></div><div id="aLane" class="lane"></div><div id="playhead" class="playhead"></div></div></section>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||'Request failed');return d};
const isVideo=f=>/^video\//.test(f?.mime_type||'');
const isAudio=f=>/^audio\//.test(f?.mime_type||'');
const ft=s=>{s=Math.max(0,Number(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')+':'+String(Math.floor((s%1)*25)).padStart(2,'0')};
const fmt=n=>{n=Number(n||0);const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
const S={project:'',sequence:'Untitled Sequence',files:[],clips:[],selected:null,media:null,playhead:0,playing:false,history:[],future:[]};
let projects=[];
document.getElementById('logo').src='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="160"><text x="250" y="112" text-anchor="middle" font-family="Arial" font-size="100" font-weight="900" fill="#f4d56d">FBI</text></svg>');
function sel(){return S.clips.find(x=>x.id===S.selected)||null}
function rebuild(x){x.sourceDuration=Number(x.sourceDuration||0);x.trimIn=Math.max(0,Math.min(x.sourceDuration,Number(x.trimIn||0)));x.trimOut=Math.max(x.trimIn,Math.min(x.sourceDuration,Number(x.trimOut||x.sourceDuration)));x.speed=Math.max(.25,Math.min(4,Number(x.speed||1)));x.seqDur=(x.trimOut-x.trimIn)/x.speed}
function total(){return S.clips.reduce((m,x)=>Math.max(m,Number(x.start||0)+Number(x.seqDur||0)),0)}
function snapshot(){S.history.push(JSON.stringify({clips:S.clips,selected:S.selected,playhead:S.playhead,sequence:S.sequence}));if(S.history.length>40)S.history.shift();S.future=[]}
function saveLocal(){if(!S.project)return;localStorage.setItem('fbi-editor-project',JSON.stringify({projectId:S.project,sequence:S.sequence}));localStorage.setItem('fbi-editor-clips-'+S.project,JSON.stringify(S.clips));setStatus('Sequence saved on this device.')}
function setStatus(t){document.getElementById('status').textContent=t}
function preview(f,at){if(!f)return;const v=document.getElementById('video');v.src='/api/admin/file/'+f.id;v.onloadedmetadata=()=>{try{v.currentTime=Math.max(0,Math.min((v.duration||1)-.05,Number(at||0)))}catch{};applyTransform()};v.load()}
async function readDuration(f){const v=document.createElement('video');v.preload='metadata';v.src='/api/admin/file/'+f.id;return new Promise(r=>{const done=x=>{v.removeAttribute('src');r(x)};v.onloadedmetadata=()=>done(Number(v.duration)||0);v.onerror=()=>done(0)})}
async function loadProject(id){if(!id)return;const d=await api('/api/projects/'+id);S.project=id;S.files=(d.files||[]).filter(f=>isVideo(f)||isAudio(f));try{S.clips=JSON.parse(localStorage.getItem('fbi-editor-clips-'+id)||'[]')}catch{S.clips=[]}if(!Array.isArray(S.clips))S.clips=[];S.clips.forEach(rebuild);S.selected=null;S.media=null;S.playhead=0;renderAll();setStatus(S.files.length+' media assets loaded.')}
function renderBin(){const q=document.getElementById('search').value.toLowerCase();const a=S.files.filter(f=>!q||f.original_name.toLowerCase().includes(q));document.getElementById('count').textContent=a.length+' media';const b=document.getElementById('bin');if(!a.length){b.innerHTML='<div class="empty" style="grid-column:1/-1">No video or audio files in this project.</div>';return}b.innerHTML=a.map(f=>'<div class="asset '+(S.media===f.id?'sel':'')+'" data-id="'+f.id+'"><div class="thumb">'+(isVideo(f)?'🎬':'🎵')+'</div><b title="'+esc(f.original_name)+'">'+esc(f.original_name)+'</b><small>'+fmt(f.size_bytes)+'</small></div>').join('');b.querySelectorAll('.asset').forEach(e=>e.onclick=()=>{S.media=e.dataset.id;renderBin();const f=S.files.find(x=>x.id===S.media);preview(f,0);setStatus('Selected '+f.original_name)})}
async function addSelected(){const f=S.files.find(x=>x.id===S.media);if(!f||!isVideo(f))return setStatus('Select a video asset first.');const d=await readDuration(f);if(!d)return setStatus('Could not read video duration.');snapshot();const x={id:crypto.randomUUID(),fileId:f.id,name:f.original_name,sourceDuration:d,trimIn:0,trimOut:d,speed:1,start:total(),seqDur:d,type:'video',scale:100,opacity:100,rotation:0};S.clips.push(x);S.selected=x.id;S.playhead=x.start;saveLocal();renderAll();preview(f,0);setStatus('Added '+f.original_name)}
function renderTimeline(){const r=document.getElementById('ruler'),v=document.getElementById('vLane'),a=document.getElementById('aLane'),px=34,max=Math.max(60,Math.ceil(total()/10)*10);r.innerHTML=Array.from({length:max+1},(_,i)=>i%5===0?'<span class="tick" style="left:'+i*px+'px">'+i+'s</span>':'').join('');v.innerHTML='';a.innerHTML='';S.clips.forEach(x=>{rebuild(x);const e=document.createElement('div');e.className='clip '+(x.id===S.selected?'sel':'');e.style.left=x.start*px+'px';e.style.width=Math.max(42,x.seqDur*px)+'px';e.innerHTML='<div class="name">'+esc(x.name)+'</div><div class="meta">'+ft(x.seqDur)+' • '+x.speed+'x</div><div class="wave"></div>';e.onclick=ev=>{ev.stopPropagation();S.selected=x.id;S.playhead=x.start;const f=S.files.find(q=>q.id===x.fileId);preview(f,x.trimIn);renderTimeline();renderInspector();renderBin();updateTransport()};(x.type==='video'?v:a).appendChild(e)});const w=(max+12)*px;r.style.minWidth=w+'px';v.style.minWidth=w+'px';a.style.minWidth=w+'px';updatePlayhead()}
function renderInspector(){const b=document.getElementById('inspector'),name=document.getElementById('clipname'),x=sel();if(!x){name.textContent='No Clip';b.innerHTML='<div class="empty">Select a clip to edit timing, speed and transform.</div>';return}name.textContent=x.name;b.innerHTML='<div class="section"><h4>Timing</h4><div class="grid"><div class="field"><label>Start</label><input id="s" type="number" step=".01" value="'+x.start.toFixed(2)+'"></div><div class="field"><label>Speed</label><input id="sp" type="number" min=".25" max="4" step=".05" value="'+x.speed+'"></div><div class="field"><label>In</label><input id="ti" type="number" step=".01" value="'+x.trimIn.toFixed(2)+'"></div><div class="field"><label>Out</label><input id="to" type="number" step=".01" value="'+x.trimOut.toFixed(2)+'"></div></div></div><div class="section"><h4>Transform</h4><div class="grid"><div class="field"><label>Scale %</label><input id="sc" type="number" min="1" max="400" value="'+x.scale+'"></div><div class="field"><label>Opacity %</label><input id="op" type="number" min="0" max="100" value="'+x.opacity+'"></div><div class="field"><label>Rotation</label><input id="rt" type="number" min="-180" max="180" value="'+x.rotation+'"></div></div></div><div class="section"><h4>Source</h4><div class="note">Original: <b>'+ft(x.sourceDuration)+'</b><br>Trimmed: <b>'+ft(x.trimOut-x.trimIn)+'</b><br>Non-destructive edits. Original cloud media is never modified.</div></div>';['s','sp','ti','to','sc','op','rt'].forEach(id=>document.getElementById(id).onchange=()=>{snapshot();x.start=Math.max(0,Number(document.getElementById('s').value||0));x.speed=Math.max(.25,Math.min(4,Number(document.getElementById('sp').value||1)));x.trimIn=Math.max(0,Math.min(x.sourceDuration,Number(document.getElementById('ti').value||0)));x.trimOut=Math.max(x.trimIn,Math.min(x.sourceDuration,Number(document.getElementById('to').value||x.sourceDuration)));x.scale=Math.max(1,Math.min(400,Number(document.getElementById('sc').value||100)));x.opacity=Math.max(0,Math.min(100,Number(document.getElementById('op').value||100)));x.rotation=Math.max(-180,Math.min(180,Number(document.getElementById('rt').value||0)));rebuild(x);saveLocal();renderTimeline();renderInspector();applyTransform();updateTransport()})}
function applyTransform(){const x=sel(),v=document.getElementById('video');if(!x||!v)return;v.style.transform='scale('+(x.scale/100)+') rotate('+x.rotation+'deg)';v.style.opacity=String(x.opacity/100)}
function updatePlayhead(){document.getElementById('playhead').style.left=S.playhead*34+'px'}
function updateTransport(){document.getElementById('time').textContent=ft(S.playhead)+' / '+ft(total());document.getElementById('play').textContent=S.playing?'⏸':'▶';updatePlayhead()}
function jump(t){S.playhead=Math.max(0,Math.min(total(),t));const x=S.clips.find(z=>S.playhead>=z.start&&S.playhead<z.start+z.seqDur);if(x){S.selected=x.id;const f=S.files.find(q=>q.id===x.fileId);preview(f,x.trimIn+(S.playhead-x.start)*x.speed);applyTransform()}renderTimeline();renderInspector();renderBin();updateTransport()}
function split(){const x=sel();if(!x)return setStatus('Select a clip first.');const rel=S.playhead-x.start;if(rel<=.05||rel>=x.seqDur-.05)return setStatus('Move playhead inside the clip.');snapshot();const cut=x.trimIn+rel*x.speed;const y=Object.assign({},x,{id:crypto.randomUUID(),trimIn:cut,start:x.start+rel});x.trimOut=cut;rebuild(x);rebuild(y);S.clips.push(y);S.selected=y.id;saveLocal();renderAll();setStatus('Clip split.')}
function del(){if(!sel())return;snapshot();S.clips=S.clips.filter(x=>x.id!==S.selected);S.selected=null;saveLocal();renderAll();setStatus('Clip deleted.')}
function markIn(){const x=sel();if(!x)return;const rel=Math.max(0,S.playhead-x.start),src=x.trimIn+rel*x.speed;if(src>=x.trimOut)return;snapshot();x.trimIn=Math.min(x.trimOut-.01,src);rebuild(x);saveLocal();renderAll();setStatus('In point updated.')}
function markOut(){const x=sel();if(!x)return;const rel=Math.max(0,S.playhead-x.start),src=x.trimIn+rel*x.speed;if(src<=x.trimIn)return;snapshot();x.trimOut=Math.min(x.sourceDuration,src);rebuild(x);saveLocal();renderAll();setStatus('Out point updated.')}
function undo(){const raw=S.history.pop();if(!raw)return;S.future.push(JSON.stringify({clips:S.clips,selected:S.selected,playhead:S.playhead,sequence:S.sequence}));Object.assign(S,JSON.parse(raw));S.clips.forEach(rebuild);saveLocal();renderAll()}
function redo(){const raw=S.future.pop();if(!raw)return;S.history.push(JSON.stringify({clips:S.clips,selected:S.selected,playhead:S.playhead,sequence:S.sequence}));Object.assign(S,JSON.parse(raw));S.clips.forEach(rebuild);saveLocal();renderAll()}
async function play(){const v=document.getElementById('video');const x=sel()||S.clips[0];if(!x)return setStatus('Add a clip first.');if(S.playing){v.pause();S.playing=false;updateTransport();return}S.selected=x.id;const f=S.files.find(q=>q.id===x.fileId);preview(f,x.trimIn+Math.max(0,S.playhead-x.start)*x.speed);S.playing=true;try{await v.play()}catch{S.playing=false}updateTransport()}
async function exportPreview(){const v=document.getElementById('video');if(!S.clips.length)return setStatus('Add clips before export.');if(!v.captureStream||!window.MediaRecorder)return setStatus('Browser preview export is not supported here.');const chunks=[],mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm';const rec=new MediaRecorder(v.captureStream(),{mimeType:mime});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.start(1000);for(const x of [...S.clips].sort((a,b)=>a.start-b.start)){const f=S.files.find(q=>q.id===x.fileId);if(!f)continue;S.selected=x.id;renderInspector();await new Promise(async done=>{preview(f,x.trimIn);const finish=()=>{v.pause();done()};v.onended=finish;try{await v.play()}catch{done();return}const loop=()=>{if(v.currentTime>=x.trimOut-.03)finish();else requestAnimationFrame(loop)};requestAnimationFrame(loop)})}rec.stop();await new Promise(r=>rec.onstop=r);const blob=new Blob(chunks,{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(S.sequence||'FBI-Sequence').replace(/[^a-z0-9_-]+/gi,'_')+'.webm';a.click();setStatus('Preview export created.')}
function renderAll(){renderBin();renderTimeline();renderInspector();updateTransport()}
document.getElementById('back').onclick=()=>location.href='/';
document.getElementById('project').onchange=e=>loadProject(e.target.value);
document.getElementById('search').oninput=renderBin;
document.getElementById('split').onclick=split;document.getElementById('delete').onclick=del;document.getElementById('in').onclick=markIn;document.getElementById('out').onclick=markOut;document.getElementById('undo').onclick=undo;document.getElementById('redo').onclick=redo;document.getElementById('save').onclick=saveLocal;document.getElementById('export').onclick=exportPreview;
document.getElementById('sequence').onchange=e=>{S.sequence=e.target.value||'Untitled Sequence';saveLocal()};document.getElementById('play').onclick=play;document.getElementById('prev').onclick=()=>{const i=S.clips.findIndex(x=>x.id===S.selected);if(i>0)jump(S.clips[i-1].start)};document.getElementById('next').onclick=()=>{const i=S.clips.findIndex(x=>x.id===S.selected);if(i>=0&&i<S.clips.length-1)jump(S.clips[i+1].start)};
document.getElementById('scroll').onclick=e=>{if(e.target.closest('.clip'))return;const r=document.getElementById('scroll').getBoundingClientRect();jump((e.clientX-r.left+document.getElementById('scroll').scrollLeft)/34)};
document.getElementById('video').ontimeupdate=()=>{const x=sel();if(!x)return;S.playhead=x.start+Math.max(0,Math.min(x.seqDur,(document.getElementById('video').currentTime-x.trimIn)/x.speed));applyTransform();updateTransport();if(document.getElementById('video').currentTime>=x.trimOut-.03){document.getElementById('video').pause();S.playing=false;updateTransport()}};
document.addEventListener('keydown',e=>{const t=document.activeElement?.tagName;if(t==='INPUT'||t==='SELECT')return;if(e.code==='Space'){e.preventDefault();play()}else if(e.key.toLowerCase()==='b')split();else if(e.key==='Delete')del();else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z')undo();else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y')redo();else if(e.key.toLowerCase()==='i')markIn();else if(e.key.toLowerCase()==='o')markOut()});
document.getElementById('bin').ondblclick=e=>{const a=e.target.closest('.asset');if(a)addSelected()};
(async()=>{try{const me=await api('/api/auth/me');if(!me.authenticated){location.href='/';return}const d=await api('/api/projects?status=active');projects=d.projects||[];document.getElementById('project').innerHTML='<option value="">Select Project</option>'+projects.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');const base=JSON.parse(localStorage.getItem('fbi-editor-project')||'null');if(base?.projectId){S.project=base.projectId;S.sequence=base.sequence||S.sequence}document.getElementById('project').value=S.project;document.getElementById('sequence').value=S.sequence;if(S.project)await loadProject(S.project);else renderAll()}catch(e){document.body.innerHTML='<div class="empty">'+esc(e.message||'Editor unavailable')+'</div>'}})();
</script>
</body>
</html>
