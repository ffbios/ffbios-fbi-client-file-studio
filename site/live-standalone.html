<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FBI Live Broadcast Studio</title>
<meta name="application-name" content="FBI Live">
<meta name="theme-color" content="#0a0a0b">
<meta name="background-color" content="#09090a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FBI Live">
<link rel="manifest" href="/manifest.webmanifest?live=v7">
<link rel="icon" href="/live-pwa-icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/official-logo.png">
<style>
:root{color-scheme:dark;--bg:#07080a;--panel:#0f1217;--panel2:#141820;--line:#1c212a;--line2:#2a303b;--text:#eef0f5;--muted:#8b93a1;--dim:#5f6775;--gold:#e8c85a;--gold2:#c9a53a;--green:#3ddc84;--red:#ff5d6c;--amber:#f5b942;--r:14px;--mh:176px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden;background:radial-gradient(900px 460px at 14% -10%,rgba(232,200,90,.07),transparent 60%),radial-gradient(800px 420px at 100% 0,rgba(106,165,255,.06),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{height:100vh;display:grid;grid-template-columns:288px minmax(0,1fr)}
.sidebar{background:linear-gradient(180deg,#0d1014,#0a0c0f);border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;min-height:0;gap:14px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;padding:22px 26px 26px;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a303b transparent}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:12px;padding:4px 4px 16px;border-bottom:1px solid var(--line);text-align:left}
.brand img{width:64px;height:40px;object-fit:contain;flex:none}
.brand div{min-width:0}.brand strong{display:block;font-size:15px;letter-spacing:.14em;font-weight:800;white-space:nowrap}
.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sidebar-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:2px 4px}
.sidebar-head h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sidebar-head span{font-size:12px;color:var(--dim)}
.sidebar-head-left{display:flex;flex-direction:column;gap:2px}
.add-channel-btn{border:1px solid var(--line2);background:var(--panel2);color:#f4e7b3;border-radius:10px;padding:7px 10px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.add-channel-btn:hover{border-color:var(--gold2);background:#1b1f27}
.channels{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;display:grid;gap:10px;align-content:start;padding:2px;scrollbar-width:thin;scrollbar-color:#2a303b transparent}
.channel{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.channel:hover{background:var(--panel2);border-color:var(--line2)}
.channel.active{border-color:rgba(232,200,90,.6);background:linear-gradient(180deg,rgba(232,200,90,.09),rgba(232,200,90,.02));box-shadow:0 0 0 1px rgba(232,200,90,.12)}
.channel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.channel-name{min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-meta{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line2);border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--muted)}
.badge.live{color:var(--green);border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.07)}
.badge.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(61,220,132,.7)}
.engine{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.engine b{display:block;font-size:13px}.engine span{display:block;font-size:11.5px;color:var(--muted)}
.edot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.edot.ok{background:var(--green);box-shadow:0 0 10px rgba(61,220,132,.6)}.edot.bad{background:var(--red);box-shadow:0 0 10px rgba(255,93,108,.5)}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.top-title h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.top-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.03em;transition:.15s}
.btn:hover{background:#1b1f27;border-color:#3a4150}
.btn.primary{background:linear-gradient(180deg,#f1da7e,#d8b744);border-color:#d8b744;color:#17150a}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:default}

/* ---------- status strip ---------- */
.studio{display:flex;flex-direction:column;gap:14px;flex:none}
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);flex-wrap:wrap}
.chips{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:#0c0f13;color:#a5adba;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip.live{color:var(--green);border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.07)}
.chip.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px rgba(61,220,132,.7);animation:pulse 1.8s ease-in-out infinite}
.chip.gold{color:#f0d26f;border-color:rgba(232,200,90,.3);background:rgba(232,200,90,.05)}
.chip.quiet{text-transform:none;letter-spacing:.02em;font-weight:600;color:var(--muted)}
.control{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d6dae2;letter-spacing:.04em}
.viewers{font-size:12px;color:#f0f2f6}.viewers b{font-size:14px;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.35}}

/* ---------- work area ---------- */
.work{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:14px;align-items:start}
.primary-area{min-width:0;display:flex;flex-direction:column;gap:14px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.view{position:relative;min-width:0;aspect-ratio:16/9;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.view.program.onair{border-color:rgba(255,93,108,.55);box-shadow:0 0 0 1px rgba(255,93,108,.18),0 18px 50px rgba(0,0,0,.4)}
.view-head{position:absolute;top:0;left:0;right:0;z-index:5;padding:12px 14px;background:linear-gradient(180deg,rgba(0,0,0,.78),transparent);display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.view-head b{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em}
.preview-label{color:#e1e4ea}.program-label{color:#ffb0b8}
.view.program.onair .program-label:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(255,93,108,.8)}
.view-head span{font-size:11px;font-weight:700;letter-spacing:.08em;color:#aab1bd}
.frame{position:relative;z-index:2;width:100%;height:100%;display:block;border:0;background:transparent;object-fit:contain}
.nosignal{position:absolute;inset:0;z-index:1;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;padding:24px;background:radial-gradient(420px 220px at 50% 45%,rgba(232,200,90,.07),transparent 70%),#06070a;color:var(--muted)}
.nosignal svg{width:38px;height:38px;color:#3b4250;margin:0 auto 4px}
.nosignal b{color:#cfd4dd;font-size:14px;letter-spacing:.06em}
.nosignal span{font-size:12.5px}
.overlay-note{position:absolute;left:12px;bottom:12px;z-index:5;max-width:calc(100% - 24px);padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);font-size:11.5px;color:#c4cad4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.placeholder{min-height:260px;display:grid;place-items:center;text-align:center;padding:30px;border:1px dashed var(--line2);border-radius:var(--r);background:radial-gradient(500px 220px at 50% 40%,rgba(232,200,90,.06),transparent 65%),var(--panel);color:var(--muted)}
.placeholder b{display:block;color:#dfe3ea;font-size:15px}.placeholder span{display:block;margin-top:6px;font-size:13px;line-height:1.5}

/* ---------- source tiles ---------- */
.sources{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.source{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.source .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#0b0e12;border:1px solid var(--line);color:var(--dim)}
.source .ico svg{width:20px;height:20px}
.source-text{min-width:0;display:grid;gap:1px}
.source-text b{font-size:12px;letter-spacing:.08em;color:#d4d8e0}
.source-text span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.source.live .ico{color:var(--green);border-color:rgba(61,220,132,.3);background:rgba(61,220,132,.06)}
.source.live .source-text span{color:var(--green)}

/* ---------- audio mixer ---------- */
.mixer-card,.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#c4cad4}
.card-head .unit{font-size:11px;color:var(--dim);margin-left:8px;font-weight:600;letter-spacing:.04em;text-transform:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);font-size:11.5px;font-weight:700;color:var(--muted);background:#0c0f13}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill[data-code=live]{color:var(--green);border-color:rgba(61,220,132,.35)}.pill[data-code=live]:before{background:var(--green);box-shadow:0 0 8px rgba(61,220,132,.7)}
.pill[data-code=activate]{color:var(--amber);border-color:rgba(245,185,66,.4);cursor:pointer}.pill[data-code=activate]:before{background:var(--amber);animation:pulse 1.4s infinite}
.pill[data-code=silent],.pill[data-code=noaudio]{color:var(--amber);border-color:rgba(245,185,66,.35)}.pill[data-code=silent]:before,.pill[data-code=noaudio]:before{background:var(--amber)}
.pill[data-code=server]{color:#9cc2ff;border-color:rgba(106,165,255,.35)}.pill[data-code=server]:before{background:#6aa5ff}
.mixer{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:10px;padding:16px 18px 18px}
.strip{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;padding:12px 6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.strip.scale{background:transparent;border-color:transparent;padding-left:0;padding-right:0;align-items:stretch}
.strip .label{height:16px;font-size:11px;font-weight:800;letter-spacing:.09em;color:#e3e6ec;white-space:nowrap}
.strip .read{height:20px;font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e9ecf2;font-variant-numeric:tabular-nums}
.strip small{height:15px;font-size:11px;color:var(--dim)}
.strip.master{border-color:rgba(232,200,90,.3);background:linear-gradient(180deg,rgba(232,200,90,.07),var(--panel2))}
.m{position:relative;overflow:hidden;background:#090b0e;border:1px solid #1b1f26}
.m-v{width:20px;height:var(--mh);border-radius:6px}
.m-h{flex:1;min-width:0;height:10px;border-radius:5px}
.m-fill{position:absolute;inset:0;display:block;clip-path:inset(100% 0 0 0)}
.m-v .m-fill{background:linear-gradient(to top,var(--green) 0,var(--green) 70%,var(--amber) 70%,var(--amber) 90%,var(--red) 90%,var(--red) 100%)}
.m-h .m-fill{clip-path:inset(0 100% 0 0);background:linear-gradient(to right,var(--green) 0,var(--green) 70%,var(--amber) 70%,var(--amber) 90%,var(--red) 90%,var(--red) 100%)}
.m-v:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to top,transparent 0 4px,#090b0e 4px 6px)}
.m-h:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to right,transparent 0 4px,#090b0e 4px 6px)}
.m-peak{position:absolute;display:block;opacity:0;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.6);z-index:2}
.m-v .m-peak{left:0;right:0;height:2px;bottom:0}
.m-h .m-peak{top:0;bottom:0;width:2px;left:0}
.m-scale{position:relative;width:100%;height:var(--mh);margin-top:0}
.m-scale i{position:absolute;right:0;transform:translateY(50%);font:600 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--dim);font-style:normal;white-space:nowrap}
.hrow{display:grid;grid-template-columns:16px minmax(0,1fr) 52px;align-items:center;gap:10px;margin-bottom:10px}
.hrow .hl{font-size:12px;font-weight:800;color:#c4cad4}.hrow .hr{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:right;color:#e9ecf2;font-variant-numeric:tabular-nums}

/* ---------- right rack ---------- */
.rack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{overflow:hidden}
.ph{padding:13px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#c4cad4}
.pb{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rack-btn{width:100%;border:1px solid var(--line2);background:var(--panel2);color:#e8ebf1;border-radius:10px;padding:11px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;transition:.15s}
.rack-btn:hover{background:#1b1f27;border-color:#3a4150}
.rack-btn.primary{background:linear-gradient(180deg,#f1da7e,#d8b744);border-color:#d8b744;color:#17150a}
.rack-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:7px 0;border-bottom:1px solid #151921}
.rack-row:last-child{border-bottom:0}.rack-row b{color:#eef0f5;font-weight:700;text-align:right}

/* ---------- bottom controls ---------- */
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 14px;flex-wrap:wrap}
.control-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.smallbtn{border:1px solid var(--line2);background:var(--panel2);color:#e1e4ea;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:800;letter-spacing:.05em;transition:.15s}
.smallbtn:hover{background:#1b1f27;border-color:#3a4150}
.smallbtn.primary{background:linear-gradient(180deg,#f1da7e,#d8b744);color:#17150a;border-color:#d8b744}
.footer{margin-top:14px;color:var(--dim);font-size:12px;text-align:center}

/* ---------- login ---------- */
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(650px 420px at 50% 40%,rgba(232,200,90,.10),transparent 68%),var(--bg)}
.login-glow{position:absolute;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(232,200,90,.08),transparent 66%);pointer-events:none}
.login-shell{width:min(980px,100%);display:grid;grid-template-columns:1fr 440px;gap:30px;align-items:center;position:relative;z-index:1}
.login-brand{text-align:left;padding:28px}
.brand-mark{width:84px;height:84px;border-radius:22px;border:1px solid rgba(232,200,90,.25);background:linear-gradient(145deg,#19191d,#0c0c0e);display:grid;place-items:center;box-shadow:0 18px 55px rgba(0,0,0,.32);margin-bottom:22px}
.brand-mark img{width:58px;height:58px;object-fit:contain}
.login-kicker{font-size:12px;letter-spacing:.2em;color:var(--muted)}
.login-brand-title{font-size:48px;font-weight:850;letter-spacing:-.04em;margin-top:6px}
.login-brand-sub{font-size:15px;color:var(--muted);margin-top:8px;line-height:1.5}
.login-foot{grid-column:1/-1;text-align:center;color:var(--dim);font-size:12px}
.login-card{border:1px solid var(--line2);border-radius:22px;background:linear-gradient(180deg,rgba(21,24,29,.98),rgba(12,14,17,.98));box-shadow:0 35px 100px rgba(0,0,0,.5);overflow:hidden}
.login-head{padding:26px 26px 18px;border-bottom:1px solid var(--line)}
.login-eyebrow{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:800}
.login-head h1{margin:8px 0 0;font-size:24px;letter-spacing:-.02em}
.login-head p{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.login-body{padding:20px 26px 24px}
.login-body .field{display:grid;gap:7px;margin-bottom:14px}
.login-body .field label,.channel-body .field label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.login-body .field input,.login-body .field select,.channel-body .field input{width:100%;background:#090b0e;border:1px solid var(--line2);color:#f3f4f7;border-radius:11px;padding:12px 13px;font-size:14px;outline:none}
.login-body .field input:focus,.login-body .field select:focus,.channel-body .field input:focus,.channel-body textarea:focus{border-color:rgba(232,200,90,.6);box-shadow:0 0 0 3px rgba(232,200,90,.1)}
.auth-primary,.auth-secondary,.auth-link{width:100%;border-radius:11px;padding:12px 14px;font-size:14px;font-weight:800;cursor:pointer}
.auth-primary{border:1px solid #d8b744;background:linear-gradient(180deg,#f1da7e,#d8b744);color:#17150a}
.auth-secondary{border:1px solid var(--line2);background:var(--panel2);color:#e9ebef}
.auth-link{border:0;background:transparent;color:#c4cad4;padding:10px 4px;font-weight:700}
.auth-row{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.auth-row .auth-link{width:auto}
.auth-message{min-height:18px;color:#ff8a98;font-size:13px;line-height:1.5;margin-top:10px}
.question-box{padding:12px 13px;border:1px solid rgba(232,200,90,.25);border-radius:11px;background:rgba(232,200,90,.05);font-size:14px;color:#ecd884;line-height:1.45;margin:12px 0}
.login-body select{appearance:auto}

/* ---------- modals ---------- */
.channel-modal,.tools-modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.76);padding:18px;backdrop-filter:blur(3px)}
.channel-modal{z-index:100}.tools-modal{z-index:120}
.channel-modal.hidden,.tools-modal.hidden{display:none}
.channel-box,.tools-box{width:min(560px,100%);border:1px solid var(--line2);border-radius:16px;background:linear-gradient(180deg,#171a20,#0f1115);box-shadow:0 30px 90px rgba(0,0,0,.62);overflow:hidden}
.tools-box{width:min(660px,100%)}
.channel-head,.tools-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.channel-head b,.tools-head b{font-size:15px}
.tools-head span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.channel-close,.tools-close{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;cursor:pointer}
.channel-body,.tools-body{padding:18px}
.channel-body .field{margin-bottom:14px;display:grid;gap:7px}
.channel-body textarea{width:100%;min-height:90px;background:#090b0e;border:1px solid var(--line2);color:#eee;border-radius:11px;padding:11px 12px;font-size:14px;outline:none;resize:vertical}
.channel-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.channel-help{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.55}
.channel-result{margin-top:14px;padding:12px 14px;border:1px solid rgba(232,200,90,.28);background:rgba(232,200,90,.05);border-radius:11px;font-size:12.5px;color:#dcdfe6}
.channel-result b{display:block;color:#f2e6b0;margin-bottom:6px}
.channel-result code{font:700 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:#e8eaee;word-break:break-all}
.encoder-grid{display:grid;grid-template-columns:1fr;gap:10px}
.encoder-field{border:1px solid var(--line2);border-radius:11px;background:#090b0e;padding:11px 13px}
.encoder-field label{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.encoder-value{display:flex;align-items:center;gap:10px}
.encoder-value code{flex:1;min-width:0;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#eceef2;word-break:break-all}
.copy-value{border:1px solid var(--line2);background:var(--panel2);color:#eceef2;border-radius:8px;padding:7px 11px;font-size:11px;font-weight:800;cursor:pointer}
.copy-value:hover{border-color:var(--gold2)}
.tools-warning{margin-top:12px;padding:11px 13px;border:1px solid rgba(232,200,90,.22);background:rgba(232,200,90,.05);border-radius:10px;color:#aeb4c0;font-size:12.5px;line-height:1.55}
.tools-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.tools-foot-left,.tools-foot-right{display:flex;gap:8px}
.danger-btn{border:1px solid rgba(255,93,108,.4);background:rgba(255,93,108,.06);color:#ffb3bc;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:800;cursor:pointer}

/* ---------- responsive ---------- */
@media(max-width:1280px){.work{grid-template-columns:minmax(0,1fr)}.rack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}
@media(max-width:1000px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:minmax(0,1fr)}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:14px}.channels{display:flex;overflow-x:auto;overflow-y:hidden}.channel{min-width:220px}.main{overflow:visible;padding:16px}.rack{grid-template-columns:1fr 1fr}.sources{grid-template-columns:repeat(2,minmax(0,1fr))}.login-shell{grid-template-columns:1fr}.login-brand{padding:6px 4px}.login-brand-title{font-size:38px}}
@media(max-width:700px){.views{grid-template-columns:1fr}.rack{grid-template-columns:1fr}.mixer{grid-template-columns:repeat(5,minmax(76px,1fr));overflow-x:auto}.strip.scale{display:none}.top-title h1{font-size:20px}:root{--mh:132px}}
@media(prefers-reduced-motion:reduce){.chip.live:before,.pill[data-code=activate]:before{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<div class="channel-modal hidden" id="channelModal"><div class="channel-box"><div class="channel-head"><b>Create Live Channel</b><button class="channel-close" id="channelClose">×</button></div><div class="channel-body"><p class="channel-help">Create a channel for OBS, vMix, Streamlabs or another RTMP encoder. The existing live streaming engine is unchanged.</p><div class="field"><label>Channel Name</label><input id="newChannelName" placeholder="e.g. Wedding Live"></div><div class="field"><label>Stream Title</label><input id="newChannelTitle" placeholder="Title viewers will see"></div><div class="field"><label>Description</label><textarea id="newChannelDescription" placeholder="Optional broadcast description"></textarea></div><div id="channelResult" class="channel-result" style="display:none"></div></div><div class="channel-foot"><button class="btn" id="channelCancel">Cancel</button><button class="btn primary" id="channelCreate">CREATE CHANNEL</button></div></div></div>
<script>
(function(){
  const root=document.getElementById('root');
  let streams=[],selectedId=null,refreshTimer=null,audioState=null;
  const hlsInstances=[];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  async function api(url,options){const r=await fetch(url,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
  function authCard(mode,extra){
    const setup=mode==='setup',forgot=mode==='forgot';
    const title=setup?'Create Live Admin Account':forgot?'Reset Admin Password':'FBI Live Broadcast Studio';
    const subtitle=setup?'Set up the administrator account for this standalone control room.':forgot?'Recover access using your security question.':'Standalone professional live production control room';
    const body=setup
      ? '<div class="field"><label>Full Name</label><input id="fullName" placeholder="Administrator name"></div>'+
        '<div class="field"><label>Email</label><input id="email" type="email" placeholder="admin@example.com"></div>'+
        '<div class="field"><label>Password</label><input id="password" type="password" placeholder="At least 10 characters"></div>'+
        '<div class="field"><label>Confirm Password</label><input id="confirmPassword" type="password" placeholder="Repeat password"></div>'+
        '<div class="field"><label>Security Question</label><select id="securityQuestion"><option value="What was the name of your first school?">What was the name of your first school?</option><option value="What city were you born in?">What city were you born in?</option><option value="What was your first job?">What was your first job?</option><option value="What was the name of your first pet?">What was the name of your first pet?</option></select></div>'+
        '<div class="field"><label>Security Answer</label><input id="securityAnswer" placeholder="Your private recovery answer"></div>'+
        '<button class="auth-primary" id="setupBtn">Create Admin Account</button>'+
        '<button class="auth-link" id="toLogin">Already have an account? Sign in</button>'
      : forgot
        ? '<div class="field"><label>Admin Email</label><input id="email" type="email" placeholder="Your admin email"></div>'+
          '<button class="auth-secondary" id="questionBtn">Load Security Question</button>'+
          '<div id="questionBox" class="question-box" style="display:none"></div>'+
          '<div id="resetFields" style="display:none"><div class="field"><label>Security Answer</label><input id="securityAnswer" placeholder="Your recovery answer"></div><div class="field"><label>New Password</label><input id="password" type="password" placeholder="At least 10 characters"></div><div class="field"><label>Confirm Password</label><input id="confirmPassword" type="password" placeholder="Repeat password"></div><button class="auth-primary" id="resetBtn">Reset Password</button></div>'+
          '<button class="auth-link" id="toLogin">Back to sign in</button>'
        : '<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Admin email"></div>'+
          '<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"></div>'+
          '<button class="auth-primary" id="loginBtn">Sign In</button>'+
          '<div class="auth-row"><button class="auth-link" id="forgotBtn">Forgot password?</button><button class="auth-link" id="setupLink" style="display:none">Create admin account</button></div>';
    root.innerHTML='<div class="login-page"><div class="login-glow"></div><div class="login-shell"><div class="login-brand"><div class="brand-mark"><img src="/official-logo.png" alt="FBI"></div><div class="login-kicker">FILM BEYOND IMAGINATION</div><div class="login-brand-title">FBI LIVE</div><div class="login-brand-sub">Standalone Broadcast Control Room</div></div><div class="login-card"><div class="login-head"><div class="login-eyebrow">'+(setup?'FIRST-TIME SETUP':forgot?'ACCOUNT RECOVERY':'ADMIN ACCESS')+'</div><h1>'+title+'</h1><p>'+subtitle+'</p></div><div class="login-body">'+body+(extra?'<div class="auth-message" id="extra">'+extra+'</div>':'')+'<div class="auth-message" id="authError"></div></div></div><div class="login-foot">Secure administration • Live engine remains independent from Client File Studio</div></div></div>';

    const err=m=>{const e=document.getElementById('authError');if(e)e.textContent=m||''};
    const toLogin=document.getElementById('toLogin');if(toLogin)toLogin.onclick=()=>login('login');
    if(setup){
      document.getElementById('setupBtn').onclick=async()=>{
        err('');
        try{await api('/api/live-auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          full_name:document.getElementById('fullName').value,email:document.getElementById('email').value,password:document.getElementById('password').value,
          confirm_password:document.getElementById('confirmPassword').value,security_question:document.getElementById('securityQuestion').value,security_answer:document.getElementById('securityAnswer').value
        })});boot()}catch(e){err(e.message)}
      };
      return;
    }
    if(forgot){
      document.getElementById('questionBtn').onclick=async()=>{
        err('');
        try{const d=await api('/api/live-auth/forgot-question',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const box=document.getElementById('questionBox');box.textContent=d.question;box.style.display='block';document.getElementById('resetFields').style.display='block'}catch(e){err(e.message)}
      };
      document.getElementById('resetBtn').onclick=async()=>{
        err('');
        try{await api('/api/live-auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,security_answer:document.getElementById('securityAnswer').value,password:document.getElementById('password').value,confirm_password:document.getElementById('confirmPassword').value})});login('login','Password reset. Sign in with your new password.')}catch(e){err(e.message)}
      };
      return;
    }
    document.getElementById('loginBtn').onclick=async()=>{
      err('');
      try{await api('/api/live-auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});boot()}catch(e){err(e.message)}
    };
    document.getElementById('forgotBtn').onclick=()=>login('forgot');
    document.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('loginBtn')?.click()},{once:true});
  }
  async function login(mode='login',message=''){
    if(mode==='setup'||mode==='forgot'||mode==='login')authCard(mode,message);
    else authCard('login');
  }
  function renderShell(){
    // Keep the install control visible; supported browsers use the native PWA prompt,
    // while unsupported browsers are given the browser-menu installation fallback.
    root.innerHTML='<div class="app"><aside class="sidebar"><div class="brand"><img src="/official-logo.png" alt="FBI"><div><strong>FBI LIVE</strong><span>Standalone Broadcast Studio</span></div></div><div class="sidebar-head"><div class="sidebar-head-left"><h2>Live Channels</h2><span id="channelCount">0</span></div><button class="add-channel-btn" id="addChannelBtn">＋ ADD CHANNEL</button></div><div class="channels" id="channels"></div><div class="engine"><i class="edot" id="engineDot"></i><div><b id="engineText">Connecting…</b><span>Control room</span></div></div></aside><main class="main"><div class="topbar"><div class="top-title"><h1>FBI Live Broadcast Studio</h1><p>Monitor your live signal, program output, viewers and audio from one control surface.</p></div><div class="top-actions"><span class="chip gold">OPEN CONTROL MODE</span><button class="btn" id="installBtn">INSTALL APP</button><button class="btn" id="toolsBtn">TOOLS</button></div></div><section class="studio" id="studio"><div class="placeholder"><div><b>Select a live channel</b><span>Choose a channel from the left to open the control room.</span></div></div></section></main></div><div class="tools-modal hidden" id="toolsModal"><div class="tools-box"><div class="tools-head"><div><b>Encoder Tools</b><span id="toolsChannelName">Selected channel</span></div><button class="tools-close" id="toolsClose">×</button></div><div class="tools-body"><div class="encoder-grid"><div class="encoder-field"><label>RTMP Server URL</label><div class="encoder-value"><code id="toolsRtmp">—</code><button class="copy-value" data-copy-id="toolsRtmp">COPY</button></div></div><div class="encoder-field"><label>Stream Key</label><div class="encoder-value"><code id="toolsKey">—</code><button class="copy-value" data-copy-id="toolsKey">COPY</button></div></div><div class="encoder-field"><label>HLS Playback URL</label><div class="encoder-value"><code id="toolsHls">—</code><button class="copy-value" data-copy-id="toolsHls">COPY</button></div></div><div class="encoder-field"><label>Viewer / Share URL</label><div class="encoder-value"><code id="toolsViewer">—</code><button class="copy-value" data-copy-id="toolsViewer">COPY</button></div></div></div><div class="tools-warning">Use the RTMP Server URL and Stream Key in OBS, vMix, Streamlabs, or your encoder. Regenerating the key immediately invalidates the previous key.</div></div><div class="tools-foot"><div class="tools-foot-left"><button class="smallbtn" id="copyEncoderSetup">COPY ENCODER SETUP</button></div><div class="tools-foot-right"><button class="danger-btn" id="regenerateKeyBtn">REGENERATE STREAM KEY</button><button class="smallbtn" id="toolsDone">DONE</button></div></div></div></div>';
    const toolsBtn=document.getElementById('toolsBtn'),toolsModal=document.getElementById('toolsModal'),toolsClose=document.getElementById('toolsClose'),toolsDone=document.getElementById('toolsDone'),regen=document.getElementById('regenerateKeyBtn'),copySetup=document.getElementById('copyEncoderSetup');
    const installBtn=document.getElementById('installBtn');if(installBtn){installBtn.onclick=installLivePwa;if(isStandalone())installBtn.style.display='none';}
    if(toolsBtn)toolsBtn.onclick=showTools;if(toolsClose)toolsClose.onclick=()=>toolsModal.classList.add('hidden');if(toolsDone)toolsDone.onclick=()=>toolsModal.classList.add('hidden');if(toolsModal)toolsModal.onclick=e=>{if(e.target===toolsModal)toolsModal.classList.add('hidden')};document.querySelectorAll('.copy-value').forEach(btn=>btn.onclick=async()=>{const el=document.getElementById(btn.dataset.copyId);const value=el?.textContent||'';try{await navigator.clipboard.writeText(value);btn.textContent='COPIED';setTimeout(()=>btn.textContent='COPY',1200)}catch{btn.textContent='FAILED'}});if(copySetup)copySetup.onclick=async()=>{const s=getSelected();if(!s)return;const text=['RTMP Server: '+(s.rtmp_server||''),'Stream Key: '+(s.stream_key||''),'HLS URL: '+(s.hls_url?(location.origin+s.hls_url):''),'Viewer URL: '+(s.viewer_url||'')].join('\\n');try{await navigator.clipboard.writeText(text);copySetup.textContent='COPIED';setTimeout(()=>copySetup.textContent='COPY ENCODER SETUP',1200)}catch{copySetup.textContent='COPY FAILED'}};if(regen)regen.onclick=async()=>{const s=getSelected();if(!s)return;if(!confirm('Regenerate the stream key for "'+s.name+'"? The current encoder will stop working until you update it with the new key.'))return;regen.disabled=true;regen.textContent='REGENERATING…';try{const d=await api('/api/live/streams/'+encodeURIComponent(s.id)+'/regenerate-key',{method:'POST'});const next=d.stream;streams=streams.map(x=>x.id===next.id?next:x);selectedId=next.id;showTools();renderChannels();renderedStudioSignature='';renderStudio();toast('Stream key regenerated. Update your encoder with the new key.')}catch(e){toast(e.message||'Could not regenerate stream key')}finally{regen.disabled=false;regen.textContent='REGENERATE STREAM KEY'}};
  }
  function showTools(){const s=getSelected(),m=document.getElementById('toolsModal');if(!s||!m){toast('Select a channel first');return}const name=document.getElementById('toolsChannelName'),rtmp=document.getElementById('toolsRtmp'),key=document.getElementById('toolsKey'),hls=document.getElementById('toolsHls'),viewer=document.getElementById('toolsViewer');if(name)name.textContent=s.name||'Selected channel';if(rtmp)rtmp.textContent=s.rtmp_server||'RTMP server unavailable';if(key)key.textContent=s.stream_key||'—';if(hls)hls.textContent=s.hls_url?(location.origin+s.hls_url):'—';if(viewer)viewer.textContent=s.viewer_url||'—';m.classList.remove('hidden')}  function getSelected(){return streams.find(s=>s.id===selectedId)||null}
  function segments(n){return Array.from({length:n},()=>'<i></i>').join('')}
  function renderChannels(){
    const el=document.getElementById('channels'),count=document.getElementById('channelCount');if(!el)return;
    count.textContent=streams.length+' channel'+(streams.length===1?'':'s');
    el.innerHTML=streams.length?streams.map(s=>'<div class="channel '+(s.id===selectedId?'active':'')+'" data-id="'+esc(s.id)+'"><div class="channel-top"><div class="channel-name">'+esc(s.name)+'</div><span class="badge '+(s.status==='live'?'live':'')+'">'+(s.status==='live'?'LIVE':'OFFLINE')+'</span></div><div class="channel-meta">'+esc(s.title||'')+'<br>'+Number(s.current_viewers||0)+' watching now</div></div>').join(''):'<div class="placeholder" style="min-height:160px"><div><b>No live channels</b><span>Create a channel from the main Studio when needed.</span></div></div>';
    el.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{selectedId=x.dataset.id;renderChannels();renderedStudioSignature='';renderStudio();refreshViewerCount()});
  }
  function placeholder(msg,sub){return '<div class="placeholder"><div><b>'+esc(msg)+'</b><span>'+esc(sub)+'</span></div></div>'}
  const ICON={
    signal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 0 1 15 0"/><path d="M8 12a4 4 0 0 1 8 0"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>',
    tv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z" fill="currentColor"/></svg>',
    rec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
    nosig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4M4 4l16 16"/></svg>'
  };
  const NEG_INF='−∞';
  function sourceTile(icon,title,sub,on){return '<div class="source'+(on?' live':'')+'"><div class="ico">'+icon+'</div><div class="source-text"><b>'+title+'</b><span>'+sub+'</span></div></div>'}
  function stripV(key,label,sub,cls){return '<div class="strip'+(cls?' '+cls:'')+'"><div class="label">'+label+'</div><div class="m m-v" data-meter="'+key+'"><i class="m-fill"></i><i class="m-peak"></i></div><div class="read" data-read="'+key+'">'+NEG_INF+'</div><small>'+sub+'</small></div>'}
  function stripScale(){const t=[[0,'0'],[-6,'−6'],[-12,'−12'],[-18,'−18'],[-30,'−30'],[-45,'−45'],[-60,'−60']];return '<div class="strip scale"><div class="label">&nbsp;</div><div class="m-scale">'+t.map(function(x){return '<i style="bottom:'+((x[0]+60)/60*100).toFixed(2)+'%">'+x[1]+'</i>'}).join('')+'</div><div class="read">&nbsp;</div><small>&nbsp;</small></div>'}
  function rowH(key,label){return '<div class="hrow"><span class="hl">'+label+'</span><div class="m m-h" data-meter="'+key+'"><i class="m-fill"></i><i class="m-peak"></i></div><span class="hr" data-read="'+key+'">'+NEG_INF+'</span></div>'}
  function noSig(title,sub){return '<div class="nosignal">'+ICON.nosig+'<b>'+title+'</b><span>'+sub+'</span></div>'}
  function setMeterState(code,text){
    const el=document.getElementById('meterState');if(!el)return;
    const s=getSelected(),live=!!s&&s.status==='live'&&!!s.viewer_url;
    if(!live&&(code==='waiting'||code==='noaudio'||code==='activate')){code='idle';text='Channel offline'}
    el.dataset.code=code;el.textContent=text;
  }
  function setEngine(ok){const d=document.getElementById('engineDot'),t=document.getElementById('engineText');if(d)d.className='edot '+(ok?'ok':'bad');if(t)t.textContent=ok?'Connected':'Reconnecting…'}
  function renderStudio(){
    const s=getSelected(),studio=document.getElementById('studio');if(!studio)return;
    if(!s){FBIMeters.stop();studio.innerHTML=placeholder('Select a live channel','Choose a channel from the left to open the control room.');return}
    const live=s.status==='live'&&!!s.viewer_url;
    const rec=!!s.record_enabled,viewers=Number(s.current_viewers||0);
    studio.innerHTML=
      '<div class="statusbar"><div class="chips"><span class="chip'+(live?' live':'')+'">'+(live?'LIVE':'OFFLINE')+'</span><span class="chip quiet">'+esc(s.name)+'</span><span class="chip gold">'+(rec?'AUTO-RECORD ON':'AUTO-RECORD OFF')+'</span></div>'+
      '<div class="chips"><span class="control" id="duration">'+(live?'ON AIR':'OFFLINE')+'</span><span class="chip quiet"><span class="viewers"><b id="viewerTop">'+viewers+'</b> viewers</span></span></div></div>'+
      '<div class="work"><div class="primary-area">'+
        '<div class="views">'+
          '<div class="view"><div class="view-head"><b class="preview-label">PREVIEW</b><span id="previewStatus">'+(live?'CONNECTING':'NO SIGNAL')+'</span></div>'+(live?'':noSig('No signal','Waiting for a source'))+'<video class="frame" id="previewVideo" playsinline muted autoplay></video><div class="overlay-note" id="previewNote">'+(live?'Incoming live signal':'Select a Local Studio source below for Preview')+'</div></div>'+
          '<div class="view program'+(live?' onair':'')+'"><div class="view-head"><b class="program-label">PROGRAM</b><span id="programStatus">'+(live?'CONNECTING':'OFF AIR')+'</span></div>'+(live?'':noSig('Off air','Waiting for your encoder'))+'<video class="frame" id="programVideo" playsinline muted autoplay></video><div class="overlay-note" id="programNote">'+(live?'Clean program output':'Start OBS/vMix and go LIVE before using TAKE to Program')+'</div></div>'+
        '</div>'+
        '<div class="sources">'+sourceTile(ICON.signal,'INPUT',live?'Active':'Waiting',live)+sourceTile(ICON.tv,'PROGRAM',live?'On air':'Off',live)+sourceTile(ICON.play,'WATCH','Viewer link ready',false)+sourceTile(ICON.rec,'RECORD',rec?'Armed':'Off',rec)+'</div>'+
        '<section class="mixer-card"><div class="card-head"><h3>Audio mixer<span class="unit">dBFS &middot; peak</span></h3><span class="pill" id="meterState" data-code="idle">Meters idle</span></div><div class="mixer">'+stripScale()+stripV('pvL','PREVIEW L','Feed')+stripV('pvR','PREVIEW R','Feed')+stripV('pgL','PROGRAM L','On air')+stripV('pgR','PROGRAM R','On air')+stripV('master','MASTER','Peak','master')+'</div></section>'+
      '</div>'+
      '<aside class="rack"><div class="panel"><div class="ph">Operator controls</div><div class="pb grid2"><button class="rack-btn primary" id="watchBtn">WATCH</button><button class="rack-btn" id="fullBtn">FULL</button><button class="rack-btn" id="copyBtn">COPY</button><button class="rack-btn" id="muteBtn">UNMUTE</button></div></div>'+
      '<div class="panel"><div class="ph">Channel status</div><div class="pb"><div class="rack-row"><span>Signal</span><b>'+(live?'ON AIR':'OFFLINE')+'</b></div><div class="rack-row"><span>Viewers</span><b id="viewerRack">'+viewers+'</b></div><div class="rack-row"><span>Auto-record</span><b>'+(rec?'ARMED':'OFF')+'</b></div><div class="rack-row"><span>Format</span><b>H.264 / AAC</b></div><div class="rack-row"><span>Delivery</span><b>HLS</b></div></div></div>'+
      '<div class="panel"><div class="ph">Audio levels</div><div class="pb">'+rowH('pgL','L')+rowH('pgR','R')+'<div class="rack-row"><span>Master peak</span><b data-read="master">'+NEG_INF+'</b></div></div></div></aside></div>'+
      '<div class="controls"><div class="control-group"><button class="smallbtn primary" id="openWatch">OPEN WATCH PAGE</button><button class="smallbtn" id="monitorBtn">ENABLE METERS</button></div><div class="control-group"><span class="chip">'+(live?'PROGRAM LIVE':'PROGRAM OFFLINE')+'</span></div></div>'+
      '<div class="footer">FBI Live Broadcast Studio</div>';
    bindStudio(s,live);
  }
  function setVideoStatusStandalone(id,text){const e=document.getElementById(id);if(e)e.textContent=text||'';}
  function startStandaloneHls(video,url,statusId){
    if(!video||!url||!video.isConnected)return;
    try{
      if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.addEventListener('loadedmetadata',()=>{video.play().catch(()=>{});setVideoStatusStandalone(statusId,'LIVE')},{once:true});video.load();return}
      if(window.Hls&&window.Hls.isSupported()){
        const hls=new Hls({enableWorker:true,lowLatencyMode:false,liveSyncDurationCount:3,liveMaxLatencyDurationCount:8,maxBufferLength:20,maxMaxBufferLength:45,backBufferLength:30,capLevelToPlayerSize:true,startLevel:-1,xhrSetup:function(xhr){xhr.withCredentials=true}});
        hlsInstances.push(hls);hls.loadSource(url);hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play().catch(()=>{});setVideoStatusStandalone(statusId,'LIVE')});
        hls.on(Hls.Events.ERROR,(event,data)=>{if(data&&data.fatal){try{hls.destroy()}catch{}const s=document.getElementById(statusId);if(s)s.textContent='RECONNECTING';setTimeout(()=>startStandaloneHls(video,url,statusId),1200)}});
        window.__studioHls=hls;
        return;
      }
      video.src=url;video.addEventListener('loadedmetadata',()=>{video.play().catch(()=>{});setVideoStatusStandalone(statusId,'LIVE')},{once:true});video.load();
    }catch(e){const s=document.getElementById('monitorState');if(s)s.textContent='PLAYBACK ERROR'}
  }
  /* ==== FBI METERS ENGINE (begin) ====
     Real-time stereo audio meters for the control room.
  
     How it works: it reads the audio of the Preview and Program <video> elements
     in the browser (video.captureStream() -> Web Audio analysers). That does NOT
     re-route or alter the audio of the players, so playback, mute state and
     autoplay are untouched. If a browser cannot do that, it falls back to the
     server's /audio-level endpoint (mono) so something still moves.
  
     Markup contract: any element with data-meter="KEY" containing .m-fill and
     .m-peak children is a bar (class m-v = vertical, m-h = horizontal). Any element
     with data-read="KEY" receives the dB text. Keys: pvL pvR pgL pgR master. */
  const FBIMeters=(function(){
    const FLOOR=-60, RELEASE_DB_S=22, PEAK_HOLD_MS=1400, PEAK_FALL_DB_S=14, SILENT_MS=4000;
    const AC=window.AudioContext||window.webkitAudioContext;
    const KEYS=['pvL','pvR','pgL','pgR','master'];
    let ctx=null,sink=null,taps={},els={},st={},raf=0,scanTimer=0,serverTimer=0,textTimer=0;
    let running=false,streamId='',onState=function(){},lastTs=0,useServer=false,serverDb=-120,serverAt=0,lastCode='';
    let gestureBound=false,silentSince=0,startedAt=0;
  
    function clamp01(x){return x<0?0:x>1?1:x}
    function freshState(){const o={};KEYS.forEach(k=>o[k]={lvl:FLOOR,peak:FLOOR,peakAt:0});return o}
    function emit(code,text){if(code===lastCode&&!text)return;lastCode=code;try{onState(code,text||'')}catch(e){}}
  
    function bind(root){
      els={};KEYS.forEach(k=>els[k]={bars:[],reads:[]});
      (root||document).querySelectorAll('[data-meter]').forEach(function(e){const k=e.getAttribute('data-meter');if(els[k])els[k].bars.push({el:e,fill:e.querySelector('.m-fill'),peak:e.querySelector('.m-peak'),h:e.classList.contains('m-h')})});
      (root||document).querySelectorAll('[data-read]').forEach(function(e){const k=e.getAttribute('data-read');if(els[k])els[k].reads.push(e)});
    }
  
    function paintKey(k,force){
      const s=st[k],o=els[k];if(!s||!o)return;
      const p=clamp01((s.lvl-FLOOR)/-FLOOR),pk=clamp01((s.peak-FLOOR)/-FLOOR);
      o.bars.forEach(function(b){
        if(b.fill)b.fill.style.clipPath=b.h?'inset(0 '+((1-p)*100).toFixed(2)+'% 0 0)':'inset('+((1-p)*100).toFixed(2)+'% 0 0 0)';
        if(b.peak){if(b.h)b.peak.style.left='calc('+(pk*100).toFixed(2)+'% - 2px)';else b.peak.style.bottom='calc('+(pk*100).toFixed(2)+'% - 2px)';b.peak.style.opacity=pk>0.01?'1':'0'}
      });
    }
    function paintText(){
      KEYS.forEach(function(k){
        const s=st[k],o=els[k];if(!s||!o)return;
        const t=s.peak<=-59?'−∞':s.peak.toFixed(1);
        o.reads.forEach(function(e){if(e.textContent!==t)e.textContent=t});
      });
    }
    function resetDisplay(){st=freshState();KEYS.forEach(function(k){paintKey(k,true)});paintText()}
  
    function ensureCtx(){
      if(ctx||!AC)return ctx;
      try{
        ctx=new AC();
        sink=ctx.createGain();sink.gain.value=0;sink.connect(ctx.destination); // silent: analysers never reach the speakers
      }catch(e){ctx=null}
      bindGestures();
      return ctx;
    }
    function resume(){
      if(!ctx)return Promise.resolve('none');
      if(ctx.state==='running')return Promise.resolve('running');
      return ctx.resume().then(function(){return ctx.state},function(){return ctx.state});
    }
    function bindGestures(){
      if(gestureBound)return;gestureBound=true;
      const h=function(){resume().then(function(s){if(s==='running'){['pointerdown','keydown','touchend','click'].forEach(function(n){document.removeEventListener(n,h,true)});gestureBound=false}})};
      ['pointerdown','keydown','touchend','click'].forEach(function(n){document.addEventListener(n,h,true)});
    }
  
    function disconnectTap(t){
      try{t.src&&t.src.disconnect()}catch(e){}
      try{t.up&&t.up.disconnect()}catch(e){}
      try{t.split&&t.split.disconnect()}catch(e){}
      try{t.an&&t.an.forEach(function(a){a.disconnect()})}catch(e){}
      t.src=t.up=t.split=null;t.an=null;t.trackId='';t.has=false;
    }
    function setTap(name,video){
      if(taps[name]){disconnectTap(taps[name])}
      taps[name]=video?{video:video,ms:null,trackId:'',has:false,src:null,up:null,split:null,an:null,buf:null,unsupported:!(video.captureStream||video.mozCaptureStream)}:null;
    }
    function scanTap(t){
      if(!t||!t.video)return;
      if(t.unsupported)return;
      try{
        if(!t.ms)t.ms=(t.video.captureStream||t.video.mozCaptureStream).call(t.video);
        const tr=t.ms.getAudioTracks();
        if(!tr.length){if(t.has)disconnectTap(t);return}
        const id=tr[0].id;
        if(t.has&&t.trackId===id)return;
        disconnectTap(t);
        if(!ensureCtx())return;
        t.src=ctx.createMediaStreamSource(new MediaStream([tr[0]]));
        t.up=ctx.createGain();t.up.channelCount=2;t.up.channelCountMode='explicit';t.up.channelInterpretation='speakers'; // mono -> L=R
        t.split=ctx.createChannelSplitter(2);
        t.an=[ctx.createAnalyser(),ctx.createAnalyser()];
        t.an.forEach(function(a){a.fftSize=2048;a.smoothingTimeConstant=0;a.connect(sink)});
        t.buf=[new Float32Array(2048),new Float32Array(2048)];
        t.src.connect(t.up);t.up.connect(t.split);t.split.connect(t.an[0],0);t.split.connect(t.an[1],1);
        t.trackId=id;t.has=true;
      }catch(e){t.unsupported=true;disconnectTap(t)}
    }
    function peakDb(t,ch){
      t.an[ch].getFloatTimeDomainData(t.buf[ch]);
      const b=t.buf[ch];let m=0;for(let i=0;i<b.length;i++){const v=b[i]<0?-b[i]:b[i];if(v>m)m=v}
      return m>0?20*Math.log10(m):-120;
    }
    function feed(k,db,now,dt){
      const s=st[k];
      if(db>s.lvl)s.lvl=db;else s.lvl=Math.max(db,s.lvl-RELEASE_DB_S*dt);
      if(s.lvl<FLOOR)s.lvl=FLOOR;
      if(db>=s.peak){s.peak=Math.max(db,FLOOR);s.peakAt=now}
      else if(now-s.peakAt>PEAK_HOLD_MS)s.peak=Math.max(s.lvl,s.peak-PEAK_FALL_DB_S*dt);
    }
  
    function frame(now){
      if(!running)return;
      raf=requestAnimationFrame(frame);
      const dt=lastTs?Math.min(0.1,(now-lastTs)/1000):0.016;lastTs=now;
      const live=ctx&&ctx.state==='running';
      let any=false,loud=false;
      const val={pvL:-120,pvR:-120,pgL:-120,pgR:-120};
      if(useServer){
        const fresh=performance.now()-serverAt<2500;
        const d=fresh?serverDb:-120;
        val.pvL=val.pvR=val.pgL=val.pgR=d;any=fresh;if(d>-59)loud=true;
      }else if(live){
        [['pv',taps.pv],['pg',taps.pg]].forEach(function(p){
          const t=p[1];if(!t||!t.has||!t.an)return;
          any=true;
          const l=peakDb(t,0),r=peakDb(t,1);
          val[p[0]+'L']=l;val[p[0]+'R']=r;if(l>-59||r>-59)loud=true;
        });
      }
      KEYS.forEach(function(k){
        if(k==='master')return;
        feed(k,val[k],now,dt);
      });
      feed('master',Math.max(val.pgL,val.pgR,val.pvL,val.pvR),now,dt);
      KEYS.forEach(function(k){paintKey(k)});
      if(any&&!loud){if(!silentSince)silentSince=now}else silentSince=0;
      if(now-textTimer>100){textTimer=now;paintText()}
    }
  
    function scan(){
      if(!running)return;
      if(!useServer){
        scanTap(taps.pv);scanTap(taps.pg);
        const candidates=[taps.pv,taps.pg].filter(Boolean);
        const supported=candidates.some(function(t){return !t.unsupported});
        if(!AC||!supported){useServer=true;startServerPoll()}
      }
      let code,text;
      if(useServer){code='server';text='Server meter (mono)'}
      else if(!ctx||ctx.state!=='running'){code='activate';text='Click anywhere on the page to activate meters'}
      else{
        const any=[taps.pv,taps.pg].some(function(t){return t&&t.has});
        const age=performance.now()-startedAt;
        if(!any){code=age>6000?'noaudio':'waiting';text=age>6000?'No audio track detected':'Waiting for audio…'}
        else if(silentSince&&performance.now()-silentSince>SILENT_MS){code='silent';text='Audio is silent'}
        else{code='live';text='Live metering'}
      }
      emit(code,text);
    }
  
    function startServerPoll(){
      if(serverTimer)return;
      const poll=function(){
        if(!running||!useServer||!streamId)return;
        fetch('/api/live/streams/'+encodeURIComponent(streamId)+'/audio-level?ts='+Date.now(),{cache:'no-store'})
          .then(function(r){return r.ok?r.json():null}).then(function(d){
            if(!d)return;const v=Number.isFinite(Number(d.overall))?Number(d.overall):-120;serverDb=v<=-59.9?-120:v;serverAt=performance.now();
          }).catch(function(){});
      };
      poll();serverTimer=setInterval(poll,500);
    }
  
    function stop(){
      running=false;
      if(raf)cancelAnimationFrame(raf);raf=0;
      if(scanTimer)clearInterval(scanTimer);scanTimer=0;
      if(serverTimer)clearInterval(serverTimer);serverTimer=0;
      Object.keys(taps).forEach(function(n){if(taps[n])disconnectTap(taps[n])});taps={};
      useServer=false;silentSince=0;lastCode='';
      resetDisplay();
      try{onState('idle','Meters idle')}catch(e){}
    }
  
    function start(o){
      stop();
      running=true;startedAt=performance.now();
      streamId=o.streamId||'';onState=o.onState||function(){};
      bind(o.root||document);st=freshState();
      ensureCtx();resume();
      setTap('pv',o.preview||null);setTap('pg',o.program||null);
      lastTs=0;textTimer=0;lastCode='';
      scan();
      scanTimer=setInterval(scan,600);
      raf=requestAnimationFrame(frame);
    }
  
    return {start:start,stop:stop,resume:resume,bind:bind,reset:resetDisplay,_state:function(){return {st:st,useServer:useServer,ctx:ctx&&ctx.state}}};
  })();
  /* ==== FBI METERS ENGINE (end) ==== */
  function notify(m){if(typeof toast==='function')toast(m)}
  function bindStudioMedia(s,live){
    const pv=document.getElementById('previewVideo'),pr=document.getElementById('programVideo');
    // Stop players from the previous render so channel switches never leave
    // hidden streams downloading in the background.
    while(hlsInstances.length){try{hlsInstances.pop().destroy()}catch{}}
    // Meters read the players' audio in the browser (see FBIMeters). They never
    // re-route or change the players, so playback, mute and autoplay are untouched.
    FBIMeters.start({streamId:s.id,preview:pv,program:pr,root:document.getElementById('studio'),onState:setMeterState});
    if(!live)return;
    const publicToken=s.viewer_url?String(s.viewer_url).split('/watch/').pop().split(/[?#]/)[0]:'';
    const playbackUrl=publicToken?('/api/public/stream/'+encodeURIComponent(publicToken)+'/hls/index.m3u8'):(s.hls_url||'');
    // Preview and Program remain ordinary independent HLS players (unchanged).
    if(pv)startStandaloneHls(pv,playbackUrl,'previewStatus');
    if(pr)startStandaloneHls(pr,playbackUrl,'programStatus');
  }

  function bindStudio(s,live){
    bindStudioMedia(s,live);
    const open=()=>window.open(s.viewer_url,'_blank','noopener');
    document.getElementById('watchBtn').onclick=open;document.getElementById('openWatch').onclick=open;
    document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText('Server: '+s.rtmp_server+'\nStream Key: '+s.stream_key);notify('Encoder setup copied')}catch{notify('Could not copy')}};
    document.getElementById('fullBtn').onclick=()=>{
      const v=document.getElementById('programVideo');
      if(v?.requestFullscreen)v.requestFullscreen().catch(open);else open();
    };
    document.getElementById('muteBtn').onclick=()=>{
      const v=document.getElementById('programVideo');if(!v)return;
      v.muted=!v.muted;
      document.getElementById('muteBtn').textContent=v.muted?'UNMUTE':'MUTE';
    };
    const activate=()=>FBIMeters.resume().then(st=>{if(st==='running')notify('Audio meters active')});
    document.getElementById('monitorBtn').onclick=activate;
    const pill=document.getElementById('meterState');if(pill)pill.onclick=activate;
    if(window.__durationTimer)clearInterval(window.__durationTimer);
    const started=s.started_at?Date.parse(s.started_at):NaN,el=document.getElementById('duration');const tick=()=>{if(!el||!live)return;if(!Number.isFinite(started)){el.textContent='ON AIR';return}let sec=Math.max(0,Math.floor((Date.now()-started)/1000)),h=Math.floor(sec/3600);sec%=3600;let m=Math.floor(sec/60),ss=sec%60;el.textContent=(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')};tick();window.__durationTimer=setInterval(tick,1000);
  }
  let viewerCountTimer=0;
  async function refreshViewerCount(){
    try{
      const s=getSelected();
      if(!s||!s.viewer_token)return;
      const r=await api('/api/public/stream/'+encodeURIComponent(s.viewer_token)+'/status');
      const count=Number(r.current_viewers||0);
      const top=document.getElementById('viewerTop'),rack=document.getElementById('viewerRack');
      if(top)top.textContent=String(count);
      if(rack)rack.textContent=String(count);
      // Keep the selected channel card in sync without rebuilding the player.
      const card=document.querySelector('#channels [data-id="'+s.id+'"] .channel-meta');
      if(card){
        const title=esc(s.title||'');
        card.innerHTML=title+'<br>'+count+' watching now';
      }
    }catch(e){/* viewer count is non-critical; keep the current displayed value */}
  }
  function startViewerCountPolling(){
    if(viewerCountTimer)clearInterval(viewerCountTimer);
    refreshViewerCount();
    viewerCountTimer=setInterval(refreshViewerCount,2000);
  }
  let renderedStudioSignature='';
  async function load(){
    try{
      const d=await api('/api/live/streams');
      streams=d.streams||[];setEngine(true);
      if(!selectedId&&streams[0])selectedId=streams[0].id;
      if(selectedId&&!streams.some(s=>s.id===selectedId))selectedId=streams[0]?.id||null;
      renderChannels();
      const s=getSelected();
      // Keep the currently playing HLS MediaSource alive during status polling.
      // Rebuilding the video DOM every 5 seconds was causing the picture to
      // flash briefly and then return to black.
      const signature=s?[s.id,s.status,s.viewer_url||'',s.hls_url||''].join('|'):'none';
      if(signature!==renderedStudioSignature){
        renderedStudioSignature=signature;
        renderStudio();
      }else if(s){
        const v=Number(s.current_viewers||0);
        const t=document.getElementById('viewerTop'),r=document.getElementById('viewerRack');
        if(t)t.textContent=String(v);if(r)r.textContent=String(v);
      }
    }catch(e){if(e.message==='Unauthorised'||e.message==='Please log in')login();else setEngine(false)}
  }
  let deferredInstallPrompt=null;
  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    deferredInstallPrompt=event;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='inline-flex';
  });
  window.addEventListener('appinstalled',()=>{
    deferredInstallPrompt=null;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='none';
  });
  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  }
  async function installLivePwa(){
    if(isStandalone())return;
    if(!deferredInstallPrompt){toast('Use your browser menu and choose Install FBI Live.');return}
    try{
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
    }catch{}
    deferredInstallPrompt=null;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='none';
  }

  async function registerLivePwa(){
    if(!('serviceWorker' in navigator))return;
    try{await navigator.serviceWorker.register('/sw.js',{scope:'/'})}catch(e){console.warn('FBI Live PWA registration failed',e)}
  }

  async function boot(){
    // Development/open-control mode: the standalone Live Control Center is
    // intentionally accessible without an administrative login for now.
    renderShell();
    bindChannelCreator();
    await load();
    startViewerCountPolling();
    if(refreshTimer)clearInterval(refreshTimer);
    refreshTimer=setInterval(load,5000);
    const installBtn=document.getElementById('installBtn');
    if(installBtn){installBtn.style.display='inline-flex';installBtn.onclick=installLivePwa}
  }  function closeChannelModal(){const m=document.getElementById('channelModal');if(m)m.classList.add('hidden')}
  function openChannelModal(){const m=document.getElementById('channelModal');if(!m)return;m.classList.remove('hidden');document.getElementById('channelResult').style.display='none';document.getElementById('newChannelName').focus()}
  function bindChannelCreator(){
    const add=document.getElementById('addChannelBtn'),close=document.getElementById('channelClose'),cancel=document.getElementById('channelCancel'),modal=document.getElementById('channelModal'),create=document.getElementById('channelCreate');
    if(add)add.onclick=openChannelModal;if(close)close.onclick=closeChannelModal;if(cancel)cancel.onclick=closeChannelModal;
    if(modal)modal.onclick=e=>{if(e.target===modal)closeChannelModal()};
    if(create)create.onclick=async function(){
      const name=document.getElementById('newChannelName').value.trim(),title=document.getElementById('newChannelTitle').value.trim(),description=document.getElementById('newChannelDescription').value.trim(),result=document.getElementById('channelResult');
      if(!name){toast('Channel name is required');return}
      create.disabled=true;create.textContent='CREATING…';
      try{
        const d=await api('/api/live/streams',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,title,description})});
        selectedId=d.stream.id;
        result.style.display='block';
        result.innerHTML='<b>Channel created. RTMP setup generated.</b><div>Server<br><code>'+esc(d.stream.rtmp_server||'')+'</code></div><div style="margin-top:6px">Stream Key<br><code>'+esc(d.stream.stream_key||'')+'</code></div>';
        await load();setTimeout(closeChannelModal,1000);
      }catch(e){toast(e.message||'Could not create channel')}
      finally{create.disabled=false;create.textContent='CREATE CHANNEL'}
    };
  }

  registerLivePwa();
  boot();
})();
