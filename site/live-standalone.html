<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<div class="channel-modal hidden" id="channelModal"><div class="channel-box"><div class="channel-head"><b>Create Live Channel</b><button class="channel-close" id="channelClose">×</button></div><div class="channel-body"><p class="channel-help">Create a channel for OBS, vMix, Streamlabs or another RTMP encoder. The existing live streaming engine is unchanged.</p><div class="field"><label>Channel Name</label><input id="newChannelName" placeholder="e.g. Wedding Live"></div><div class="field"><label>Stream Title</label><input id="newChannelTitle" placeholder="Title viewers will see"></div><div class="field"><label>Description</label><textarea id="newChannelDescription" placeholder="Optional broadcast description"></textarea></div><div id="channelResult" class="channel-result" style="display:none"></div></div><div class="channel-foot"><button class="btn" id="channelCancel">Cancel</button><button class="btn primary" id="channelCreate">CREATE CHANNEL</button></div></div></div>
<script>
(function(){
  const root=document.getElementById('root');
  let streams=[],selectedId=null,refreshTimer=null,audioState=null;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  async function api(url,options){const r=await fetch(url,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
  function authCard(mode,extra){
    const setup=mode==='setup',forgot=mode==='forgot';
    const title=setup?'Create Live Admin Account':forgot?'Reset Admin Password':'FBI Live Broadcast Studio';
    const subtitle=setup?'Set up the administrator account for this standalone control room.':forgot?'Recover access using your security question.':'Standalone professional live production control room';
    const body=setup
      ? '<div class="field"><label>Full Name</label><input id="fullName" placeholder="Administrator name"></div>'+
        '<div class="field"><label>Email</label><input id="email" type="email" placeholder="admin@example.com"></div>'+
        '<div class="field"><label>Password</label><input id="password" type="password" placeholder="At least 10 characters"></div>'+
        '<div class="field"><label>Confirm Password</label><input id="confirmPassword" type="password" placeholder="Repeat password"></div>'+
        '<div class="field"><label>Security Question</label><select id="securityQuestion"><option value="What was the name of your first school?">What was the name of your first school?</option><option value="What city were you born in?">What city were you born in?</option><option value="What was your first job?">What was your first job?</option><option value="What was the name of your first pet?">What was the name of your first pet?</option></select></div>'+
        '<div class="field"><label>Security Answer</label><input id="securityAnswer" placeholder="Your private recovery answer"></div>'+
        '<button class="auth-primary" id="setupBtn">Create Admin Account</button>'+
        '<button class="auth-link" id="toLogin">Already have an account? Sign in</button>'
      : forgot
        ? '<div class="field"><label>Admin Email</label><input id="email" type="email" placeholder="Your admin email"></div>'+
          '<button class="auth-secondary" id="questionBtn">Load Security Question</button>'+
          '<div id="questionBox" class="question-box" style="display:none"></div>'+
          '<div id="resetFields" style="display:none"><div class="field"><label>Security Answer</label><input id="securityAnswer" placeholder="Your recovery answer"></div><div class="field"><label>New Password</label><input id="password" type="password" placeholder="At least 10 characters"></div><div class="field"><label>Confirm Password</label><input id="confirmPassword" type="password" placeholder="Repeat password"></div><button class="auth-primary" id="resetBtn">Reset Password</button></div>'+
          '<button class="auth-link" id="toLogin">Back to sign in</button>'
        : '<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Admin email"></div>'+
          '<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"></div>'+

  function startStandaloneHls(video,url,statusId){
    if(!video||!url)return;
    try{
      if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.addEventListener('loadedmetadata',()=>{video.play().catch(()=>{});setVideoStatusStandalone(statusId,'LIVE')},{once:true});video.load();return}
      if(window.Hls&&window.Hls.isSupported()){
        const hls=new Hls({enableWorker:true,lowLatencyMode:false,liveSyncDurationCount:3,liveMaxLatencyDurationCount:8,maxBufferLength:20,maxMaxBufferLength:45,backBufferLength:30,capLevelToPlayerSize:true,startLevel:-1,xhrSetup:function(xhr){xhr.withCredentials=true}});
        hls.loadSource(url);hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play().catch(()=>{});setVideoStatusStandalone(statusId,'LIVE')});
        hls.on(Hls.Events.ERROR,(event,data)=>{if(data&&data.fatal){try{hls.destroy()}catch{}const s=document.getElementById(statusId);if(s)s.textContent='RECONNECTING';setTimeout(()=>startStandaloneHls(video,url,statusId),1200)}});
        window.__studioHls=hls;
        return;
      }
      video.src=url;video.addEventListener('loadedmetadata',()=>{video.play().catch(()=>{});setVideoStatusStandalone(statusId,'LIVE')},{once:true});video.load();
    }catch(e){const s=document.getElementById('monitorState');if(s)s.textContent='PLAYBACK ERROR'}
  }
  function db(an){
    const a=new Uint8Array(an.fftSize);an.getByteTimeDomainData(a);let s=0;for(let i=0;i<a.length;i++){let x=(a[i]-128)/128;s+=x*x}const rms=Math.sqrt(s/a.length);return rms>0?20*Math.log10(rms):-60;
  }
  function paint(id,val){
    const e=document.getElementById(id);if(!e)return;const n=e.querySelectorAll('i'),lvl=Math.max(0,Math.min(n.length,Math.round((Math.max(-48,Math.min(0,val))+48)/48*n.length)));
    n.forEach((x,i)=>x.className=i<lvl?(val>-6&&i>=n.length-4?'clip':val>-14&&i>=n.length-7?'hot':'on'):'');
  }
  function paintAudioLevel(level){
    const v=Math.max(-60,Math.min(0,Number(level)));
    ['meterL','rackL'].forEach(id=>paint(id,v));
    ['meterR','rackR'].forEach(id=>paint(id,v));
    ['meterStream','meterMonitor','meterMaster','audioMeter'].forEach(id=>paint(id,v));
    [['dbL',v],['rackDbL',v],['dbR',v],['rackDbR',v],['dbMaster',v],['audioDb',v]].forEach(([id,val])=>{
      const e=document.getElementById(id);
      if(e)e.textContent=val<=-59?'−∞':val.toFixed(1)+(id==='audioDb'?' dBFS':' dB');
    });
    const st=document.getElementById('monitorState');
    if(st)st.textContent='ACTIVE';
  }

  function stopAudioMeter(){
    if(!audioState)return;
    if(audioState.timer)clearInterval(audioState.timer);
    audioState=null;
    paintAudioLevel(-60);
    const st=document.getElementById('monitorState');if(st)st.textContent='READY';
  }

  async function pollAudioMeter(){
    const state=audioState;
    if(!state||!state.streamId)return;
    try{
      const d=await api('/api/live/streams/'+encodeURIComponent(state.streamId)+'/audio-level?ts='+Date.now());
      if(audioState!==state)return;
      const level=Number.isFinite(Number(d.overall))?Number(d.overall):Math.max(Number(d.left)||-60,Number(d.right)||-60);
      paintAudioLevel(level);
      state.lastAt=Date.now();
    }catch(e){
      if(audioState===state)paintAudioLevel(-60);
    }
  }

  function startAudioMeter(streamId){
    stopAudioMeter();
    audioState={streamId:String(streamId),timer:null,lastAt:0};
    pollAudioMeter();
    audioState.timer=setInterval(pollAudioMeter,200);
  }

  function bindStudioMedia(s,live){
    const pv=document.getElementById('previewVideo'),pr=document.getElementById('programVideo');
    if(!live){
      stopAudioMeter();
      return;
    }
    const publicToken=s.viewer_url?String(s.viewer_url).split('/watch/').pop().split(/[?#]/)[0]:'';
    const playbackUrl=publicToken?('/api/public/stream/'+encodeURIComponent(publicToken)+'/hls/index.m3u8'):(s.hls_url||'');

    // Preview and Program remain ordinary independent HLS players.
    // Audio metering is supplied by the server-side analyser, so it cannot
    // alter either player's mute state, autoplay, MediaSource, or playback.
    if(pv)startStandaloneHls(pv,playbackUrl,'previewVideo');
    if(pr)startStandaloneHls(pr,playbackUrl,'programVideo');
    startAudioMeter(s.id);
  }

  let renderedStudioSignature='';
  async function load(){
    try{
      const d=await api('/api/live/streams');
      streams=d.streams||[];
      if(!selectedId&&streams[0])selectedId=streams[0].id;
      if(selectedId&&!streams.some(s=>s.id===selectedId))selectedId=streams[0]?.id||null;
      renderChannels();
      const s=getSelected();
      // Keep the currently playing HLS MediaSource alive during status polling.
      // Rebuilding the video DOM every 5 seconds was causing the picture to
      // flash briefly and then return to black.
      const signature=s?[s.id,s.status,s.viewer_url||'',s.hls_url||''].join('|'):'none';
      if(signature!==renderedStudioSignature){
        renderedStudioSignature=signature;
        renderStudio();
      }else if(s){
        const v=Number(s.current_viewers||0);
        const t=document.getElementById('viewerTop'),r=document.getElementById('viewerRack');
        if(t)t.textContent=String(v);if(r)r.textContent=String(v);

    }catch(e){if(e.message==='Unauthorised'||e.message==='Please log in')login()}
  }
  let deferredInstallPrompt=null;
  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    deferredInstallPrompt=event;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='inline-flex';
  });
  window.addEventListener('appinstalled',()=>{
    deferredInstallPrompt=null;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='none';
  });
  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  }
  async function installLivePwa(){
    if(isStandalone())return;
    if(!deferredInstallPrompt){toast('Use your browser menu and choose Install FBI Live.');return}
    try{
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
    }catch{}
    deferredInstallPrompt=null;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='none';
  }

  async function registerLivePwa(){
    if(!('serviceWorker' in navigator))return;
    try{await navigator.serviceWorker.register('/sw.js',{scope:'/'})}catch(e){console.warn('FBI Live PWA registration failed',e)}
  }

  async function boot(){
    // Development/open-control mode: the standalone Live Control Center is
    // intentionally accessible without an administrative login for now.
    renderShell();
    bindChannelCreator();
    await load();
    startViewerCountPolling();
    if(refreshTimer)clearInterval(refreshTimer);
    refreshTimer=setInterval(load,5000);
    const installBtn=document.getElementById('installBtn');
    if(installBtn){installBtn.style.display='inline-flex';installBtn.onclick=installLivePwa}
  }  function closeChannelModal(){const m=document.getElementById('channelModal');if(m)m.classList.add('hidden')}
  function openChannelModal(){const m=document.getElementById('channelModal');if(!m)return;m.classList.remove('hidden');document.getElementById('channelResult').style.display='none';document.getElementById('newChannelName').focus()}
  function bindChannelCreator(){
    const add=document.getElementById('addChannelBtn'),close=document.getElementById('channelClose'),cancel=document.getElementById('channelCancel'),modal=document.getElementById('channelModal'),create=document.getElementById('channelCreate');
    if(add)add.onclick=openChannelModal;if(close)close.onclick=closeChannelModal;if(cancel)cancel.onclick=closeChannelModal;
    if(modal)modal.onclick=e=>{if(e.target===modal)closeChannelModal()};
    if(create)create.onclick=async function(){
      const name=document.getElementById('newChannelName').value.trim(),title=document.getElementById('newChannelTitle').value.trim(),description=document.getElementById('newChannelDescription').value.trim(),result=document.getElementById('channelResult');
      if(!name){toast('Channel name is required');return}
      create.disabled=true;create.textContent='CREATING…';
      try{
        const d=await api('/api/live/streams',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,title,description})});
        selectedId=d.stream.id;
        result.style.display='block';
        result.innerHTML='<b>Channel created. RTMP setup generated.</b><div>Server<br><code>'+esc(d.stream.rtmp_server||'')+'</code></div><div style="margin-top:6px">Stream Key<br><code>'+esc(d.stream.stream_key||'')+'</code></div>';
        await load();setTimeout(closeChannelModal,1000);
      }catch(e){toast(e.message||'Could not create channel')}
      finally{create.disabled=false;create.textContent='CREATE CHANNEL'}
    };
  }

  registerLivePwa();
  boot();
})();
</script>
<script src="/local-studio.js?v=1"></script>
</body>
