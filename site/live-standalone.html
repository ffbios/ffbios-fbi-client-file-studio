<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FBI Live Broadcast Studio</title>
<meta name="application-name" content="FBI Live">
<meta name="theme-color" content="#0a0a0b">
<meta name="background-color" content="#09090a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FBI Live">
<link rel="manifest" href="/manifest.webmanifest?live=v7">
<link rel="icon" href="/live-pwa-icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/official-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07080a;--panel:#0f1217;--panel2:#141820;--line:#1c212a;--line2:#2a303b;--text:#eef0f5;--muted:#8b93a1;--dim:#5f6775;--gold:#e8c85a;--gold2:#c9a53a;--green:#3ddc84;--red:#ff5d6c;--amber:#f5b942;--r:14px;--mh:176px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden;background:radial-gradient(900px 460px at 14% -10%,rgba(232,200,90,.07),transparent 60%),radial-gradient(800px 420px at 100% 0,rgba(106,165,255,.06),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{height:100vh;display:grid;grid-template-columns:288px minmax(0,1fr)}
.sidebar{background:linear-gradient(180deg,#0d1014,#0a0c0f);border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;min-height:0;gap:14px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;padding:22px 26px 26px;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a303b transparent}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:12px;padding:4px 4px 16px;border-bottom:1px solid var(--line);text-align:left}
.brand img{width:64px;height:40px;object-fit:contain;flex:none}
.brand div{min-width:0}.brand strong{display:block;font-size:15px;letter-spacing:.14em;font-weight:800;white-space:nowrap}
.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sidebar-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:2px 4px}
.sidebar-head h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sidebar-head span{font-size:12px;color:var(--dim)}
.sidebar-head-left{display:flex;flex-direction:column;gap:2px}
.add-channel-btn{border:1px solid var(--line2);background:var(--panel2);color:#f4e7b3;border-radius:10px;padding:7px 10px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.add-channel-btn:hover{border-color:var(--gold2);background:#1b1f27}
.channels{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;display:grid;gap:10px;align-content:start;padding:2px;scrollbar-width:thin;scrollbar-color:#2a303b transparent}
.channel{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.channel:hover{background:var(--panel2);border-color:var(--line2)}
.channel.active{border-color:rgba(232,200,90,.6);background:linear-gradient(180deg,rgba(232,200,90,.09),rgba(232,200,90,.02));box-shadow:0 0 0 1px rgba(232,200,90,.12)}
.channel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.channel-name{min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-meta{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line2);border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--muted)}
.badge.live{color:var(--green);border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.07)}
.badge.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(61,220,132,.7)}
.engine{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.engine b{display:block;font-size:13px}.engine span{display:block;font-size:11.5px;color:var(--muted)}
.edot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.edot.ok{background:var(--green);box-shadow:0 0 10px rgba(61,220,132,.6)}.edot.bad{background:var(--red);box-shadow:0 0 10px rgba(255,93,108,.5)}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.top-title h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.top-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.03em;transition:.15s}
.btn:hover{background:#1b1f27;border-color:#3a4150}
.btn.primary{background:linear-gradient(180deg,#f1da7e,#d8b744);border-color:#d8b744;color:#17150a}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:default}

/* ---------- status strip ---------- */
.studio{display:flex;flex-direction:column;gap:14px;flex:none}
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);flex-wrap:wrap}
.chips{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:#0c0f13;color:#a5adba;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip.live{color:var(--green);border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.07)}
.chip.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px rgba(61,220,132,.7);animation:pulse 1.8s ease-in-out infinite}
.chip.gold{color:#f0d26f;border-color:rgba(232,200,90,.3);background:rgba(232,200,90,.05)}
.chip.quiet{text-transform:none;letter-spacing:.02em;font-weight:600;color:var(--muted)}
.control{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d6dae2;letter-spacing:.04em}
.viewers{font-size:12px;color:#f0f2f6}.viewers b{font-size:14px;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.35}}

/* ---------- work area ---------- */
.work{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:14px;align-items:start}
.primary-area{min-width:0;display:flex;flex-direction:column;gap:14px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.view{position:relative;min-width:0;aspect-ratio:16/9;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.view.program.onair{border-color:rgba(255,93,108,.55);box-shadow:0 0 0 1px rgba(255,93,108,.18),0 18px 50px rgba(0,0,0,.4)}
.view-head{position:absolute;top:0;left:0;right:0;z-index:5;padding:12px 14px;background:linear-gradient(180deg,rgba(0,0,0,.78),transparent);display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.view-head b{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em}
.preview-label{color:#e1e4ea}.program-label{color:#ffb0b8}
.view.program.onair .program-label:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(255,93,108,.8)}
.view-head span{font-size:11px;font-weight:700;letter-spacing:.08em;color:#aab1bd}
.frame{position:relative;z-index:2;width:100%;height:100%;display:block;border:0;background:transparent;object-fit:contain}
.nosignal{position:absolute;inset:0;z-index:1;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;padding:24px;background:radial-gradient(420px 220px at 50% 45%,rgba(232,200,90,.07),transparent 70%),#06070a;color:var(--muted)}
.nosignal svg{width:38px;height:38px;color:#3b4250;margin:0 auto 4px}
.nosignal b{color:#cfd4dd;font-size:14px;letter-spacing:.06em}
.nosignal span{font-size:12.5px}
.overlay-note{position:absolute;left:12px;bottom:12px;z-index:5;max-width:calc(100% - 24px);padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);font-size:11.5px;color:#c4cad4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.placeholder{min-height:260px;display:grid;place-items:center;text-align:center;padding:30px;border:1px dashed var(--line2);border-radius:var(--r);background:radial-gradient(500px 220px at 50% 40%,rgba(232,200,90,.06),transparent 65%),var(--panel);color:var(--muted)}
.placeholder b{display:block;color:#dfe3ea;font-size:15px}.placeholder span{display:block;margin-top:6px;font-size:13px;line-height:1.5}

/* ---------- source tiles ---------- */
.sources{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.source{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.source .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#0b0e12;border:1px solid var(--line);color:var(--dim)}
.source .ico svg{width:20px;height:20px}
.source-text{min-width:0;display:grid;gap:1px}
.source-text b{font-size:12px;letter-spacing:.08em;color:#d4d8e0}
.source-text span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.source.live .ico{color:var(--green);border-color:rgba(61,220,132,.3);background:rgba(61,220,132,.06)}
.source.live .source-text span{color:var(--green)}

/* ---------- audio mixer ---------- */
.mixer-card,.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#c4cad4}
.card-head .unit{font-size:11px;color:var(--dim);margin-left:8px;font-weight:600;letter-spacing:.04em;text-transform:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);font-size:11.5px;font-weight:700;color:var(--muted);background:#0c0f13}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill[data-code=live]{color:var(--green);border-color:rgba(61,220,132,.35)}.pill[data-code=live]:before{background:var(--green);box-shadow:0 0 8px rgba(61,220,132,.7)}
.pill[data-code=activate]{color:var(--amber);border-color:rgba(245,185,66,.4);cursor:pointer}.pill[data-code=activate]:before{background:var(--amber);animation:pulse 1.4s infinite}
.pill[data-code=silent],.pill[data-code=noaudio]{color:var(--amber);border-color:rgba(245,185,66,.35)}.pill[data-code=silent]:before,.pill[data-code=noaudio]:before{background:var(--amber)}
.pill[data-code=server]{color:#9cc2ff;border-color:rgba(106,165,255,.35)}.pill[data-code=server]:before{background:#6aa5ff}
.mixer{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:10px;padding:16px 18px 18px}
.strip{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;padding:12px 6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.strip.scale{background:transparent;border-color:transparent;padding-left:0;padding-right:0;align-items:stretch}
.strip .label{height:16px;font-size:11px;font-weight:800;letter-spacing:.09em;color:#e3e6ec;white-space:nowrap}
.strip .read{height:20px;font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e9ecf2;font-variant-numeric:tabular-nums}
.strip small{height:15px;font-size:11px;color:var(--dim)}
.strip.master{border-color:rgba(232,200,90,.3);background:linear-gradient(180deg,rgba(232,200,90,.07),var(--panel2))}
.m{position:relative;overflow:hidden;background:#090b0e;border:1px solid #1b1f26}
.m-v{width:20px;height:var(--mh);border-radius:6px}
.m-h{flex:1;min-width:0;height:10px;border-radius:5px}
.m-fill{position:absolute;inset:0;display:block;clip-path:inset(100% 0 0 0)}
.m-v .m-fill{background:linear-gradient(to top,var(--green) 0,var(--green) 70%,var(--amber) 70%,var(--amber) 90%,var(--red) 90%,var(--red) 100%)}
.m-h .m-fill{clip-path:inset(0 100% 0 0);background:linear-gradient(to right,var(--green) 0,var(--green) 70%,var(--amber) 70%,var(--amber) 90%,var(--red) 90%,var(--red) 100%)}
.m-v:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to top,transparent 0 4px,#090b0e 4px 6px)}
.m-h:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to right,transparent 0 4px,#090b0e 4px 6px)}
.m-peak{position:absolute;display:block;opacity:0;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.6);z-index:2}
.m-v .m-peak{left:0;right:0;height:2px;bottom:0}
.m-h .m-peak{top:0;bottom:0;width:2px;left:0}
.m-scale{position:relative;width:100%;height:var(--mh);margin-top:0}
.m-scale i{position:absolute;right:0;transform:translateY(50%);font:600 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--dim);font-style:normal;white-space:nowrap}
.hrow{display:grid;grid-template-columns:16px minmax(0,1fr) 52px;align-items:center;gap:10px;margin-bottom:10px}
.hrow .hl{font-size:12px;font-weight:800;color:#c4cad4}.hrow .hr{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:right;color:#e9ecf2;font-variant-numeric:tabular-nums}

/* ---------- right rack ---------- */
.rack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{overflow:hidden}
.ph{padding:13px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#c4cad4}
.pb{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rack-btn{width:100%;border:1px solid var(--line2);background:var(--panel2);color:#e8ebf1;border-radius:10px;padding:11px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;transition:.15s}
.rack-btn:hover{background:#1b1f27;border-color:#3a4150}
.rack-btn.primary{background:linear-gradient(180deg,#f1da7e,#d8b744);border-color:#d8b744;color:#17150a}
.rack-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:7px 0;border-bottom:1px solid #151921}
.rack-row:last-child{border-bottom:0}.rack-row b{color:#eef0f5;font-weight:700;text-align:right}

/* ---------- bottom controls ---------- */
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 14px;flex-wrap:wrap}
.control-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.smallbtn{border:1px solid var(--line2);background:var(--panel2);color:#e1e4ea;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:800;letter-spacing:.05em;transition:.15s}
.smallbtn:hover{background:#1b1f27;border-color:#3a4150}
.smallbtn.primary{background:linear-gradient(180deg,#f1da7e,#d8b744);color:#17150a;border-color:#d8b744}
.chip.tv{color:#ff6b6b;border-color:rgba(255,90,90,.4);background:rgba(255,90,90,.08)}
.tv-push{display:inline-flex;align-items:center;gap:8px;border:1px solid #d8b744;background:linear-gradient(180deg,#f1da7e,#d8b744);color:#17150a;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:900;letter-spacing:.06em;transition:.15s;cursor:pointer;white-space:nowrap}
.tv-push svg{width:18px;height:18px}
.tv-push:hover{filter:brightness(1.07)}
.tv-push.on{background:linear-gradient(180deg,#e5484d,#b8262b);border-color:#e5484d;color:#fff;box-shadow:0 0 0 3px rgba(229,72,77,.22)}
.tv-push:disabled{background:var(--panel2);border-color:var(--line2);color:#7d8491;cursor:not-allowed;filter:none}
.tv-note{margin:8px 0 0;font-size:11.5px;line-height:1.45;color:var(--muted,#9aa1ad)}
.footer{margin-top:14px;color:var(--dim);font-size:12px;text-align:center}

/* ---------- sign-in: program monitor on standby ---------- */
.lg{--slate:#14181d;--glass:#0a0d10;--bezel:#262c34;--bezel2:#323943;--paper:#eee8db;--quiet:#8c939c;--signal:#e8c85a;--tally:#e8402f;--go:#36d278;
  min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 18px;background:var(--slate);font-family:"Instrument Sans",Inter,system-ui,sans-serif;color:var(--paper)}
.lg-wrap{width:min(920px,100%)}
.lg-monitor{position:relative;border-radius:18px;padding:12px;background:linear-gradient(180deg,var(--bezel2),var(--bezel));box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 30px 80px -30px rgba(0,0,0,.8)}
.lg-screen{position:relative;border-radius:9px;background:var(--glass);aspect-ratio:16/9;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
.lg-screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.lg-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;font-size:13px;color:var(--quiet)}
.lg-tally{display:inline-flex;align-items:center;gap:10px;color:var(--paper);font-weight:600}
.lg-lamp{width:12px;height:12px;border-radius:50%;background:var(--tally);box-shadow:0 0 0 3px rgba(232,64,47,.18),0 0 18px rgba(232,64,47,.55);animation:lgPulse 2.4s ease-in-out infinite}
.lg.is-on .lg-lamp{background:var(--go);box-shadow:0 0 0 3px rgba(54,210,120,.2),0 0 22px rgba(54,210,120,.7);animation:none}
@keyframes lgPulse{50%{opacity:.45}}
.lg-brand{display:flex;align-items:center;gap:10px}.lg-brand img{height:22px;width:auto;opacity:.9}
.lg-center{display:grid;place-content:center;text-align:center;gap:6px;padding:0 16px}
.lg-tc{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:clamp(52px,7.4vw,112px);line-height:.9;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--paper)}
.lg-tc .ff{color:var(--signal)}
.lg-tc-note{font-size:13px;color:var(--quiet)}
.lg-strap{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;margin:0 20px 20px;background:rgba(20,24,29,.92);border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset}
.lg-strap::before{content:"";width:6px;background:var(--signal)}
.lg.is-on .lg-strap::before{background:var(--go);transition:background .3s}
.lg-form{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding:14px 16px 16px}
.lg-form h1{grid-column:1/-1;margin:0 0 2px;font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:26px;letter-spacing:.01em;line-height:1}
.lg-field{display:grid;gap:5px}
.lg-field label{font-size:12px;color:var(--quiet)}
.lg-field input{width:100%;height:42px;border-radius:7px;border:1px solid #2d343e;background:#0c0f13;color:var(--paper);padding:0 12px;font:inherit;font-size:14px;outline:none;transition:border-color .15s}
.lg-field input:focus{border-color:var(--signal)}
.lg-go{height:42px;padding:0 20px;border:0;border-radius:7px;background:var(--signal);color:#1a1606;font:600 14px "Instrument Sans",system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.lg-go:hover{filter:brightness(1.06)}.lg-go:disabled{opacity:.6;cursor:wait}
.lg.is-on .lg-go{background:var(--go);color:#06210f}
.lg-field input:focus-visible,.lg-go:focus-visible,.lg-link:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

      else if(!ctx||ctx.state!=='running'){code='activate';text='Click anywhere on the page to activate meters'}
      else{
        const any=[taps.pv,taps.pg].some(function(t){return t&&t.has});
        const age=performance.now()-startedAt;
        if(!any){code=age>6000?'noaudio':'waiting';text=age>6000?'No audio track detected':'Waiting for audio…'}
        else if(silentSince&&performance.now()-silentSince>SILENT_MS){code='silent';text='Audio is silent'}
        else{code='live';text='Live metering'}
      }
      emit(code,text);
    }
  
    function startServerPoll(){
      if(serverTimer)return;
      const poll=function(){
        if(!running||!useServer||!streamId)return;
        fetch('/api/live/streams/'+encodeURIComponent(streamId)+'/audio-level?ts='+Date.now(),{cache:'no-store'})
          .then(function(r){return r.ok?r.json():null}).then(function(d){
            if(!d)return;const v=Number.isFinite(Number(d.overall))?Number(d.overall):-120;serverDb=v<=-59.9?-120:v;serverAt=performance.now();
          }).catch(function(){});
      };
      poll();serverTimer=setInterval(poll,500);
    }
  
    function stop(){
      running=false;
      if(raf)cancelAnimationFrame(raf);raf=0;
      if(scanTimer)clearInterval(scanTimer);scanTimer=0;
      if(serverTimer)clearInterval(serverTimer);serverTimer=0;
      Object.keys(taps).forEach(function(n){if(taps[n])disconnectTap(taps[n])});taps={};
      useServer=false;silentSince=0;lastCode='';
      resetDisplay();
      try{onState('idle','Meters idle')}catch(e){}
    }
  
    function start(o){
      stop();
      running=true;startedAt=performance.now();
      streamId=o.streamId||'';onState=o.onState||function(){};
      bind(o.root||document);st=freshState();
      ensureCtx();resume();
      setTap('pv',o.preview||null);setTap('pg',o.program||null);
      lastTs=0;textTimer=0;lastCode='';
      scan();
      scanTimer=setInterval(scan,600);
      raf=requestAnimationFrame(frame);
    }
  
    return {start:start,stop:stop,resume:resume,bind:bind,reset:resetDisplay,_state:function(){return {st:st,useServer:useServer,ctx:ctx&&ctx.state}}};
  })();
  /* ==== FBI METERS ENGINE (end) ==== */
  function notify(m){if(typeof toast==='function')toast(m)}
  function bindStudioMedia(s,live){
    diag('bind-media',{ch:s&&s.name,live:!!live,status:s&&s.status,hasViewerUrl:!!(s&&s.viewer_url)});
    const pv=document.getElementById('previewVideo'),pr=document.getElementById('programVideo');
    // Stop players from the previous render so channel switches never leave
    // hidden streams downloading in the background.
    while(hlsInstances.length){try{hlsInstances.pop().destroy()}catch{}}
    // Meters read the players' audio in the browser (see FBIMeters). They never
    // re-route or change the players, so playback, mute and autoplay are untouched.
    FBIMeters.start({streamId:s.id,preview:pv,program:pr,root:document.getElementById('studio'),onState:setMeterState});
    if(!live)return;
    const publicToken=s.viewer_url?String(s.viewer_url).split('/watch/').pop().split(/[?#]/)[0]:'';
    const playbackUrl=publicToken?('/api/public/stream/'+encodeURIComponent(publicToken)+'/hls/index.m3u8'):(s.hls_url||'');
    // Preview and Program remain ordinary independent HLS players (unchanged).
    if(pv)startStandaloneHls(pv,playbackUrl,'previewStatus');
    if(pr)startStandaloneHls(pr,playbackUrl,'programStatus');
  }

  function bindStudio(s,live){
    bindStudioMedia(s,live);
    const open=()=>window.open(s.viewer_url,'_blank','noopener');
    document.getElementById('watchBtn').onclick=open;document.getElementById('openWatch').onclick=open;
    document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText('Server: '+s.rtmp_server+'\nStream Key: '+s.stream_key);notify('Encoder setup copied')}catch{notify('Could not copy')}};
    document.getElementById('fullBtn').onclick=()=>{
      const v=document.getElementById('programVideo');
      if(v?.requestFullscreen)v.requestFullscreen().catch(open);else open();
    };
    document.getElementById('muteBtn').onclick=()=>{
      const v=document.getElementById('programVideo');if(!v)return;
      v.muted=!v.muted;
      document.getElementById('muteBtn').textContent=v.muted?'UNMUTE':'MUTE';
    };
    const tvBtn=document.getElementById('tvPushBtn');
    if(tvBtn)tvBtn.onclick=async()=>{
      const on=!s.on_tv;
      if(on&&!live){notify('Go live first, then push to FBI TV');return}
      if(!on&&!confirm('Take this broadcast off FBI TV? The channel goes back to its schedule. Your watch page stays live.'))return;
      tvBtn.disabled=true;
      try{
        await api('/api/live/streams/'+encodeURIComponent(s.id)+'/tv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on})});
        streams.forEach(x=>{if(x.id===s.id)x.on_tv=on;else if(on)x.on_tv=false;});
        notify(on?'Going to FBI TV — viewers see it within a few seconds':'Taken off FBI TV');
        renderedStudioSignature='';renderStudio();
      }catch(e){tvBtn.disabled=false;notify(e.message||'Could not change FBI TV')}
    };
    const activate=()=>FBIMeters.resume().then(st=>{if(st==='running')notify('Audio meters active')});
    document.getElementById('monitorBtn').onclick=activate;
    const pill=document.getElementById('meterState');if(pill)pill.onclick=activate;
    if(window.__durationTimer)clearInterval(window.__durationTimer);
    const started=s.started_at?Date.parse(s.started_at):NaN,el=document.getElementById('duration');const tick=()=>{if(!el||!live)return;if(!Number.isFinite(started)){el.textContent='ON AIR';return}let sec=Math.max(0,Math.floor((Date.now()-started)/1000)),h=Math.floor(sec/3600);sec%=3600;let m=Math.floor(sec/60),ss=sec%60;el.textContent=(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')};tick();window.__durationTimer=setInterval(tick,1000);
  }
  let viewerCountTimer=0;
  async function refreshViewerCount(){
    try{
      const s=getSelected();
      if(!s||!s.viewer_token)return;
      const r=await api('/api/public/stream/'+encodeURIComponent(s.viewer_token)+'/status');
      const count=Number(r.current_viewers||0);
      const top=document.getElementById('viewerTop'),rack=document.getElementById('viewerRack');
      if(top)top.textContent=String(count);
      if(rack)rack.textContent=String(count);
      // Keep the selected channel card in sync without rebuilding the player.
      const card=document.querySelector('#channels [data-id="'+s.id+'"] .channel-meta');
      if(card){
        const title=esc(s.title||'');
        card.innerHTML=title+'<br>'+count+' watching now';
      }
    }catch(e){/* viewer count is non-critical; keep the current displayed value */}
  }
  function startViewerCountPolling(){
    if(viewerCountTimer)clearInterval(viewerCountTimer);
    refreshViewerCount();
    viewerCountTimer=setInterval(refreshViewerCount,2000);
  }
  let renderedStudioSignature='';
  async function load(){
    try{
      const d=await api('/api/live/streams');
      streams=d.streams||[];setEngine(true);
      if(!selectedId&&streams[0])selectedId=streams[0].id;
      if(selectedId&&!streams.some(s=>s.id===selectedId))selectedId=streams[0]?.id||null;
      renderChannels();
      const s=getSelected();
      // Keep the currently playing HLS MediaSource alive during status polling.
      // Rebuilding the video DOM every 5 seconds was causing the picture to
      // flash briefly and then return to black.
      const signature=s?[s.id,s.status,s.viewer_url||'',s.hls_url||'',s.on_tv?1:0].join('|'):'none';
      if(signature!==renderedStudioSignature){
        renderedStudioSignature=signature;
        renderStudio();
      }else if(s){
        const v=Number(s.current_viewers||0);
        const t=document.getElementById('viewerTop'),r=document.getElementById('viewerRack');
        if(t)t.textContent=String(v);if(r)r.textContent=String(v);
      }
    }catch(e){if(e.message==='Unauthorised'||e.message==='Please log in')login();else setEngine(false)}
  }
  let deferredInstallPrompt=null;
  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    deferredInstallPrompt=event;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='inline-flex';
  });
  window.addEventListener('appinstalled',()=>{
    deferredInstallPrompt=null;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='none';
  });
  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  }
  async function installLivePwa(){
    if(isStandalone())return;
    if(!deferredInstallPrompt){toast('Use your browser menu and choose Install FBI Live.');return}
    try{
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
    }catch{}
    deferredInstallPrompt=null;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='none';
  }

  async function registerLivePwa(){
    if(!('serviceWorker' in navigator))return;
    try{await navigator.serviceWorker.register('/sw.js',{scope:'/'})}catch(e){console.warn('FBI Live PWA registration failed',e)}
  }

  async function boot(){
    // The control room requires the administrator login (ADMIN_EMAIL /
    // ADMIN_PASSWORD). Every /api/live/* route is admin-only on the server.
    let me=null;try{me=await api('/api/auth/me',{cache:'no-store'})}catch(e){}
    if(!me||!me.authenticated){stopPolling();login('login');return}
    renderShell();
    const logoutBtn=document.getElementById('logoutBtn');
    if(logoutBtn)logoutBtn.onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}catch(e){}stopPolling();login('login','You have signed out.')};
    bindChannelCreator();
    bindChannelDelete();
    await load();
    startViewerCountPolling();
    if(refreshTimer)clearInterval(refreshTimer);
    refreshTimer=setInterval(load,5000);
    const installBtn=document.getElementById('installBtn');
    if(installBtn){installBtn.style.display='inline-flex';installBtn.onclick=installLivePwa}
  }  function closeChannelModal(){const m=document.getElementById('channelModal');if(m)m.classList.add('hidden')}
  function openChannelModal(){const m=document.getElementById('channelModal');if(!m)return;m.classList.remove('hidden');document.getElementById('channelResult').style.display='none';document.getElementById('newChannelName').focus()}
  function bindChannelCreator(){
    const add=document.getElementById('addChannelBtn'),close=document.getElementById('channelClose'),cancel=document.getElementById('channelCancel'),modal=document.getElementById('channelModal'),create=document.getElementById('channelCreate');
    if(add)add.onclick=openChannelModal;if(close)close.onclick=closeChannelModal;if(cancel)cancel.onclick=closeChannelModal;
    if(modal)modal.onclick=e=>{if(e.target===modal)closeChannelModal()};
    if(create)create.onclick=async function(){
      const name=document.getElementById('newChannelName').value.trim(),title=document.getElementById('newChannelTitle').value.trim(),description=document.getElementById('newChannelDescription').value.trim(),result=document.getElementById('channelResult');
      if(!name){toast('Channel name is required');return}
      create.disabled=true;create.textContent='CREATING…';
      try{
        const d=await api('/api/live/streams',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,title,description})});
        selectedId=d.stream.id;
        result.style.display='block';
        result.innerHTML='<b>Channel created. RTMP setup generated.</b><div>Server<br><code>'+esc(d.stream.rtmp_server||'')+'</code></div><div style="margin-top:6px">Stream Key<br><code>'+esc(d.stream.stream_key||'')+'</code></div>';
        await load();setTimeout(closeChannelModal,1000);
      }catch(e){toast(e.message||'Could not create channel')}
      finally{create.disabled=false;create.textContent='CREATE CHANNEL'}
    };
  }

  let deleteTarget=null;
  function fmtBytes(n){n=Number(n||0);if(n<1024)return n+' B';const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return n.toFixed(n>=10?0:1)+' '+u[i]}
  function closeDeleteModal(){const m=document.getElementById('deleteModal');if(m)m.classList.add('hidden');deleteTarget=null}
  async function openDeleteModal(id){
    const m=document.getElementById('deleteModal');if(!m||!id)return;
    const s=streams.find(x=>x.id===id);
    const body=document.getElementById('deleteBody'),wrap=document.getElementById('deleteConfirmWrap'),input=document.getElementById('deleteConfirmInput'),btn=document.getElementById('deleteConfirmBtn'),hint=document.getElementById('deleteNameHint');
    deleteTarget=null;btn.disabled=true;btn.textContent='DELETE CHANNEL';input.value='';wrap.style.display='none';
    document.getElementById('deleteTitle').textContent='Delete '+(s?.name?'"'+s.name+'"':'channel');
    body.innerHTML='<p class="channel-help">Checking channel…</p>';
    const tools=document.getElementById('toolsModal');if(tools)tools.classList.add('hidden');
    m.classList.remove('hidden');
    try{
      const d=await api('/api/live/streams/'+encodeURIComponent(id)+'/delete-check',{cache:'no-store'});
      if(d.blocked){
        body.innerHTML='<div class="delete-note">'+(d.status==='live'?'This channel is <b>live right now</b>. Stop the stream in OBS/vMix first, then delete it.':'A recording for this channel is still being saved. Try again in a few minutes.')+'</div>';
        return;
      }
      deleteTarget=d;
      const rec=d.recordings?('<li><b>'+d.recordings+' past broadcast recording'+(d.recordings===1?'':'s')+'</b> ('+esc(fmtBytes(d.bytes))+')</li>'):'<li>No past broadcast recordings</li>';
      body.innerHTML='<p class="channel-help">This permanently removes:</p><ul class="delete-list"><li>The channel, its stream key and viewer link</li>'+rec+'<li>Viewer history and comments</li></ul><div class="delete-note">This cannot be undone. Any encoder still using this stream key will stop working.</div>';
      hint.textContent=d.name;wrap.style.display='block';
      input.oninput=()=>{btn.disabled=input.value.trim()!==String(d.name||'').trim()};
      input.onkeydown=e=>{if(e.key==='Enter'&&!btn.disabled)btn.click()};
      setTimeout(()=>input.focus(),30);
    }catch(e){body.innerHTML='<div class="delete-note">'+esc(e.message||'Could not check channel')+'</div>'}
  }
  function bindChannelDelete(){
    const m=document.getElementById('deleteModal'),btn=document.getElementById('deleteConfirmBtn'),toolsDel=document.getElementById('toolsDeleteBtn');
    document.getElementById('deleteClose').onclick=closeDeleteModal;
    document.getElementById('deleteCancel').onclick=closeDeleteModal;
    m.onclick=e=>{if(e.target===m)closeDeleteModal()};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!m.classList.contains('hidden'))closeDeleteModal()});
    if(toolsDel)toolsDel.onclick=()=>{const s=getSelected();if(s)openDeleteModal(s.id)};
    btn.onclick=async()=>{
      const d=deleteTarget;if(!d)return;
      const typed=document.getElementById('deleteConfirmInput').value.trim();
      btn.disabled=true;btn.textContent='DELETING…';
      try{
        await api('/api/live/streams/'+encodeURIComponent(d.id),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm_name:typed})});
        streams=streams.filter(x=>x.id!==d.id);
        if(selectedId===d.id)selectedId=streams[0]?.id||null;
        closeDeleteModal();
        renderChannels();renderedStudioSignature='';renderStudio();
        notify('Channel "'+d.name+'" deleted');
        load();
      }catch(e){notify(e.message||'Could not delete channel');btn.disabled=false;btn.textContent='DELETE CHANNEL'}
    };
  }

  registerLivePwa();
  boot();
})();
