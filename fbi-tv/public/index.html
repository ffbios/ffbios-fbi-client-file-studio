<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FBI TV</title>
<style>
body{margin:0;background:#0b0b0d;color:#f5f5f6;font-family:Inter,system-ui,Arial,sans-serif}
.wrap{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-weight:900;letter-spacing:.18em;color:#e8c448;font-size:13px}.sub{color:#96969f;font-size:12px;margin-top:5px}
.panel{background:#121214;border:1px solid #28282d;border-radius:20px;padding:18px}.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}.list{display:grid;gap:9px}.row{background:#19191c;border:1px solid #2a2a30;border-radius:14px;padding:12px;cursor:pointer}.row.sel{border-color:#d5b33e}.row b{font-size:13px}.row span{display:block;color:#8d8d96;font-size:10px;margin-top:5px}
input,textarea{width:100%;box-sizing:border-box;background:#0d0d0f;color:#eee;border:1px solid #323238;border-radius:9px;padding:10px;font:inherit;margin:5px 0 10px}.btn{border:1px solid #34343a;border-radius:10px;padding:10px 13px;background:#1a1a1d;color:#f5f5f6;cursor:pointer}.primary{background:#e8c448;color:#171719;border-color:#e8c448}.danger{color:#ff9d9d}.setup{display:grid;grid-template-columns:1fr 1fr;gap:10px}.setup div{background:#19191c;border-radius:10px;padding:12px}.mono{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all}.status{padding:5px 8px;border-radius:999px;background:#202025;font-size:10px}.live{color:#7cf1a5}
.notice{background:#17171a;border:1px solid #2d2d32;border-radius:12px;padding:11px;color:#bcbcc4;font-size:11px;line-height:1.5}
@media(max-width:850px){.grid{grid-template-columns:1fr}.setup{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div id="app"><div class="notice">Loading FBI TV…</div></div>
<script>
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Request failed");return d}
let streams=[],selected=null;
function login(){app.innerHTML='<div class="panel" style="max-width:420px;margin:80px auto"><div class="brand">FBI TV</div><h1>FBI TV Control</h1><div class="sub">Standalone live broadcast studio</div><input id="email" value="filmbyfbi@gmail.com" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn primary" onclick="doLogin()">Sign In</button><div id="err" class="danger" style="margin-top:10px"></div></div>'}
async function doLogin(){try{await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});load()}catch(e){err.textContent=e.message}}
function render(){app.innerHTML='<div class="top"><div><div class="brand">FILM BEYOND IMAGINATION • FBI TV</div><div class="sub">Standalone Live Broadcast Studio</div></div><div><button class="btn" onclick="logout()">Logout</button> <button class="btn primary" onclick="create()">＋ New Stream</button></div></div><div class="grid"><div class="panel"><h3>Live Channels</h3><div id="list" class="list"></div></div><div id="detail" class="panel"><div class="notice">Select a channel or create a new stream.</div></div></div>' ;renderList();renderDetail()}
function renderList(){const el=document.getElementById("list");el.innerHTML=streams.length?streams.map(s=>'<div class="row '+(selected&&selected.id===s.id?'sel':'')+'" onclick="selectStream(\''+s.id+'\')"><b>'+esc(s.name)+'</b><span>'+(s.status==="live"?'● LIVE':'OFFLINE')+' • '+esc(s.title||'')+'</span></div>').join(""):'<div class="notice">No streams yet.</div>'}
function renderDetail(){const el=document.getElementById("detail");if(!selected){el.innerHTML='<div class="notice">Select a channel or create a new stream.</div>';return}el.innerHTML='<h2>'+esc(selected.title||selected.name)+'</h2><p class="sub">'+esc(selected.description||'')+'</p><div class="setup"><div><small>RTMP Server</small><div class="mono">'+esc(selected.rtmp_server||"")+'</div></div><div><small>Stream Key</small><div class="mono">'+esc(selected.stream_key||"")+'</div></div><div><small>Live Studio Link</small><div class="mono">'+location.origin+'/live/'+encodeURIComponent(selected.id)+'</div></div><div><small>Watch Page</small><div class="mono">'+esc(selected.viewer_url||"")+'</div></div></div><div style="margin-top:14px"><button class="btn" onclick="copyText(selected.viewer_url)">Copy Watch</button> <button class="btn" onclick="copyText(location.origin+'/live/'+selected.id)">Copy Live Link</button> <a class="btn primary" target="_blank" href="'+esc(selected.viewer_url||"#")+'" style="text-decoration:none;display:inline-block">Open Watch Page</a></div><hr style="border-color:#28282d;margin:18px 0"><label>Stream Name</label><input id="ename" value="'+esc(selected.name)+'"><label>On-screen Title</label><input id="etitle" value="'+esc(selected.title||"")+'"><label>Description</label><textarea id="edesc">'+esc(selected.description||"")+'</textarea><button class="btn primary" onclick="save()">Save Changes</button> <button class="btn danger" onclick="del()">Delete</button>'}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function selectStream(id){selected=streams.find(s=>s.id===id)||null;renderList();renderDetail()}
async function load(){try{const me=await api("/api/auth/me");if(!me.authenticated){login();return}const d=await api("/api/streams");streams=d.streams||[];const want=new URLSearchParams(location.search).get("stream");if(want)selected=streams.find(s=>s.id===want)||null;if(selected)selected=streams.find(s=>s.id===selected.id)||selected;if(!selected&&streams[0])selected=streams[0];render();}catch(e){app.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
async function create(){const name=prompt("Stream name");if(!name)return;try{const d=await api("/api/streams",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,title:name,description:""})});selected=d.stream;await load()}catch(e){alert(e.message)}}
async function save(){try{const d=await api("/api/streams/"+selected.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:ename.value,title:etitle.value,description:edesc.value})});selected=d.stream;await load()}catch(e){alert(e.message)}}
async function del(){if(!confirm("Delete this stream?"))return;try{await api("/api/streams/"+selected.id,{method:"DELETE"});selected=null;await load()}catch(e){alert(e.message)}}
async function logout(){await api("/api/auth/logout",{method:"POST"});load()}
function copyText(v){navigator.clipboard?.writeText(v).catch(()=>{});}
load();setInterval(()=>{if(selected)load().catch(()=>{})},7000);
</script></body></html>
