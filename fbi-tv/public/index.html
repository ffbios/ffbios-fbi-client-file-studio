<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>FBI TV • MCR</title>
<style>
:root{--bg:#07080a;--panel:#0e1014;--panel2:#12151b;--line:#252a33;--text:#f5f6f8;--muted:#88909b;--gold:#e6c44c;--green:#62e49a;--red:#ff6464;--amber:#f4b547;--blue:#68a8ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -20%,rgba(63,75,110,.24),transparent 36%),#07080a;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{outline:none}
.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.authcard{width:min(520px,100%);background:#101216;border:1px solid var(--line);border-radius:22px;box-shadow:0 35px 100px rgba(0,0,0,.6)}.authhead{padding:26px;border-bottom:1px solid var(--line)}.authhead .brand,.brand{color:var(--gold);font-weight:900;letter-spacing:.18em;font-size:12px}.authhead h1{font-size:30px;margin:9px 0 5px}.authhead p{margin:0;color:var(--muted);font-size:12px}.authbody{padding:22px 26px 26px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field select{width:100%;border:1px solid var(--line);background:#0b0d10;color:var(--text);padding:11px;border-radius:10px}.btn{border:1px solid var(--line);background:#171a20;color:var(--text);border-radius:10px;padding:10px 13px}.btn.primary{background:var(--gold);border-color:var(--gold);color:#121313;font-weight:800}.linkbtn{border:0;background:none;color:var(--gold);padding:5px 0}.authlinks{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px}.err{min-height:18px;margin-top:9px;font-size:11px;color:#ffb1b1}
#mcrRoot{min-height:100vh}.mcr-shell{min-height:100vh;background:linear-gradient(180deg,#090b0e,#07080a);padding:12px;color:#e9edf2}
.mcr-header{display:flex;align-items:center;gap:14px;padding:10px 10px 13px;border-bottom:1px solid var(--line);background:rgba(7,8,10,.96);position:sticky;top:0;z-index:50}.mcr-brand{display:flex;align-items:center;gap:10px;min-width:250px}.mcr-logo-mark{width:42px;height:34px;border:1px solid #5b4d1e;background:#17150b;color:var(--gold);display:grid;place-items:center;font-weight:950;font-size:12px;letter-spacing:.12em}.mcr-brand-name{font-size:15px;font-weight:900;letter-spacing:.12em}.mcr-brand-sub{font-size:8px;color:#737b86;letter-spacing:.14em;margin-top:3px}.mcr-head-status{display:flex;align-items:center;gap:8px;font-size:9px;color:#9ea6b1;flex:1;justify-content:center}.mcr-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px currentColor}.mcr-dot.green{color:var(--green);background:var(--green)}.mcr-divider{height:14px;width:1px;background:#2b3038}.mcr-head-actions{display:flex;gap:7px}.mcr-btn{border:1px solid #303640;background:#12151a;color:#e8ebef;border-radius:8px;padding:8px 11px;font-size:9px;font-weight:850;letter-spacing:.06em}.mcr-btn.gold{background:var(--gold);border-color:var(--gold);color:#111}.mcr-btn.red{background:#351313;border-color:#6a2626;color:#ffb1b1}.mcr-btn.ghost{background:#111419}
.mcr-main-grid{display:grid;grid-template-columns:minmax(0,1fr) 355px;gap:12px;padding-top:12px}.mcr-multiview-panel,.mcr-side-panel,.mcr-bottom-panel{background:#0c0f13;border:1px solid var(--line);border-radius:12px;overflow:hidden}.mcr-section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 13px;border-bottom:1px solid var(--line)}.mcr-section-head.compact{align-items:center}.mcr-eyebrow{font-size:8px;color:#69727d;letter-spacing:.18em;font-weight:900}.mcr-section-head h2{font-size:13px;margin:4px 0 2px}.mcr-section-head p{margin:0;color:#79818b;font-size:9px}.mcr-head-badges{display:flex;gap:6px}.mcr-head-badges span{padding:5px 7px;border:1px solid #2d323a;border-radius:999px;color:#9fa7b1;font-size:8px}.mcr-multiview{padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-content:start}.mcr-tile{min-width:0}.mcr-tile-screen{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid #252a30;border-radius:8px;background:#020304}.mcr-tile-screen::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}.mcr-source-video{width:100%;height:100%;display:block;object-fit:cover;background:#000}.mcr-video-status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;padding:6px 9px;border-radius:6px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.12);color:#b9c1ca;font-size:8px;pointer-events:none}.mcr-no-signal,.mcr-monitor-empty{height:100%;display:grid;place-items:center;align-content:center;gap:4px;background:radial-gradient(circle at 50% 35%,#16191e,#050607);color:#707984;text-align:center}.mcr-no-signal b,.mcr-monitor-empty b{font-size:10px;letter-spacing:.12em}.mcr-no-signal span,.mcr-monitor-empty span{font-size:8px}.mcr-tile-top{position:absolute;left:6px;right:6px;top:6px;display:flex;justify-content:space-between;z-index:4}.mcr-chan,.mcr-live{font-size:7px;padding:4px 5px;border-radius:4px;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.1);color:#c4cbd3}.mcr-live.on{color:var(--green);border-color:rgba(98,228,154,.35)}.mcr-tile-bottom{position:absolute;left:6px;right:6px;bottom:6px;display:flex;justify-content:space-between;gap:6px;align-items:flex-end;z-index:4}.mcr-tile-bottom>div:first-child{min-width:0}.mcr-tile-bottom b,.mcr-tile-bottom span{display:block;background:rgba(0,0,0,.62);padding:2px 4px;border-radius:3px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mcr-tile-bottom b{font-size:8px}.mcr-tile-bottom span{font-size:7px;color:#b0b7c0;margin-top:2px}.mcr-route-tags{font-size:7px;color:var(--gold);background:rgba(0,0,0,.65);padding:4px;border:1px solid rgba(230,196,76,.28);border-radius:4px}.mcr-tile.program .mcr-tile-screen{border-color:rgba(230,196,76,.75);box-shadow:0 0 0 1px rgba(230,196,76,.16),0 0 24px rgba(230,196,76,.08)}.mcr-tile.preview .mcr-tile-screen{border-color:rgba(104,168,255,.75)}.mcr-tile-controls{display:flex;gap:5px;margin-top:5px}.mcr-small{border:1px solid #2c323a;background:#13171c;color:#c9cfd6;border-radius:5px;padding:5px 6px;font-size:7px;font-weight:850}.mcr-small.active{border-color:#b99a2c;background:#28230f;color:var(--gold)}
.mcr-side-panel{padding:9px;display:grid;gap:9px;align-content:start}.mcr-bus-card{border:1px solid #2a3038;background:#080a0d;border-radius:9px;overflow:hidden}.mcr-bus-head{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-bottom:1px solid #1e232a;background:#0d1014}.mcr-bus-label{font-size:8px;font-weight:900;letter-spacing:.18em}.mcr-onair,.mcr-preview-state{font-size:7px;color:#7f8790;padding:4px 6px;border:1px solid #2b3138;border-radius:4px}.mcr-onair.on{color:var(--green);border-color:rgba(98,228,154,.32)}.mcr-big-monitor{aspect-ratio:16/9;background:#020304}.mcr-big-monitor video,.mcr-preview-monitor video{width:100%;height:100%;display:block;object-fit:cover}.mcr-preview-monitor{aspect-ratio:16/9;background:#020304}.mcr-bus-source{padding:8px 9px}.mcr-bus-source b,.mcr-bus-source span{display:block}.mcr-bus-source b{font-size:9px}.mcr-bus-source span{font-size:7px;color:#6f7883;margin-top:3px}.preview-bus{border-color:rgba(104,168,255,.24)}.mcr-take-deck{border:1px solid #2a3038;border-radius:9px;padding:9px;background:#0c0f13}.mcr-take-title{font-size:8px;color:#747d87;letter-spacing:.12em;font-weight:900}.mcr-route-info{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px;padding:8px 0}.mcr-route-info div{min-width:0}.mcr-route-info span{font-size:7px;color:#69717a;display:block}.mcr-route-info b{display:block;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.arrow{font-size:18px;color:var(--gold);text-align:center}.mcr-route-buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.wide{width:100%}.mcr-btn:disabled,.mcr-small:disabled{opacity:.35;cursor:not-allowed}.mcr-program-link{padding:7px 0 0}.mcr-program-link>span{display:block;color:#6d747e;font-size:7px;letter-spacing:.1em;margin-bottom:4px}.mcr-program-link div{display:flex;gap:5px}.mcr-program-link input{min-width:0;flex:1;border:1px solid #272d35;background:#090b0e;color:#9aa2ac;border-radius:5px;padding:6px;font-family:ui-monospace,monospace;font-size:7px}
.mcr-bottom-panel{margin-top:12px}.mcr-bottom-note{font-size:8px;color:#6f7882;max-width:470px;text-align:right}.mcr-encoder-table{overflow:auto}.mcr-tr{display:grid;grid-template-columns:1.15fr .7fr 1.15fr 1.35fr 1.2fr 1.05fr 42px;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid #1d2229;min-width:980px}.mcr-th{border-top:0;color:#68717c;font-size:7px;letter-spacing:.12em;font-weight:900}.mcr-tr>span{min-width:0;font-size:7px;color:#b9c0c8}.mcr-code{font-family:ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8c98a4!important}.mcr-status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;background:#5c6570}.mcr-status-dot.live{background:var(--green);box-shadow:0 0 9px rgba(98,228,154,.35)}.mcr-status-dot.offline{background:#555b64}.mcr-empty,.mcr-empty-row{grid-column:1/-1;padding:28px;text-align:center;color:#69727b;display:grid;gap:6px;place-items:center;font-size:9px}.mcr-empty b{color:#b6bdc6;font-size:11px}
.mcr-modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(0,0,0,.74);padding:18px}.mcr-modal-card{width:min(720px,100%);background:#0d1014;border:1px solid #303640;border-radius:12px;box-shadow:0 35px 100px rgba(0,0,0,.65);overflow:hidden}.mcr-modal-head,.mcr-modal-foot{padding:10px 12px;border-bottom:1px solid #242a32;display:flex;align-items:center;justify-content:space-between;gap:8px}.mcr-modal-foot{border-top:1px solid #242a32;border-bottom:0;justify-content:flex-end}.mcr-modal-close{border:0;background:none;color:#87909a;font-size:20px}.mcr-modal-body{padding:14px}.mcr-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcr-form-grid label{font-size:8px;color:#77808b;display:grid;gap:5px}.mcr-form-grid input,.mcr-form-grid textarea{width:100%;border:1px solid #2a3038;background:#080a0d;color:#e6e9ed;border-radius:7px;padding:8px;font-size:9px}.mcr-form-grid textarea{min-height:70px;resize:vertical}.mcr-form-grid .full{grid-column:1/-1}.mcr-credential-card{border:1px solid #292f37;background:#090b0e;border-radius:7px;padding:8px}.mcr-credential-card>span{display:block;font-size:7px;color:#6d7580;letter-spacing:.08em;margin-bottom:5px}.mcr-credential-card>div{display:flex;gap:5px}.mcr-credential-card input{flex:1;font-family:ui-monospace,monospace}.mcr-error{padding:40px;text-align:center;color:#ffb2b2}
@media(max-width:1150px){.mcr-main-grid{grid-template-columns:1fr}.mcr-multiview{grid-template-columns:repeat(3,minmax(0,1fr))}.mcr-side-panel{grid-template-columns:1fr 1fr}.mcr-take-deck,.mcr-program-link{grid-column:1/-1}}
@media(max-width:800px){.mcr-header{flex-wrap:wrap}.mcr-brand{min-width:0;flex:1}.mcr-head-status{order:3;width:100%;justify-content:flex-start}.mcr-head-actions{width:100%}.mcr-head-actions .mcr-btn{flex:1}.mcr-multiview{grid-template-columns:repeat(2,minmax(0,1fr))}.mcr-side-panel{grid-template-columns:1fr}.mcr-take-deck,.mcr-program-link{grid-column:auto}.mcr-bottom-note{display:none}.mcr-form-grid{grid-template-columns:1fr}}
@media(max-width:520px){.mcr-multiview{grid-template-columns:1fr}.mcr-route-buttons{grid-template-columns:1fr}.mcr-logo-mark{display:none}}
</style>
</head>
<body>
<div id="authView" class="auth"></div>
<div id="studioView" class="hidden"><div id="mcrRoot"></div></div>
<script>
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Request failed");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script>
<script src="/mcr-ui.js?v=9"></script>
<script src="/local-studio.js?v=1"></script>
<script>
const authView=document.getElementById("authView"),studio=document.getElementById("studioView");
function loginScreen(message=""){authView.innerHTML='<div class="authcard"><div class="authhead"><div class="brand">FBI TV</div><h1>Master Control</h1><p>FBI TV • Multi-Input Broadcast Control Center</p></div><div class="authbody"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="manager@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div><button class="btn primary" id="signIn">SIGN IN</button><div id="authErr" class="err">'+esc(message)+'</div><div class="authlinks"><button class="linkbtn" id="createAccount">Create Admin Account</button><button class="linkbtn" id="forgot">Forgot Password?</button></div></div></div>';document.getElementById("signIn").onclick=async()=>{try{await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});showStudio()}catch(e){document.getElementById("authErr").textContent=e.message}};document.getElementById("createAccount").onclick=registerScreen;document.getElementById("forgot").onclick=forgotScreen;password.onkeydown=e=>{if(e.key==="Enter")document.getElementById("signIn").click()}}
async function registerScreen(){try{const s=await api("/api/auth/status");if(s.hasAdmin){loginScreen("An administrator already exists. Ask an existing administrator to add another account.");return}const qs=s.securityQuestions||[];authView.innerHTML='<div class="authcard"><div class="authhead"><div class="brand">FBI TV</div><h1>Create Admin Account</h1><p>The first account becomes the FBI TV Administrator.</p></div><div class="authbody"><div class="field"><label>Full Name</label><input id="fullName" autocomplete="name"></div><div class="field"><label>Email Address</label><input id="regEmail" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="regPass" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm Password</label><input id="regPass2" type="password" autocomplete="new-password"></div>'+[0,1,2].map(i=>'<div class="field"><label>Security Question '+(i+1)+'</label><select id="q'+i+'">'+qs.map(q=>'<option value="'+esc(q)+'">'+esc(q)+'</option>').join("")+'</select><input id="a'+i+'" placeholder="Your answer" autocomplete="off"></div>').join("")+'<button class="btn primary" id="registerBtn">CREATE ADMINISTRATOR</button> <button class="btn" id="back">BACK</button><div id="authErr" class="err"></div></div></div>';document.getElementById("registerBtn").onclick=async()=>{try{await api("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName:fullName.value,email:regEmail.value,password:regPass.value,confirmPassword:regPass2.value,questions:[q0.value,q1.value,q2.value],answers:[a0.value,a1.value,a2.value]})});showStudio()}catch(e){authErr.textContent=e.message}};document.getElementById("back").onclick=loginScreen}catch(e){loginScreen(e.message)}}
async function forgotScreen(){authView.innerHTML='<div class="authcard"><div class="authhead"><div class="brand">FBI TV</div><h1>Forgot Password</h1><p>Recover access with your registered security questions.</p></div><div class="authbody"><div class="field"><label>Email Address</label><input id="forgotEmail" type="email" autocomplete="email"></div><button class="btn primary" id="fc">CONTINUE</button> <button class="btn" id="fb">BACK</button><div id="authErr" class="err"></div></div></div>';fb.onclick=loginScreen;fc.onclick=async()=>{try{const d=await api("/api/auth/forgot/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:forgotEmail.value})});authView.innerHTML='<div class="authcard"><div class="authhead"><div class="brand">FBI TV</div><h1>Security Verification</h1><p>Answer all three registered security questions.</p></div><div class="authbody">'+d.questions.map((q,i)=>'<div class="field"><label>Question '+(i+1)+'</label><div style="font-size:9px;color:#aeb5be;padding:8px;border:1px solid #292f37;background:#0a0c0f;border-radius:7px">'+esc(q)+'</div><input id="ra'+i+'" placeholder="Your answer"></div>').join("")+'<div class="field"><label>New Password</label><input id="newPass" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm New Password</label><input id="newPass2" type="password" autocomplete="new-password"></div><button class="btn primary" id="resetBtn">RESET PASSWORD</button> <button class="btn" id="cancel">CANCEL</button><div id="authErr" class="err"></div></div></div>';cancel.onclick=loginScreen;resetBtn.onclick=async()=>{try{await api("/api/auth/forgot/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({resetToken:d.resetToken,answers:[ra0.value,ra1.value,ra2.value],password:newPass.value,confirmPassword:newPass2.value})});showStudio()}catch(e){authErr.textContent=e.message}}}catch(e){document.getElementById("authErr").textContent=e.message}}}
function showStudio(){authView.classList.add("hidden");studioView.classList.remove("hidden");startMcr()}
(async()=>{try{const me=await api("/api/auth/me");if(me.authenticated){showStudio()}else{const s=await api("/api/auth/status");if(s.hasAdmin)loginScreen();else registerScreen()}}catch(e){authView.innerHTML='<div class="authcard"><div class="authbody"><div class="err">'+esc(e.message)+'</div></div></div>'}})();
</script>
</body>
</html>
