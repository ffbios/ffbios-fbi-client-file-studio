<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>FBI TV</title>
<style>
:root{--bg:#09090b;--border:#28282d;--text:#f5f5f7;--muted:#9d9da6;--gold:#d4af37;--gold2:#f0cf6a;--r:18px;--shadow:0 20px 60px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#080809,#0d0d10);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.smallnote{font-size:10px;color:var(--muted);line-height:1.5}.empty{padding:28px;text-align:center;color:var(--muted);font-size:11px}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.panel{border:1px solid var(--border);background:rgba(19,19,21,.96);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}.ph{padding:16px 17px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center}.ph h2{font-size:14px;margin:0}.ph p{font-size:10px;color:var(--muted);margin:3px 0 0}.body{padding:14px 16px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.field input,.field textarea,.field select{width:100%;padding:10px;border-radius:10px;background:#0e0e10;color:var(--text);border:1px solid var(--border);outline:none}.field textarea{min-height:75px;resize:vertical}.settinggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:#0f0f11;padding:11px;border-radius:10px}.toggle input{width:17px;height:17px}.btn{border:1px solid var(--border);background:#17171b;color:var(--text);border-radius:11px;padding:10px 13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{border-color:#42424b;transform:translateY(-1px)}.btn.primary{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#111;border-color:#d1aa2e;font-weight:800}.btn.danger{color:#fecdd3}.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;padding:18px;z-index:80}.modal.show{display:flex}.box{width:min(520px,100%);background:#151517;border:1px solid var(--border);border-radius:17px;overflow:hidden}.mh{padding:15px 17px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.mb{padding:18px}.mf{padding:14px 17px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:transparent;color:var(--muted);font-size:20px}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.authcard{width:min(520px,100%);background:rgba(18,18,21,.96);border:1px solid var(--border);border-radius:24px;box-shadow:0 35px 100px rgba(0,0,0,.55);overflow:hidden}.authhead{padding:26px;border-bottom:1px solid var(--border)}.authhead h1{font-size:28px;margin:8px 0 5px}.authhead p{margin:0;color:var(--muted);font-size:12px}.authbody{padding:22px 26px 26px}.authlinks{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.linkbtn{border:0;background:none;color:#e8c448;cursor:pointer;padding:4px 0;font:inherit}.err{color:#fecaca;font-size:11px;min-height:18px;margin-top:8px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border);background:rgba(9,9,11,.92);position:sticky;top:0;z-index:30}.brand{font-weight:900;letter-spacing:.16em;color:var(--gold);font-size:12px}.sub{color:var(--muted);font-size:10px;margin-top:4px}.top-actions{display:flex;gap:8px}
@media(max-width:900px){.settinggrid{grid-template-columns:1fr}}@media(max-width:700px){.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions .btn{flex:1}}
</style>
</head>
<body>
<div id="authView" class="auth"></div>
<div id="studioView" class="hidden">
  <div class="topbar">
    <div><div class="brand">FILM BEYOND IMAGINATION • FBI TV</div><div class="sub">FBI Live Broadcast Studio</div></div>
    <div class="top-actions"><button class="btn" id="logoutBtn">Logout</button></div>
  </div>
  <main style="padding:18px"><div id="content"></div></main>
</div>
<div id="streamModal" class="modal"><div class="box"><div class="mh"><b>Create Live Stream</b><button class="close" id="smc">×</button></div><div class="mb"><div class="field"><label>Stream Name</label><input id="streamName" placeholder="e.g. Sunday Service Live"></div><div class="field"><label>On-screen Title</label><input id="streamTitle" placeholder="Title viewers will see"></div><div class="field"><label>Description</label><textarea id="streamDesc" placeholder="Optional description"></textarea></div><div class="notice">A unique RTMP server address, stream key and viewer link will be generated automatically.</div></div><div class="mf"><button class="btn" id="smcan">Cancel</button><button class="btn primary" id="smcreate">Create Stream</button></div></div></div>

<script>
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Request failed");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function fmt(n){n=Number(n||0);if(!n)return"0 B";const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return(i?(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.round(n)):"0")+" "+u[i]}
function toast(msg){const old=document.getElementById("fbiToast");if(old)old.remove();const t=document.createElement("div");t.id="fbiToast";t.textContent=msg;t.style.cssText="position:fixed;right:18px;bottom:18px;z-index:120;padding:11px 13px;border:1px solid #28282d;background:#1b1b1e;color:#f4f4f6;border-radius:11px;font-size:11px;box-shadow:0 10px 30px rgba(0,0,0,.25)";document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function copyText(value){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(value).then(()=>toast("Copied")).catch(()=>toast("Copy failed"));else{const t=document.createElement("textarea");t.value=value;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();toast("Copied")}}
</script>
<script src="/stream-support.js?v=1"></script>
<script src="/stream-ui.js?v=13"></script>
<script>
let securityQuestions=[];
function loginScreen(message=""){authView.innerHTML='<div class="authcard"><div class="authhead"><div class="brand">FBI TV</div><h1>FBI TV Control</h1><p>Standalone Live Broadcast Studio</p></div><div class="authbody"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="manager@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div><button class="btn primary" id="signIn">Sign In</button><div id="authErr" class="err">\${esc(message)}</div><div class="authlinks"><button class="linkbtn" id="createAccount">Create Admin Account</button><button class="linkbtn" id="forgot">Forgot Password?</button></div></div></div>';document.getElementById("signIn").onclick=async()=>{try{await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});showStudio()}catch(e){document.getElementById("authErr").textContent=e.message}};document.getElementById("createAccount").onclick=registerScreen;document.getElementById("forgot").onclick=forgotStart;document.getElementById("password").onkeydown=e=>{if(e.key==="Enter")document.getElementById("signIn").click()}}
async function registerScreen(){try{const s=await api("/api/auth/status");if(s.hasAdmin){loginScreen("An administrator already exists. Ask an existing administrator to add your account.");return}securityQuestions=s.securityQuestions||[];authView.innerHTML='<div class="authcard"><div class="authhead"><div class="brand">FBI TV</div><h1>Create Admin Account</h1><p>This first account becomes the FBI TV Administrator.</p></div><div class="authbody"><div class="field"><label>Full Name</label><input id="fullName" autocomplete="name" placeholder="Administrator name"></div><div class="field"><label>Email Address</label><input id="regEmail" type="email" autocomplete="email" placeholder="manager@example.com"></div><div class="field"><label>Password</label><input id="regPass" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm Password</label><input id="regPass2" type="password" autocomplete="new-password"></div><hr style="border-color:#28282d;margin:15px 0"><div class="smallnote">Choose three different security questions. These are used to restore access if the password is forgotten.</div>'+[0,1,2].map(i=>'<div class="field"><label>Security Question '+(i+1)+'</label><select id="q'+i+'">'+securityQuestions.map(q=>'<option value="'+esc(q)+'">'+esc(q)+'</option>').join("")+'</select><input id="a'+i+'" placeholder="Your answer" autocomplete="off"></div>').join("")+'<button class="btn primary" id="registerBtn">Create Administrator</button> <button class="btn" id="backBtn">Back to Sign In</button><div id="authErr" class="err"></div></div></div>';document.getElementById("backBtn").onclick=loginScreen;document.getElementById("registerBtn").onclick=async()=>{try{await api("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName:fullName.value,email:regEmail.value,password:regPass.value,confirmPassword:regPass2.value,questions:[q0.value,q1.value,q2.value],answers:[a0.value,a1.value,a2.value]})});showStudio()}catch(e){document.getElementById("authErr").textContent=e.message}}}catch(e){loginScreen(e.message)}}
async function forgotStart(){authView.innerHTML='<div class="authcard"><div class="authhead"><div class="brand">FBI TV</div><h1>Forgot Password</h1><p>Enter the email address used for the FBI TV administrator account.</p></div><div class="authbody"><div class="field"><label>Email Address</label><input id="forgotEmail" type="email" autocomplete="email" placeholder="manager@example.com"></div><button class="btn primary" id="forgotContinue">Continue</button> <button class="btn" id="forgotBack">Back</button><div id="authErr" class="err"></div></div></div>';document.getElementById("forgotBack").onclick=loginScreen;document.getElementById("forgotContinue").onclick=async()=>{try{const d=await api("/api/auth/forgot/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:forgotEmail.value})});resetScreen(d)}catch(e){document.getElementById("authErr").textContent=e.message}}}
function resetScreen(d){authView.innerHTML='<div class="authcard"><div class="authhead"><div class="brand">FBI TV</div><h1>Security Verification</h1><p>Answer all three security questions to create a new password.</p></div><div class="authbody">'+d.questions.map((q,i)=>'<div class="field"><label>Security Question '+(i+1)+'</label><div class="notice" style="margin-top:0">'+esc(q)+'</div><input id="ra'+i+'" placeholder="Your answer" autocomplete="off"></div>').join("")+'<div class="field"><label>New Password</label><input id="newPass" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm New Password</label><input id="newPass2" type="password" autocomplete="new-password"></div><button class="btn primary" id="resetBtn">Reset Password</button> <button class="btn" id="cancelReset">Cancel</button><div id="authErr" class="err"></div></div></div>';document.getElementById("cancelReset").onclick=loginScreen;document.getElementById("resetBtn").onclick=async()=>{try{await api("/api/auth/forgot/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({resetToken:d.resetToken,answers:[ra0.value,ra1.value,ra2.value],password:newPass.value,confirmPassword:newPass2.value})});showStudio()}catch(e){document.getElementById("authErr").textContent=e.message}}}
function showStudio(){authView.classList.add("hidden");studioView.classList.remove("hidden");activeStudioView="streams";renderStreamsPage()}
document.getElementById("logoutBtn").onclick=async()=>{await api("/api/auth/logout",{method:"POST"});location.reload()};
document.getElementById("smc").onclick=()=>document.getElementById("streamModal").classList.remove("show");document.getElementById("smcan").onclick=()=>document.getElementById("streamModal").classList.remove("show");
document.getElementById("smcreate").onclick=async()=>{try{const name=document.getElementById("streamName").value.trim();if(!name){toast("Stream name is required");return}const r=await api("/api/streams",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,title:document.getElementById("streamTitle").value,description:document.getElementById("streamDesc").value})});document.getElementById("streamModal").classList.remove("show");document.getElementById("streamName").value="";document.getElementById("streamTitle").value="";document.getElementById("streamDesc").value="";selectedStreamId=r.stream.id;renderedStreamSignature="";await loadStreams();toast("Stream created")}catch(e){toast(e.message)}};
(async()=>{try{const me=await api("/api/auth/me");if(me.authenticated){showStudio();return}const s=await api("/api/auth/status");if(s.hasAdmin)loginScreen();else registerScreen()}catch(e){authView.innerHTML='<div class="authcard"><div class="authbody"><div class="err">'+esc(e.message)+'</div></div></div>'}})();
</script>
</body></html>
