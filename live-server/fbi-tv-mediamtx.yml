logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:

rtmp: true
rtmpAddress: :1935

rtsp: true
rtspAddress: :8554

hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: true
hlsVariant: mpegts
hlsSegmentCount: 6
hlsSegmentDuration: 2s

paths:
  # Bridge the existing FBI TV public RTMP input into this exact
  # proven normalization engine without changing the public RTMP endpoint.
  ~^pull/live/(.+)$:
    # Pull the existing FBI TV RTMP input directly. This avoids the RTP/UDP
    # packet-loss seen when the bridge used RTSP.
    source: rtmp://fbi-tv-media:1935/live/$G1
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    runOnReady: >
      ffmpeg -hide_banner -loglevel warning
      -i rtmp://127.0.0.1:1935/$MTX_PATH
      -map 0:v:0
      -map 0:a:0?
      -c:v libx264 -preset ultrafast -tune zerolatency
      -pix_fmt yuv420p -profile:v main -level 4.1
      -r 30 -g 60 -keyint_min 60 -sc_threshold 0
      -b:v 5M -maxrate 6M -bufsize 10M
      -c:a aac -b:a 128k -ar 48000 -ac 2
      -f flv rtmp://127.0.0.1:1935/encoded/$G1
    runOnReadyRestart: yes

  # Keep the direct-publish path identical to the proven engine for
  # future encoders that publish directly to FBI TV Live Ingest.
  ~^live/(.+)$:
    runOnReady: >
      ffmpeg -hide_banner -loglevel warning
      -i rtmp://127.0.0.1:1935/$MTX_PATH
      -map 0:v:0
      -map 0:a:0?
      -c:v libx264 -preset ultrafast -tune zerolatency
      -pix_fmt yuv420p -profile:v main -level 4.1
      -r 30 -g 60 -keyint_min 60 -sc_threshold 0
      -b:v 5M -maxrate 6M -bufsize 10M
      -c:a aac -b:a 128k -ar 48000 -ac 2
      -f flv rtmp://127.0.0.1:1935/encoded/$G1
    runOnReadyRestart: yes

  all_others:
