logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:

rtmp: true
rtmpAddress: :1935

rtsp: true
rtspAddress: :8554

hls: true
hlsAddress: :8888
hlsAllowOrigins: ["https://fbi-client-file-studio-production.up.railway.app","https://files.fbigh.com"]
hlsAlwaysRemux: true
hlsVariant: mpegts
hlsSegmentCount: 6
hlsSegmentDuration: 2s

# Normalize incoming RTMP feeds to a browser-safe H.264/AAC stream.
# MediaMTX starts this encoder when a live input becomes available.
paths:
  ~^live/(.+)$:
    runOnReady: >
      ffmpeg -hide_banner -loglevel warning
      -i rtmp://127.0.0.1:1935/$MTX_PATH
      -map 0:v:0
      -map 0:a:0?
      -c:v libx264 -preset ultrafast -tune zerolatency
      -pix_fmt yuv420p -profile:v main -level 4.1
      -r 30 -g 60 -keyint_min 60 -sc_threshold 0
      -b:v 5M -maxrate 6M -bufsize 10M
      -c:a aac -b:a 128k -ar 48000 -ac 2
      -f flv rtmp://127.0.0.1:1935/encoded/$G1
    runOnReadyRestart: yes

  all_others:
