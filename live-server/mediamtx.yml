logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:

rtmp: true
rtmpAddress: :1935

rtsp: true
rtspAddress: :8554

hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: true
hlsVariant: mpegts
hlsSegmentCount: 6
hlsSegmentDuration: 2s

# The existing browser-safe H.264/AAC stream remains the primary feed.
# An additive FFmpeg ladder publishes separate quality renditions under
# quality/<height>/<stream-key> for viewer-selectable HLS playback.
paths:
  ~^live/(.+)$:
    runOnReady: >
      /usr/local/bin/fbi-live-encode "$MTX_PATH" "$G1"
    runOnReadyRestart: yes

  all_others:
